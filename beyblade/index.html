<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Beyblade: Let It Rip!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Resources on top, a scrolling view in the middle, a five-tab nav at the bottom;
   battles open as a full-screen overlay. Single dark look: a Beystadium under the lights, BBA blue with orange. */
:root{
  --space:#050a18; --hull:#0b1428; --hull2:#111d38; --hull3:#182848; --line:#22355e; --line2:#34508a;
  --text:#eef3fc; --dim:#a3b2cf; --faint:#6a7a9c;
  --gold:#ff8a1a; --gold2:#b8480a; --gold-ink:#fff8ee; --holo:#7ad0ff; --moon:#ffd34d;
  --ls:#4aa3ff; --ls-deep:#0f2a52; --ds:#ff4b4b; --ds-deep:#4a0d16;
  --hp:#3ddc84; --prot:#d7deec; --tm:#5fd4ff;
  --buff:#43d67e; --debuff:#ff5c5c; --crit:#ffd34d; --heal:#5dfc9b;
  --g1:#a3adc2; --g2:#4fd17f; --g3:#3fa7ff; --g4:#b26bff; --g5:#f2c14e;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-title:"Russo One","Arial Black",Impact,sans-serif;
  --f-body:"Barlow Semi Condensed","Segoe UI",Roboto,Arial,sans-serif;
  --cut:10px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box;background:var(--space)}
body{height:100%;margin:0;background:var(--space);color:var(--text);font:15px/1.35 var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}

/* ---------- app shell ---------- */
#app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;position:relative;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 72% 9%,#fff6 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 42%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 33% 63%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 85%,#fff6 50%,transparent 51%),
    radial-gradient(60% 34% at 84% -4%,#1a3a8a 0%,transparent 70%),
    radial-gradient(120% 60% at 50% -10%,#10204a 0%,transparent 60%),
    var(--space)}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:linear-gradient(180deg,#0d1730,#0a1222);border-bottom:1px solid var(--line)}
.me{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.me-badge{width:34px;height:34px;flex:none;display:grid;place-items:center;font:800 15px var(--f-display);color:var(--gold-ink);
  background:linear-gradient(135deg,var(--gold),var(--gold2));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.me-name{font:700 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-xp{height:3px;background:var(--hull3);margin-top:3px;width:80px;max-width:100%}
.me-xp i{display:block;height:100%;background:var(--holo)}
.res{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;background:var(--hull2);border:1px solid var(--line);border-radius:999px;
  font:700 13px var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px;flex:none}
.pill small{font:500 10px var(--f-body);color:var(--dim)}
#view{overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#080e1b;border-top:1px solid var(--line)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--faint);
  font:700 11px var(--f-display);letter-spacing:.06em;text-transform:uppercase;position:relative;white-space:nowrap}
#tabs button svg{width:22px;height:22px}
@media (max-width:400px){#tabs button{font-size:10px;letter-spacing:.03em}}
#tabs button.on{color:var(--gold)}
#tabs button.on::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dot{position:absolute;top:5px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--ds);box-shadow:0 0 6px var(--ds)}

/* ---------- type ---------- */
h1,h2,h3{margin:0;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;text-wrap:balance;line-height:1.05}
h1{font-size:30px;font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:15px;font-weight:700}
.eyebrow{font:700 11px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--holo)}
.dim{color:var(--dim)} .small{font-size:12.5px} .tiny{font-size:11px}
.ls{color:var(--ls)} .ds{color:var(--ds)} .gold{color:var(--gold)}
p{margin:0}

/* ---------- surfaces ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel{background:var(--hull);border:1px solid var(--line);padding:12px;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.sub{background:var(--hull2);border:1px solid var(--line);border-radius:6px;padding:10px}
.divider{height:1px;background:var(--line);margin:2px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border:1px solid var(--line2);border-radius:999px;font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--hull)}
.chip.on{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.chip:disabled{opacity:.35}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font:700 10.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--hull3);color:var(--dim)}
.tag.ls{background:color-mix(in srgb,var(--ls) 18%,transparent);color:var(--ls)}
.tag.ds{background:color-mix(in srgb,var(--ds) 18%,transparent);color:var(--ds)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;
  font:800 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);
  background:linear-gradient(180deg,#ffd877,var(--gold) 45%,var(--gold2));
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:filter .12s,transform .08s}
.btn:active{transform:translateY(1px);filter:brightness(.92)}
.btn.blue{color:#04121f;background:linear-gradient(180deg,#9be6ff,var(--holo) 45%,#2a8fbf)}
.btn.ghost{color:var(--text);background:var(--hull3);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.red{color:#fff;background:linear-gradient(180deg,#ff7b7b,var(--ds) 50%,#a51e2a)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{filter:grayscale(1) brightness(.55);pointer-events:none}
.cost{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.cost svg{width:14px;height:14px}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;padding:18px 16px 16px;min-height:150px;
  background:radial-gradient(90% 120% at 100% 0%,#1d3c78 0%,transparent 60%),radial-gradient(70% 90% at 0% 100%,#4a1020 0%,transparent 60%),var(--hull)}
.hero h1{font-size:38px;line-height:.9;letter-spacing:.04em}
.hero h1 span{display:block;color:var(--gold);font-size:22px;letter-spacing:.32em}
.gp{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.gp b{font:800 26px var(--f-display);color:var(--holo);font-variant-numeric:tabular-nums}
.hero-art{position:absolute;right:-30px;bottom:-8px;width:230px;max-width:62%;opacity:.95;pointer-events:none}
.hero > *{position:relative}
.hero .hero-art{position:absolute}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:96px;padding:12px;
  background:var(--hull2);border:1px solid var(--line);overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.tile h3{font-size:17px;padding-right:30px}
.tile h3.long{font-size:15px;line-height:1.1}
.tile .tsub{font-size:12px;color:var(--dim)}
.tile .ticon{position:absolute;right:8px;top:8px;width:40px;height:40px;opacity:.85}
.tile .ticon svg{width:100%;height:100%}
.tile:disabled{opacity:.45}
.tile{color:var(--text)}
.tile.ls-t{background:linear-gradient(140deg,var(--ls-deep),var(--hull2) 70%)}
.tile.ds-t{background:linear-gradient(140deg,var(--ds-deep),var(--hull2) 70%)}
.tile.wide{grid-column:1/-1;min-height:74px}
.tile .badge{position:absolute;left:12px;top:10px}
.hint{color:var(--text);text-align:left;display:flex;gap:10px;align-items:center;padding:10px 12px;border-left:3px solid var(--holo);background:linear-gradient(90deg,#0f2840,transparent)}

/* ---------- portraits ---------- */
.pt{position:relative;width:var(--s,72px);flex:none;text-align:center}
.pt .ring{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;padding:3px;background:var(--gc,var(--g1));
  box-shadow:0 0 0 1px #0008,0 0 12px color-mix(in srgb,var(--gc,var(--g1)) 35%,transparent)}
.pt .ring img{display:block;width:100%;height:100%;border-radius:50%;pointer-events:none}
.pt .lv{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);min-width:22px;padding:0 4px;height:18px;border-radius:9px;
  background:#0a0f1c;border:1px solid var(--gc,var(--g1));font:800 11px/16px var(--f-display);color:var(--text)}
.stars{display:flex;justify-content:center;gap:0;height:11px;margin-bottom:2px}
.stars svg{width:11px;height:11px}
.pt.locked .ring{filter:grayscale(1) brightness(.45)}
.pt .zeta{position:absolute;right:-2px;top:12px}
.pname{margin-top:9px;font:700 12px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;text-align:center;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.2em}
.shardbar{height:6px;margin-top:5px;background:var(--hull3);border-radius:3px;overflow:hidden}
.shardbar i{display:block;height:100%;background:linear-gradient(90deg,var(--holo),#a7ecff)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 10px}
.rcell{display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;border-radius:8px}
.rcell .pt{--s:72px}
.rcell .pw{font:600 11px var(--f-body);color:var(--dim);font-variant-numeric:tabular-nums}
.rcell.ready{background:radial-gradient(60% 50% at 50% 35%,#5fd4ff33,transparent)}
.rcell.sel{background:var(--hull3);box-shadow:inset 0 0 0 2px var(--gold)}
.rcell.dis{opacity:.35}

/* ---------- character sheet ---------- */
.sheet-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.sheet-top .pt{--s:112px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.statgrid div{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.statgrid b{font-variant-numeric:tabular-nums}
.ab{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.abicon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;font:800 13px var(--f-display);color:var(--text);
  background:radial-gradient(circle at 35% 30%,var(--hull3),#060a14);border:2px solid var(--line2)}
.abicon.special{border-color:var(--holo)} .abicon.unique{border-color:var(--g4)} .abicon.leader{border-color:var(--gold)}
.abicon svg{width:24px;height:24px}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:5px;background:var(--hull3);border-radius:1px}
.pips i.on{background:var(--holo)}
.pips i.on.om{background:var(--gold)}
.bar{height:8px;background:var(--hull3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--holo),#b3f0ff)}
.gear-name{font:800 18px var(--f-display);letter-spacing:.06em}

/* ---------- campaign ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{padding:10px 6px;font:800 14px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--hull)}
.seg button.on.lsb{background:linear-gradient(180deg,#2765b6,#173d73);color:#fff}
.seg button.on.dsb{background:linear-gradient(180deg,#b3262f,#5e0f17);color:#fff}
.chap-head{padding:14px;position:relative;overflow:hidden}
.chap-head .cnum{position:absolute;right:10px;top:-6px;font:800 76px var(--f-display);opacity:.12;line-height:1}
.nodes{display:flex;flex-direction:column;gap:10px;position:relative}
.nodes::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:2px;background:repeating-linear-gradient(180deg,var(--line2) 0 6px,transparent 6px 10px)}
.node{position:relative;display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px 8px 0;
  background:var(--hull);border:1px solid var(--line);border-radius:8px}
.node.locked{opacity:.4}
.node .nid{position:relative;z-index:1;justify-self:center;width:40px;height:40px;display:grid;place-items:center;font:800 15px var(--f-display);
  background:var(--hull3);border:2px solid var(--line2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.node.boss .nid{background:linear-gradient(135deg,var(--ds),#6c0f19);border:0;color:#fff}
.node.next .nid{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink)}
.node .ntitle{font:700 14px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.minis{display:flex;gap:3px;margin-top:4px}
.minis .pt{--s:26px}
.minis .pt .ring{padding:1.5px}
.nstars{display:flex;gap:1px}
.nstars svg{width:14px;height:14px}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:#02040acc;backdrop-filter:blur(3px);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#modal .mbox{width:100%;max-width:520px;max-height:calc(100% - 40px);overflow:auto;background:var(--hull);border:1px solid var(--line2);padding:16px;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;
  align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{padding:9px 14px;background:#0d1a30f0;border:1px solid var(--holo);color:var(--text);font:600 14px var(--f-body);border-radius:6px;
  box-shadow:0 8px 24px #000a;animation:tin .25s ease-out}
.toast.gold{border-color:var(--gold)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.rewards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rw{display:flex;flex-direction:column;align-items:center;gap:3px;width:70px;font:700 12px var(--f-display);text-align:center}
.rw .ri{width:54px;height:54px;display:grid;place-items:center;border-radius:10px;background:var(--hull2);border:1px solid var(--line2)}
.rw .ri svg{width:30px;height:30px}
.ri{display:grid;place-items:center;border-radius:10px;background:var(--hull2);border:1px solid var(--line2)}
.ri svg{width:70%;height:70%}
.rw .pt{--s:54px}

/* ---------- squad select ---------- */
.squad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 8px 12px;background:var(--hull2);border:1px solid var(--line);border-radius:8px}
.slot{display:flex;flex-direction:column;align-items:center;position:relative}
.slot .pt{--s:min(66px,17vw)}
.slot .empty{width:min(66px,17vw);aspect-ratio:1;border-radius:50%;border:2px dashed var(--line2);margin-top:13px}
.slot .crown{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:20px;height:14px;z-index:2}
.leadtxt{padding:10px 12px;border-left:3px solid var(--gold);background:linear-gradient(90deg,#2b2108,transparent)}

/* ---------- battle (canvas scene + DOM HUD) ---------- */
#battle{position:fixed;inset:0;z-index:40;background:#000;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bwrap{position:relative;width:100%;height:100%;overflow:hidden;touch-action:manipulation}
#bcv{position:absolute;inset:0;display:block;touch-action:none}
.btop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:8px 12px;background:linear-gradient(180deg,#000a,transparent);pointer-events:none}
.btop > *{pointer-events:auto}
.bt-title{flex:1;min-width:0;line-height:1.05;text-shadow:0 1px 3px #000}
.bt-title small{display:block;font:600 10.5px var(--f-body);color:#c9d3e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-title b{font:800 15px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.tog{min-width:44px;height:34px;padding:0 10px;border:1px solid #ffffff40;border-radius:6px;background:#0b1220cc;font:800 13px var(--f-display);letter-spacing:.06em;color:var(--text)}
.tog.on{background:var(--holo);color:#03131f;border-color:var(--holo)}
.bban{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
.bban.show{opacity:1;transform:none}
.bban small{display:block;font:700 12px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:#d8e2f2;text-shadow:0 1px 4px #000}
.bban b{display:inline-block;max-width:94vw;margin-top:2px;padding:2px 26px;font:800 clamp(24px,7vw,40px)/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  background:linear-gradient(90deg,transparent,#000b 18%,#000b 82%,transparent);text-shadow:0 0 18px #f2c14e88}
.bban.ls b{color:#bfe0ff;text-shadow:0 0 18px #4aa3ffaa} .bban.ds b{color:#ffc2c2;text-shadow:0 0 18px #ff4b4baa}
.bctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px 14px 14px;
  background:linear-gradient(0deg,#000d 30%,transparent);min-height:96px;pointer-events:none}
.bctl > *{pointer-events:auto}
.bwho{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.bpt{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);flex:none;box-shadow:0 0 14px #f2c14e66}
.bwn{min-width:0}
.bwn b{display:block;font:800 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bwn small{display:block;font-size:11px;color:#b9c4d8}
.babs{display:flex;gap:12px;padding-bottom:12px}
.abtn{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,#2b3d63,#070c18);border:2px solid #9aa4b8;box-shadow:0 4px 14px #000a;transition:transform .1s}
.abtn.special{border-color:var(--holo);box-shadow:0 0 14px #5fd4ff55,0 4px 14px #000a}
.abtn:active{transform:scale(.93)}
.abtn.off{filter:grayscale(.7)}
.abtn svg{width:30px;height:30px}
.abtn .cdv{position:absolute;inset:0;border-radius:50%;background:#000b;display:grid;place-items:center;font:800 24px var(--f-display);color:#fff}

/* ================= unit badges, rarity, lobby ================= */
:root{
  --r6:#ff9a3c; --r5:#f2c14e; --r4:#c08bff; --r3:#4aa3ff; --r2:#7fdc8a; --r1:#c9d1de; }
.el{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:999px;font:800 10.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor}
.el.Attack{color:#ff5a4a} .el.Defense{color:#4aa8ff} .el.Endurance{color:#f2c14e} .el.Balance{color:#b07bff}
.cls{display:inline-block;padding:1px 6px;border-radius:3px;font:700 10.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--hull3);color:#c9d3e6}
.rstars{display:flex;justify-content:center;gap:0;height:11px;margin-bottom:2px}
.rstars svg{width:11px;height:11px}
.pt .eldot{position:absolute;right:-1px;top:13px;width:16px;height:16px;border-radius:50%;border:2px solid #0a0f1c;z-index:2}
/* unit badges: the type's first letter on the type's colour (A, D, E, B) */
.eldot{--ec:#fff;background:var(--ec);color:#0a0f1c;display:grid;place-items:center;font:900 9.5px/1 var(--f-display)}
.el.sty{color:var(--bc,var(--moon));border-style:dashed}
.pname .sty{display:block;font:700 9px var(--f-display);letter-spacing:.05em;text-transform:uppercase;line-height:1.15;color:var(--moon)}
.variants{display:flex;gap:8px;align-items:flex-start;overflow-x:auto;scrollbar-width:none;padding:3px 2px 2px}
.variants::-webkit-scrollbar{display:none}
.variants button{flex:none}
.variants button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:inherit;padding:0;font:inherit}
.variants button.cur .pt{outline:2px solid var(--gold);outline-offset:2px;border-radius:50%}
.variants button.unowned .pt{filter:grayscale(.85) brightness(.7)}
.pt .elite{position:absolute;left:-2px;top:13px;min-width:18px;height:16px;padding:0 3px;border-radius:3px;background:#0a0f1c;border:1px solid var(--gold);font:800 9.5px/14px var(--f-display);color:var(--gold);z-index:2}
.pt .potb{position:absolute;right:-3px;bottom:12px;font:800 10px var(--f-display);color:#fff;background:#3a2a6a;border-radius:3px;padding:0 3px;z-index:2}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
/* lobby */
.lobby{position:relative;min-height:calc(100% - 4px);display:flex;flex-direction:column;gap:12px}
.stage{position:relative;height:min(62vh,520px);margin:-14px -16px 0;overflow:hidden;
  background:radial-gradient(80% 60% at 50% 70%,#1e3a6e 0%,transparent 70%),radial-gradient(60% 50% at 80% 10%,#4a1838 0%,transparent 70%),linear-gradient(180deg,#070b16,#0b1426)}
.stage .floor{position:absolute;left:-10%;right:-10%;bottom:0;height:34%;background:linear-gradient(180deg,transparent,#0a1730 40%,#081020);
  -webkit-mask:linear-gradient(180deg,transparent,#000 30%);mask:linear-gradient(180deg,transparent,#000 30%)}
.stage .ring3d{position:absolute;left:50%;bottom:7%;width:70%;aspect-ratio:4/1;transform:translateX(-50%);border-radius:50%;
  border:2px solid #5fd4ff88;box-shadow:0 0 30px #5fd4ff55,inset 0 0 30px #5fd4ff33}
.stage img.assist{position:absolute;left:50%;bottom:9%;height:84%;max-width:96%;object-fit:contain;transform-origin:50% 100%;transform:translateX(-50%);
  filter:drop-shadow(0 18px 24px #000c);animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) scale(1.008,1.018)}}
.stage .quip{position:absolute;left:16px;right:16px;top:14px;padding:10px 12px;background:#0b1426e6;border:1px solid var(--line2);border-radius:10px;font-size:14px;
  animation:rise .3s ease-out}
.stage .quip b{color:var(--gold);font:800 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;display:block}
.stage .nameplate{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:2px}
.stage .nameplate b{font:800 26px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 8px #000}
.stage .sidebtns{position:absolute;right:12px;bottom:22px;display:flex;flex-direction:column;gap:20px}
.sidebtn{position:relative;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:#0b1426d9;border:1px solid var(--line2);color:var(--text)}
.sidebtn svg{width:24px;height:24px}
.sidebtn small{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font:700 9.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.sidebtn .dot{top:-3px;right:-3px}
/* story map */
.ep-card{position:relative;overflow:hidden;text-align:left;width:100%;padding:14px;color:var(--text);min-height:92px}
.mapwrap{position:relative;margin:0 -16px;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mapwrap svg.map{display:block;width:100%;height:auto}
.mnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text)}
.mnode .disc{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#2b3d63,#0a1222);border:2px solid var(--line2);
  box-shadow:0 4px 12px #000a}
.mnode .disc svg{width:24px;height:24px}
.mnode.boss .disc{width:60px;height:60px;border-color:var(--ds);box-shadow:0 0 18px #ff4b4b66}
.mnode.story .disc{border-color:var(--holo)}
.mnode.chest .disc{border-color:var(--gold)}
.mnode.side .disc{border-style:dashed;border-color:var(--g4)}
.mnode.next .disc{border-color:var(--gold);animation:pulse 1.4s infinite}
.mnode.locked{opacity:.35;pointer-events:none}
.mnode.done .disc{background:radial-gradient(circle at 35% 30%,#2f5a3e,#0c1a12)}
.mnode .lbl{font:800 11px var(--f-display);letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:#000a;white-space:nowrap}
.mnode .nst{display:flex;height:10px} .mnode .nst svg{width:10px;height:10px}
@keyframes pulse{50%{box-shadow:0 0 0 4px #f2c14e55,0 0 22px #f2c14e}}
.mission{display:flex;align-items:center;gap:8px;font-size:13px}
.mission svg{width:16px;height:16px;flex:none}
/* dialogue */
#dlg{position:fixed;inset:0;z-index:70;background:#000;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dwrap{position:relative;width:100%;max-width:560px;height:100%;overflow:hidden}
.dbg{position:absolute;inset:0}
.dchar{position:absolute;bottom:18%;height:68%;max-width:70%;object-fit:contain;transition:opacity .25s,transform .35s,filter .25s;filter:drop-shadow(0 12px 24px #000)}
.dchar.left{left:-6%} .dchar.right{right:-6%}
.dchar.dim{filter:brightness(.45) drop-shadow(0 12px 24px #000)}
.dchar.enter{opacity:0;transform:translateY(16px)}
.dbox{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));min-height:132px;padding:22px 16px 16px;background:linear-gradient(180deg,#0b1426f2,#060a14f7);
  border:1px solid var(--line2);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.dname{position:relative;display:inline-block;margin:-8px 0 8px -4px;padding:3px 14px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--gold-ink);
  font:800 14px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.dtext{font-size:16px;line-height:1.45;min-height:3em}
.dnext{position:absolute;right:14px;bottom:10px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--gold);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.dtop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(180deg,#000a,transparent);z-index:2}
.dtop .ttl{font:800 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#c9d3e6}
.dnarr .dtext{font-style:italic;color:#c9d3e6}
/* headhunt */
.banner-card{position:relative;overflow:hidden;min-height:220px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  background:radial-gradient(90% 90% at 80% 30%,#5a2a10,transparent 70%),linear-gradient(160deg,#141c30,#0a1020)}
.banner-card img{position:absolute;right:-8%;bottom:0;height:100%;max-width:70%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 10px 20px #000)}
.banner-card > *:not(img){position:relative;z-index:1}
.banner-card h2{font-size:26px;text-shadow:0 2px 8px #000}
#gacha{position:fixed;inset:0;z-index:75;background:#000;display:flex;justify-content:center}
.gwrap{position:relative;width:100%;max-width:560px;height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.gcv{position:absolute;inset:0;width:100%;height:100%}
.ggrid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:520px}
.gcard{position:relative;aspect-ratio:1/2;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#121a2e,#070b14);border:2px solid var(--rc,#4aa3ff);
  box-shadow:0 0 16px color-mix(in srgb,var(--rc,#4aa3ff) 55%,transparent);animation:cardin .45s backwards}
.gcard img{position:absolute;left:50%;bottom:0;height:96%;transform:translateX(-50%);object-fit:contain}
.gcard .gst{position:absolute;left:0;right:0;bottom:0;padding:10px 2px 3px;text-align:center;font:800 11px/1.15 var(--f-display);background:linear-gradient(180deg,transparent,#000c 60%);color:var(--rc);text-shadow:0 1px 3px #000}
.gcard .gnew{position:absolute;left:3px;top:3px;font:800 9px var(--f-display);color:#000;background:var(--gold);padding:0 3px;border-radius:2px}
.gcard.back{background:repeating-linear-gradient(45deg,#101a30 0 8px,#0c1426 8px 16px)}
.gcard.back img,.gcard.back .gst,.gcard.back .gnew{display:none}
@keyframes cardin{from{transform:translateY(30px) scale(.8);opacity:0}}
.gbig{position:relative;height:56%;max-width:92%;object-fit:contain;filter:drop-shadow(0 0 30px var(--rc));animation:cardin .5s}
.gtitle{position:relative;text-align:center}
.gtitle h1{font-size:34px}
/* battle additions */
.turnstrip{position:absolute;left:0;right:0;top:52px;display:flex;gap:4px;padding:0 10px;z-index:3;pointer-events:none}
.turnstrip img{width:30px;height:30px;border-radius:50%;border:2px solid var(--ls);background:#0b1426;flex:none;transition:transform .2s}
.turnstrip img.en{border-color:var(--ds)}
.turnstrip img:first-child{width:38px;height:38px;border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.skbtn{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,#2b3d63,#070c18);border:2px solid #9aa4b8;box-shadow:0 4px 14px #000a;transition:transform .1s}
.skbtn.s2{border-color:var(--holo)} .skbtn.s3{border-color:var(--gold);box-shadow:0 0 14px #f2c14e88,0 4px 14px #000a}
.skbtn.s3.ready{animation:pulse 1.4s infinite}
.skbtn:active{transform:scale(.93)}
.skbtn.off{filter:grayscale(.8)}
.skbtn svg{width:28px;height:28px}
.skbtn .cdv{position:absolute;inset:0;border-radius:50%;background:#000b;display:grid;place-items:center;font:800 22px var(--f-display);color:#fff}
.skbtn .alabel{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font:700 9.5px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:#c9d3e6;white-space:nowrap}
.skbtn.picking{border-color:var(--hp);box-shadow:0 0 16px var(--hp)}
.cutin{position:absolute;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.cutin .band{position:absolute;left:-20%;right:-20%;top:28%;height:44%;transform:skewY(-8deg);background:linear-gradient(90deg,transparent,var(--ec) 20%,#000 50%,var(--ec) 80%,transparent);
  opacity:.9;animation:bandin .9s ease-out both}
.cutin .lines{position:absolute;inset:0;background:repeating-linear-gradient(-8deg,transparent 0 22px,#ffffff14 22px 24px);animation:lines .9s linear both}
.cutin img{position:absolute;bottom:20%;height:62%;left:-10%;filter:drop-shadow(0 0 24px var(--ec));animation:artin .95s cubic-bezier(.2,.8,.2,1) both}
.cutin .sk{position:absolute;right:16px;top:58%;text-align:right;animation:skin .9s ease-out both}
.cutin .sk small{display:block;font:700 12px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px #000}
.cutin .sk b{display:block;font:800 clamp(26px,8vw,44px)/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 18px var(--ec),0 2px 6px #000}
@keyframes bandin{0%{transform:skewY(-8deg) scaleY(0)}20%{transform:skewY(-8deg) scaleY(1)}85%{opacity:.9}100%{opacity:0}}
@keyframes lines{from{background-position:0 0}to{background-position:-300px 0}}
@keyframes artin{0%{transform:translateX(-40%);opacity:0}25%{transform:translateX(0);opacity:1}80%{transform:translateX(6%);opacity:1}100%{transform:translateX(12%);opacity:0}}
@keyframes skin{0%{transform:translateX(30%);opacity:0}25%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
/* runes */
.rune{position:relative;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:var(--hull2);border:1px solid var(--line);border-radius:8px;text-align:left;color:var(--text);width:100%}
.rune .rg{width:40px;height:40px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--rc,#4aa3ff);
  font:800 11px var(--f-display);color:#08101e}
.rune.eq{box-shadow:inset 0 0 0 2px var(--gold)}
.runeslots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pslots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pslot{min-height:64px;padding:8px;border:1px solid var(--line2);border-left:3px solid var(--pc,#7a869c);border-radius:8px;text-align:left;color:var(--text);background:var(--hull2);display:flex;flex-direction:column;gap:2px;justify-content:center;font:inherit}
.pslot b{font-size:13px;line-height:1.15}
.pslot.on{box-shadow:inset 0 0 0 2px var(--gold)}
.rslot{min-height:64px;padding:8px;border:1px dashed var(--line2);border-radius:8px;text-align:left;color:var(--dim);display:flex;flex-direction:column;gap:2px;justify-content:center}
.rslot.full{border-style:solid;color:var(--text);background:var(--hull2)}
.opart{position:relative;height:300px;margin:-12px -12px 0;overflow:hidden;background:radial-gradient(70% 80% at 50% 70%,var(--ecs,#16335f),transparent 70%),linear-gradient(180deg,#070b16,#0b1222)}
.opart img{position:absolute;left:50%;bottom:4%;height:92%;max-width:90%;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 12px 20px #000)}
.opart .meta{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:1}
.kvline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.tabs2 button{padding:9px 4px;font:800 12.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--hull)}
.tabs2 button.on{background:linear-gradient(180deg,#2765b6,#173d73);color:#fff}
.mats{display:flex;gap:8px;flex-wrap:wrap}
.mat{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;border-radius:999px;background:var(--hull2);border:1px solid var(--line);font:700 12px var(--f-display);font-variant-numeric:tabular-nums}
.mat svg{width:18px;height:18px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;transition-duration:.01s!important}
}
@media (min-width:600px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
/* ---------- real-time battle HUD: both Beyblades' panels, the clock, tag and move buttons, the launch meter ---------- */

.pel{flex:none;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font:900 9px/1 var(--f-display);color:#08090c;background:var(--ec);box-shadow:0 0 0 1.5px #000}
.pboss{font:800 8.5px var(--f-display);color:#fff;background:var(--ds);padding:0 3px;border-radius:2px;flex:none}
.bpan .ph{position:relative;height:9px;background:#3a1218;border:1px solid #000;border-radius:2px;overflow:hidden;transform:skewX(-14deg)}

.bpan .ph i{position:absolute;top:0;bottom:0;left:0;width:0}

.bpan.E .pb .segs b{background:linear-gradient(90deg,#8a2a0a,#ff7a2a 60%,#ffe0c0)}

.bpan .pe{display:flex;flex-wrap:wrap;gap:2px;min-height:11px}
.bpan.E .pe{justify-content:flex-end}
.bpan .pe span{font:800 8px/11px var(--f-display);padding:0 3px;border-radius:2px;color:#fff;background:#1d7a45}
.bpan .pe span.d{background:#a3242e}
.pbench{display:flex;flex-direction:column;gap:3px;flex:none}
.bm{position:relative;width:22px;height:22px;border-radius:50%;overflow:hidden;border:1.5px solid #ffffff66;background:#0b1426}
.bm img{width:100%;height:100%;display:block}
.bm i{position:absolute;inset:0;background:conic-gradient(#000c calc(var(--cd,0)*360deg),transparent 0)}

// battles are 1-on-1 tag matches: a team is three Beyblades, one in the dish at a time
const TEAM_SIZE = 3;
// battle time: an effect lasting one "turn" in the move data lasts T_SEC seconds; 100% "turn meter" is ATB_S seconds of cooldown
const T_SEC = 2.5, ATB_S = 6;
// technique levels 1–7 (7 is MAX)
const RANK = ["", "1", "2", "3", "4", "5", "6", "MAX"];

// =====================================================================
//  BLADERS AND THEIR BEYBLADES — the original Beyblade anime (Season 1, V-Force, G-Revolution).
//  Each Blader has one or more Beyblades (the versions they used across the seasons); every Beyblade is its own unit
//  with a type (Attack, Defense, Endurance, Balance), three moves and a Blader Ability.
//  Skill format: {slot, name, cd, target, hits, mult, ignoreDef, effects[]}; S3 is the Bit-Beast attack, which costs
//  100% Bit Power instead of a cooldown. Move and Ability text is generated from the data (skillDesc, passiveDesc).
// =====================================================================
const dbf = (what, chance = 1, turns = 2) => ({ on: "target", type: "debuff", what, chance, turns });
const tmDown = (amount, chance) => ({ on: "target", type: "atkbar-", amount, chance });
const strip = (amount = 1) => ({ on: "target", type: "strip", amount, chance: 1 });
const aoeDbf = (what, chance = 1, turns = 2) => ({ on: "aoe_enemies", type: "debuff", what, chance, turns });
const selfBuff = (what, turns = 2) => ({ on: "self", type: "buff", what, turns });
const selfGain = amount => ({ on: "self", type: "atkbar+", amount });
const selfHeal = (amount, chance) => ({ on: "self", type: "healPct", amount, chance });
const selfShield = (amount, turns = 2) => ({ on: "self", type: "shieldCasterHP", amount, turns });
const teamBuff = (what, turns = 2) => ({ on: "ally", type: "buff", what, turns });
const teamGain = amount => ({ on: "ally", type: "atkbar+", amount });
const teamHeal = amount => ({ on: "ally", type: "healFlatCasterHP", amount });
const teamShield = (amount, turns = 2) => ({ on: "ally", type: "shieldCasterHP", amount, turns });
const cleanse = amount => ({ on: "ally", type: "cleanse", amount });
const revive = amount => ({ on: "ally", type: "reviveOne", amount });
const perDebuff = (per, cap) => ({ on: "target", type: "bonusPerDebuff", per, cap });
const bonusVs = (cond, bonusDmg, bonusCrit = 0) => ({ on: "target", type: "bonusIf", cond, bonusDmg, bonusCrit });
const taunt = (turns = 2) => ({ on: "self", type: "taunt", turns });
const allyHeal = amount => ({ on: "ally", type: "healPctTarget", amount });
const aoeTm = amount => ({ on: "aoe_enemies", type: "atkbar-", amount });
const onKillGain = amount => ({ on: "self", type: "atkbar+", amount, onKill: true });
const atk = (slot, name, target, hits, mult, effects = [], x = {}) => ({ slot, name, cd: slot === 1 ? 0 : 3, target, hits, mult, effects, ...x });
const sup = (slot, name, target, effects, x = {}) => ({ slot, name, cd: slot === 1 ? 0 : 3, target, effects, ...x });

// ---------- generated move text ----------
// Battles run in real time: effect lengths in the data are "turns" (T_SEC seconds each) and turn-meter amounts
// are shares of ATB_S seconds of cooldown.
const P = v => Math.round(v * 100) + "%";
const secs = v => `${+v.toFixed(1)}s`;
const durOf = e => e.turns ? ` (${secs(e.turns * T_SEC * (e.what === "STUN" ? .55 : 1))})` : "";
function skillDesc(sk) {
  const out = [], E = sk.effects || [], multi = (sk.hits || 1) > 1;
  if (sk.mult > 0) {
    const dmg = multi ? `${sk.hits} hits of ${P(sk.mult)} ATK` : `${P(sk.mult)} ATK`;
    let s = sk.target === "aoe_enemies" ? `Sends a shockwave across the dish: ${dmg}` : sk.slot === 1 ? `Rushes the rival: ${dmg}` : `Charges straight at the rival: ${dmg}`;
    if (sk.ignoreDef) s += sk.ignoreDef >= 1 ? ", ignoring DEF" : `, ignoring ${P(sk.ignoreDef)} DEF`;
    if (sk.slot === 3 || sk.arc) s += ", with huge knockback";
    out.push(s);
  }
  for (const e of E) {
    const ch = e.chance != null && e.chance < 1 ? `${P(e.chance)} chance${multi && e.on !== "self" && e.on !== "ally" ? " per hit" : ""} to ` : "";
    const T = durOf(e), nm = e.what && FX[e.what] ? FX[e.what].n : "";
    if (e.type === "debuff") out.push(ch ? `${ch}inflict ${nm}${T}` : `Inflicts ${nm}${T}`);
    else if (e.type === "atkbar-") out.push(ch ? `${ch}delay the rival's technique by ${secs(e.amount * ATB_S)}` : `Delays the rival's technique by ${secs(e.amount * ATB_S)}`);
    else if (e.type === "strip") out.push(`Removes ${e.amount} buff${e.amount > 1 ? "s" : ""} from the rival`);
    else if (e.type === "bonusPerDebuff") out.push(`+${P(e.per)} damage per debuff on the rival (up to +${P(e.cap)})`);
    else if (e.type === "bonusIf") out.push(`+${P(e.bonusDmg)} damage against a rival with ${FX[e.cond].n}`);
    else if (e.type === "buff") out.push(`Gains ${nm}${T}`);
    else if (e.type === "taunt") out.push(`Gains ${FX.TAUNT.n}${T}`);
    else if (e.type === "atkbar+") out.push(e.on === "self" ? `${e.onKill ? "On a knockout, recharges" : "Recharges"} its moves by ${secs(e.amount * ATB_S)}` : `Recharges its moves and shortens its partners' tag cooldowns by ${secs(e.amount * ATB_S)}`);
    else if (e.type === "healPct") out.push(ch ? `${ch}recover ${P(e.amount)} of max Spin` : `Recovers ${P(e.amount)} of max Spin`);
    else if (e.type === "healPctTarget") out.push(`It and its partners recover ${P(e.amount)} of their max Spin`);
    else if (e.type === "healFlatCasterHP") out.push(`It and its partners recover Spin equal to ${P(e.amount)} of its max Spin`);
    else if (e.type === "cleanse") out.push(`Cleanses ${e.amount} debuff${e.amount > 1 ? "s" : ""}${e.on === "self" ? "" : " from it and its partners"}`);
    else if (e.type === "shieldCasterHP") out.push(`Gains a ${FX.SHIELD.n} worth ${P(e.amount)} of its max Spin${T}`);
    else if (e.type === "reviveOne") out.push(`Relaunches one knocked-out partner at ${P(e.amount)} Spin`);
  }
  if (sk.arc) out.push(`Bit-Beast attack: costs ${sk.arc}% Bit Power`);
  return out.map(x => x.charAt(0).toUpperCase() + x.slice(1)).join(". ") + ".";
}

const STATN = { hp: "Spin", atk: "ATK", def: "DEF", spd: "SPD", cr: "Crit Rate", cd: "Crit Damage", acc: "Accuracy", res: "Resistance" };

// add an effect to a skill, or strengthen the same effect if the skill already has it
function withEffect(sk, e) {
  const ex = sk.effects.find(x => x.type === e.type && x.on === e.on && x.what === e.what && !x.onKill && !x.perCrit);
  if (!ex) { sk.effects.push({ ...e }); return; }
  const i = sk.effects.indexOf(ex), up = { ...ex };
  if (e.type === "debuff") up.chance = Math.min(1, (ex.chance ?? 1) + .15);
  else if (e.type === "strip" || e.type === "cleanse") up.amount = (ex.amount || 1) + 1;
  else if (e.type !== "buff") up.amount = +((ex.amount || 0) + .05).toFixed(2);
  sk.effects[i] = up;
}
// per-hit effects are scaled down on multi-hit skills so a 7-hit S1 doesn't apply them seven times over
const perHit = (e, hits) => { const f = Math.min(1, 2 / (hits || 1)); return e.type === "debuff" ? { ...e, chance: +(e.chance * f).toFixed(3) } : { ...e, amount: +(e.amount * f).toFixed(3) }; };

});

// BBA Tower: a 30-floor ladder; every fifth floor is a champion, even floors from 8 on are other Bladers' teams
const TOWER_FLOORS = 30;
function towerFloor(f) {
  const lv = 4 + f * 3, rng = seeded(hash("tower" + f));
  const mobs = ["street", "shark", "bully", "trainee", "tiger", "allstar", "knight", "dark", "biovolt", "guardian", "cyber", "bega"];
  const bosses = ["b_kai", "b_lee", "b_michael", "b_robert", "b_tala", "b_ozuma2", "b_zeo", "b_hiro", "b_kaigt", "b_brooklyn"];
  const pickE = () => mobs[Math.floor(rng() * mobs.length)];
  let waves;
  if (f % 5 === 0) waves = [W(pickE(), pickE(), pickE()), W(bosses[(f / 5 - 1) % bosses.length], pickE(), pickE())];
  else if (f >= 8 && f % 2 === 0) {
    const pool = OP_KEYS.filter(k => OPS[k].rar >= 4);
    waves = [[0, 1, 2].map(() => ({ op: pool[Math.floor(rng() * pool.length)] }))];

  // ---------- physics ----------

  // ---------- per-tick upkeep ----------
  function upkeep(u) {

    if (u.kbT > 0) u.kbT -= DT;

      u.flags.burst = true; u.burstT = 2.6 * u.P.burst; ev({ k: "burst", u: u.uid }); ev({ k: "txt", u: u.uid, s: "ENGINE GEAR!", c: "buff" });
    }
    if (u.rush) { u.rush.t += DT; if (u.rush.t > u.rush.max) { if (u.rush.sure && rivalOf(u)) { const t = rivalOf(u); u.x = t.x - (t.x - u.x) * .2; u.z = t.z - (t.z - u.z) * .2; landRush(u, t); } else u.rush = null; } }

  }

  // ---------- AI ----------
  const REACT = { balanced: .14, aggressive: .3, safe: .08 };
  function ai(side) {
    const S = B.side[side], u = activeOf(side); if (!u || B.freeze) return;
    const t = rivalOf(u), style = side === "A" ? B.aiStyle : "balanced";
    const react = REACT[style] || .14;

  // ---------- the loop ----------

    }
    B.t += DT;
    for (const sk of ["A", "E"]) {
      const S = B.side[sk];
      if (S.tagLock > 0) S.tagLock -= DT;
      if (S.next >= 0 && !S.active) { S.next -= DT; if (S.next <= 0) { const n = nextIn(S); if (n) enter(n, "ko"); } }

  B.start = (qA = .7, qE = .7) => {

        else if (p.id === "MC_START") gainMC(s, Math.round(p.amount * 100));

    }
  }
  return B;
}

const BT = { on: false, cv: null, g: null, W: 0, H: 0, dpr: 1, clock: 0, speed: 1, paused: false, vus: new Map(),

// =====================================================================
//  BATTLE DIRECTOR — runs a real-time battle: the launch, the HUD (Spin, Bit Power, partners on the bench), the
//  Attack / technique / Bit-Beast / tag buttons, and the effects for everything the engine reports in B.ev.
//  The engine moves the Beyblades; the player (or Auto) only decides when to attack, use moves and tag.

const VU = uid => BT.vus.get(uid);
const avg = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
const SPEEDS = [1, 1.5, 2];
const aspect = () => Math.min(1.7, BT.W / BT.H);

// ---------- camera shots ----------
function focusShot(vu) {
  return { tx: vu.pos.x, ty: 70, tz: vu.pos.z, yaw: BT.home.yaw + (vu.team === "A" ? .35 : -.35), pitch: .3, dist: fitDist(320, 560), fov: .62, roll: 0 };
}

// ---------- fx helpers ----------
const elc = vu => ELC[vu.u.el] || "#ffffff";
function sparks(p, col, n = 14, k = 1) {
  addParts(p, n, { col, speed: 240 * k, life: 380, size: 2.4, g: 380, spread: 10 });
  addParts(p, Math.ceil(n / 2), { col: "#ffe9a0", speed: 300 * k, life: 260, size: 1.8, g: 500 });
}
function slashAt(p, col, big) { BT.slashes.push({ p, t0: BT.clock, dur: 260, col, rot: R() * Math.PI, big }); }
function drawSlashes(K) {
  const g = BT.g;

    const p = proj(K, ...s.p); if (!p) continue;
    const k = (BT.clock - s.t0) / s.dur, r = (s.big ? 70 : 46) * p[2] * (.7 + k * .5);
    g.save(); g.translate(p[0], p[1]); g.rotate(s.rot + k * .6); g.globalCompositeOperation = "lighter"; g.globalAlpha = 1 - k;
    g.lineCap = "round";

}
function auraBurst(vu, col, ring = true) {

function banner(name, sub, cls, ms) {

// ---------- engine events → visuals ----------
function onEv(e) {
  const vu = e.u != null ? VU(e.u) : null;
  switch (e.k) {
    case "enter": {
      if (!vu) break;
      Object.assign(vu, { shown: true, gone: false, dead: false, ringOut: false, fly: null, enterT: BT.clock, leaveT: null, y: 200, hp: vu.u.hp, lag: vu.u.hp, trail: [] });
      vu.pos.x = vu.u.x; vu.pos.z = vu.u.z;
      BT.cur[vu.team] = vu.u; BT.hudDirty = true;
      bwait(380).then(() => {
        BT.rings.push({ x: vu.pos.x, z: vu.pos.z, r0: 10, r1: 90, t0: BT.clock, dur: 500, col: vu.col, w: 3 });
        addParts([vu.pos.x, 4, vu.pos.z], 16, { col: "#ffe2a0", speed: 220, life: 340, size: 2.2, g: 320 });
      });
      sfx("launch");
      if (e.how === "tag") { banner(vu.u.n, vu.team === "A" ? "Tag in!" : "The rival tags in", sideCls(vu), 1000); floatText(e.u, "TAG IN!", "buff"); }
      else if (e.how === "ko") banner(vu.u.n, vu.team === "A" ? "Your next Beyblade" : "The rival's next Beyblade", sideCls(vu), 1100);
      break;
    }
    case "tagout": if (vu) { vu.leaveT = BT.clock; vu.trail = []; sfx("warp"); BT.hudDirty = true; } break;
    case "rush": if (vu) sfx("saber"); break;
    case "use": {
      if (!vu) break;
      if (e.slot === 2) banner(e.name, vu.u.n, sideCls(vu), 900);
      if (e.anim === "buff" || e.anim === "heal") { auraBurst(vu, e.anim === "heal" ? "#5dfc9b" : "#f2c14e"); sfx(e.anim === "heal" ? "heal" : "special"); }
      break;
    }
    case "hit": {
      if (!vu) break;
      if (e.kind === "wall") { sparks([e.x, 14, e.z], "#ffe2a0", 6, .7); break; }
      const av = e.a != null ? VU(e.a) : null, col = av ? elc(av) : "#ffffff", big = e.crit || e.big;
      const show = () => {
        if (!vu.shown) return;

        if (e.kind === "recoil" || e.kind === "clash") { if (e.n >= vu.u.max.hp * .025) floatText(e.u, fmtFull(e.n), "chip"); return; }
        floatText(e.u, fmtFull(e.n), e.crit ? "crit" : e.glance ? "prot" : "dmg");
        if (e.adv && BT.clock - (vu.advT || -1e9) > 3000) { vu.advT = BT.clock; floatText(e.u, "TYPE ADVANTAGE", "txt"); }
        if (e.glance) floatText(e.u, "GLANCING", "txt");
        vu.flash = BT.clock + 160; sparks(chestW(vu), col, big ? 26 : 14); slashAt(chestW(vu), col, big);
        BT.shake = Math.max(BT.shake, e.crit ? 10 : big ? 8 : 4); sfx(e.crit ? "crit" : "clash");
      };

      break;
    }
    case "clash": {
      const k = clamp(e.p / 400, .3, 1.6);
      sparks([e.x, 22, e.z], e.opp ? "#ffd34d" : "#cfe3ff", Math.round(10 * k), k);
      BT.shake = Math.max(BT.shake, 2 + 4 * k);
      if (BT.clock - (BT.clashT || -1e9) > 120) { BT.clashT = BT.clock; sfx("clash"); }
      break;
    }
    case "wave": {
      const col = vu ? elc(vu) : "#ffffff";
      BT.rings.push({ x: e.x, z: e.z, r0: 30, r1: e.big ? 560 : 400, t0: BT.clock, dur: 560, col, w: 5 });
      BT.rings.push({ x: e.x, z: e.z, r0: 20, r1: e.big ? 380 : 280, t0: BT.clock, dur: 420, col: "#ffffff", w: 2 });
      sfx("boom"); BT.shake = Math.max(BT.shake, 8);
      if (e.big) { BT.flash = .3; BT.flashCol = col; }
      break;
    }
    case "miss": if (vu) floatText(e.u, "DODGED", "txt"); break;
    case "txt": if (vu) floatText(e.u, e.s, e.c); break;
    case "heal": {
      if (!vu || (!e.shield && e.n < vu.u.max.hp * .02)) break;
      floatText(e.u, "+" + fmtFull(e.n), e.shield ? "prot" : "heal");
      addParts([vu.pos.x, 30, vu.pos.z], 8, { col: e.shield ? "#c8ffd6" : "#5dfc9b", speed: 30, vy: 90, life: 700, size: 2.2, g: -10, spread: 30 });
      break;
    }
    case "arc": {
      // the Bit-Beast rises out of the Bit-Chip while everything pauses
      if (!vu) break;
      const bst = vu.u.def.beast;
      BT.letterboxT = 1; sfx("special"); cutIn(vu, e.name);
      camTo(focusShot(vu), 4.5);
      if (bst && bst.kind) BT.beasts.push({ vu, kind: bst.kind, col: bst.col, t0: BT.clock, dur: 1900 });
      auraBurst(vu, bst && bst.col || elc(vu), true);
      break;
    }
    case "arcgo": {
      if (!vu) break;
      BT.letterboxT = 0; camHome(2.6);
      BT.flash = .45; BT.flashCol = (vu.u.def.beast && vu.u.def.beast.col) || elc(vu); BT.shake = 12; sfx("boom");
      break;
    }
    case "ko": {
      if (!vu) break;

      if (e.ring) {

        banner("RING OUT!", vu.u.n, vu.team === "A" ? "ds" : "ls", 1300);
        const u = vu.u, r = Math.hypot(u.x, u.z) || 1, sp = Math.max(480, Math.hypot(u.vx, u.vz));
        vu.fly = { vx: u.x / r * sp * .85 + u.vx * .15, vz: u.z / r * sp * .85 + u.vz * .15, vy: 420 }; vu.tumble = R() < .5 ? -1 : 1;
        sparks(chestW(vu), "#ffe2a0", 30, 1.2); BT.shake = Math.max(BT.shake, 10);
      } else {
        floatText(e.u, "SLEEP OUT", "debuff"); sfx("sleepout");
        banner("SLEEP OUT", vu.u.n, vu.team === "A" ? "ds" : "ls", 1300);
        vu.fallDir = R() < .5 ? -1 : 1;
        addParts(chestW(vu), 14, { col: "#cfd6e2", speed: 50, vy: 30, life: 900, size: 2, g: -20, spread: 20 });
      }
      BT.hudDirty = true;
      break;
    }
    case "revive": if (vu) { Object.assign(vu, { dead: false, gone: false, ringOut: false, fly: null }); auraBurst(vu, "#ffd76b"); } break;
    case "burst": if (vu) { auraBurst(vu, "#ff7a2a"); sfx("special"); } break;
    case "over": BT.live = false; if (BT.onOver) { const f = BT.onOver; BT.onOver = null; f(); } break;
  }
}

// ---------- the loop: step the engine on its fixed time step, then place the Beyblades ----------
function stepBattle(dt) {
  const B = BT.B; if (!B) return;
  if (BT.live && !BT.paused) {
    BT.acc += dt / 1000; let n = 0;
    while (BT.acc >= DT && n++ < 8) {
      B.tick(); BT.acc -= DT;
      for (const e of B.ev) onEv(e);
      B.ev.length = 0;
      if (B.over) break;
    }
    if (n >= 8) BT.acc = 0;
  }
  BT.alpha = clamp(BT.acc / DT, 0, 1);
  if (BT.meterTick) BT.meterTick();
  if (BT.banT && BT.clock > BT.banT) hideBanner();
  syncVUs(dt);
  // the camera leans a little toward the action
  if (BT.home && !BT.letterboxT && BT.live) {
    const a = B.activeOf("A"), e = B.activeOf("E");
    const pts = [a, e].filter(Boolean);
    if (pts.length) { const mx = avg(pts.map(u => u.x)), mz = avg(pts.map(u => u.z)); BT.camT.tx = BT.home.tx + mx * .08; BT.camT.tz = BT.home.tz + mz * .08; }
  }
  updHUD();
}
function syncVUs(dt) {
  const B = BT.B, a = BT.alpha, sdt = dt / 1000, K = BT.K;
  for (const vu of BT.vus.values()) {
    const u = vu.u;
    if (vu.fly) { vu.pos.x += vu.fly.vx * sdt; vu.pos.z += vu.fly.vz * sdt; vu.fly.vy -= 1100 * sdt; vu.y = Math.max(0, vu.y + vu.fly.vy * sdt); continue; }
    if (vu.leaveT != null) { vu.y += 460 * sdt; continue; }   // lifted out of the dish by its Blader
    if (vu.dead || u.status !== "field") continue;
    // after the battle the winner keeps spinning round the dish
    if (B.over) { u.vx -= u.x * 1.4 * sdt; u.vz -= u.z * 1.4 * sdt; const f = Math.exp(-sdt * .8); u.vx *= f; u.vz *= f; u.px = u.x += u.vx * sdt; u.pz = u.z += u.vz * sdt; }
    vu.pos.x = lerp(u.px, u.x, a); vu.pos.z = lerp(u.pz, u.z, a);
    if (vu.enterT != null) { const k = clamp((BT.clock - vu.enterT) / 420, 0, 1); vu.y = 200 * (1 - k) * (1 - k); if (k >= 1) vu.enterT = null; }
    else vu.y = 0;
    vu.hp = u.hp; vu.sh = u.shield; vu.rushing = !!u.rush; vu.stall = B.has(u, "STUN"); vu.stealth = B.has(u, "STEALTH");
    if (K) vu.svx = u.vx * K.r[0] + u.vz * K.r[2];
    if (BT.paused) continue;
    if (vu.rushing || Math.hypot(u.vx, u.vz) > 400) { vu.trail.push([vu.pos.x, vu.pos.z, BT.clock]); if (vu.trail.length > 24) vu.trail.shift(); }
    if (vu.rushing && R() < .5) addParts([vu.pos.x, 2, vu.pos.z], 1, { col: "#ffe2a0", speed: 120, life: 200, size: 1.6, g: 200 });
  }
}

// ---------- HUD ----------
function skillIcon(u, sk) {
  if (!sk) return IC.boost;
  const ef = sk.effects || [];
  if (sk.target === "ally_single" || ef.some(e => /heal|revive/.test(e.type))) return IC.heal;
  if (ef.some(e => e.what === "TAUNT" || e.type === "shieldCasterHP")) return IC.shield;
  if (sk.target === "self" || sk.target === "team" || sk.target === "aoe_allies") return IC.boost;
  if (sk.target === "aoe_enemies") return IC.orb;

}
// one side's panel: the Beyblade in the dish (Spin, Bit Power, effects) and its partners on the bench

function buildHUD() {

function act(a, btn) {

  else { btn.classList.remove("no"); void btn.offsetWidth; btn.classList.add("no"); }
}
const setW = (el, f) => { if (!el) return; const v = Math.round(clamp(f, 0, 1) * 1000) / 10 + "%"; if (el.style.width !== v) el.style.width = v; };
const setTxt = (el, t) => { if (el && el.textContent !== t) el.textContent = t; };
const setCD = (el, f) => { if (!el) return; const v = String(Math.round(clamp(f, 0, 1) * 100) / 100); if (el.style.getPropertyValue("--cd") !== v) el.style.setProperty("--cd", v); };
function benchState(side, m) {
  const B = BT.B, S = B.side[side];
  if (m.status === "out") return ["out", 0, ""];
  if (m.status === "field") return ["", 0, ""];
  if (m.tagUsed) return ["used", 0, "USED"];
  if (m.benchCD > 0) return ["cd", m.benchCD / TAG_CD, Math.ceil(m.benchCD) + "s"];
  if (S.tagLock > 0) return ["cd", S.tagLock / TAG_LOCK, Math.ceil(S.tagLock) + "s"];

}
function updHUD() {
  const B = BT.B; if (!B) return;
  if (BT.hudDirty) { BT.hudDirty = false; buildHUD(); }
  for (const side of ["A", "E"]) {
    const h = BT.hud[side], u = BT.cur[side]; if (!h || !u || !h.cur) continue;
    const m = u.max.hp, vu = VU(u.uid);
    setW(h.cur, u.hp / m); setW(h.lag, (vu ? vu.lag : u.hp) / m); setW(h.sh, u.shield / m);
    const mc = B.mc[side];
    h.segs.forEach((s, k) => { const f = clamp((mc - k * 100) / 100, 0, 1); setW(s.firstChild, f); s.classList.toggle("full", f >= 1); });
    setTxt(h.pct, Math.floor(mc) + "%");
    const seen = new Set(), list = u.eff.filter(x => !seen.has(x.id) && seen.add(x.id)), key = list.map(x => x.id).join();
    if (key !== h.fxKey) { h.fxKey = key; h.fx.innerHTML = list.map(x => `<span class="${FX[x.id].b ? "" : "d"}">${FX[x.id].s}</span>`).join(""); }
    for (const el of h.bench) {
      const mb = B.byId(+el.dataset.uid), [st, cd] = benchState(side, mb);
      el.className = "bm " + st; setCD(el.lastChild, cd);
    }
  }
  const left = Math.max(0, TIME_LIMIT - B.t);
  setTxt($("#bClock"), Math.floor(left / 60) + ":" + String(Math.floor(left % 60)).padStart(2, "0"));
  const u = BT.cur.A, C = BT.ctl; if (!u || !C || u.status !== "field") return;
  for (const btn of C.acts) {
    const slot = btn.dataset.a === "atk" ? 1 : btn.dataset.a === "s2" ? 2 : 3, ok = B.ready(u, slot);
    let cd = 0, t = "";
    if (slot === 3) { const need = (u.skills.find(s => s.slot === 3) || {}).arc || 100; cd = 1 - clamp(B.mc.A / need, 0, 1); if (!ok) t = Math.floor(Math.min(B.mc.A, need)) + "%"; }
    else { cd = (u.cool[slot] || 0) / B.cdFor(u, slot); if (slot === 2 && u.cool[2] > 0) t = Math.ceil(u.cool[2]) + ""; }
    if (!ok && slot > 1 && (B.has(u, "SILENCE") || B.has(u, "PROVOKE"))) t = "✕";
    if (B.has(u, "STUN")) t = slot === 1 ? "" : "✕";
    btn.classList.toggle("off", !ok); btn.classList.toggle("ready", ok && slot === 3);
    setCD($(".cdw", btn), cd); if (slot > 1) setTxt($(".cdt", btn), t);
  }
  for (const btn of C.tags) {
    const m = B.byId(+btn.dataset.uid), [st, cd, t] = benchState("A", m), ok = B.canTag("A", m);
    btn.className = "tagbtn " + (ok ? "ready" : st);
    setCD($(".cdw", btn), cd); setTxt($(".tl", btn), ok ? "TAG" : t || "TAG"); setTxt($(".cdt", btn), st === "cd" ? t : "");
    setW($(".hpb i", btn), m.hp / m.max.hp);
  }

function unitAt(x, y) {
  let best = null, bd = 1e9;
  for (const vu of BT.vus.values()) {
    if (!vu.scr || vu.dead || vu.gone || !vu.shown) continue;
    const s = vu.scr.s, cx = vu.scr.x, cy = vu.scr.y - 26 * s, d = Math.hypot(x - cx, y - cy);
    if (d < 52 * s + 14 && d < bd) { bd = d; best = vu; }

}

// ---------- the launch ----------
// Pull the ripcord: a needle swings across the meter, and tapping while it's in the gold zone is a Perfect Launch
const LAUNCH_ZONE = [.8, .94];
function launchQ(p) {
  const c = (LAUNCH_ZONE[0] + LAUNCH_ZONE[1]) / 2, h = (LAUNCH_ZONE[1] - LAUNCH_ZONE[0]) / 2, d = Math.abs(p - c);
  return d <= h ? .9 + .1 * (1 - d / h) : clamp(.85 - (d - h) * 2.2, .15, .85);
}
function launchMeter() {
  return new Promise(res => {
    const wrap = $(".bwrap"), el = document.createElement("div");
    el.className = "launch";
    el.innerHTML = `<div class="lhint">Pull the ripcord! Tap when the needle hits the gold zone</div>
      <div class="lmeter"><i class="lz" style="left:${LAUNCH_ZONE[0] * 100}%;width:${(LAUNCH_ZONE[1] - LAUNCH_ZONE[0]) * 100}%"></i><i class="ln"></i></div>
      <button class="btn lgo">LET IT RIP!</button>`;
    wrap.appendChild(el);
    const t0 = BT.clock, ln = $(".ln", el);
    let done = false;
    const pos = () => { const f = ((BT.clock - t0) / 1100) % 2; return f < 1 ? f : 2 - f; };
    const fire = ev => {
      if (ev) ev.preventDefault();
      if (done || BT.paused) return; done = true; BT.meterTick = null;
      const q = launchQ(pos());
      el.innerHTML = `<div class="lres">${q >= .9 ? "PERFECT!" : q >= .6 ? "GOOD!" : q >= .3 ? "OK" : "WEAK…"}</div>`;
      setTimeout(() => el.remove(), 700);
      res(q);
    };
    BT.meterTick = () => { ln.style.left = pos() * 100 + "%"; if (BT.clock - t0 > 8000) fire(); };
    el.addEventListener("pointerdown", fire);
  });
}
async function launchPhase() {
  const h = BT.home;
  banner(BT.cfg.title || "Battle", BT.cfg.sub || "", "ls");
  camTo({ ...h, yaw: h.yaw - .7, pitch: h.pitch * .75, dist: h.dist * 1.15 }, 1, true);
  camTo({ ...h }, 1.3);
  await bwait(900);

  hideBanner();
  const q = BT.B.auto ? .75 : await launchMeter();

function playScene(lines, title, env) {
  return new Promise(resolve => {
    const root = $("#dlg"), th = mapTheme(env);
    root.innerHTML = `<div class="dwrap">
      <div class="dbg" style="background:${th.b}">${sceneSVG(env)}</div>
      <img class="dchar left" id="dL" alt="" hidden><img class="dchar right" id="dR" alt="" hidden>
      <div class="dtop"><span class="ttl">${esc(title || "")}</span><div class="row"><button class="tog" id="dAuto">AUTO</button><button class="tog" id="dSkip">SKIP</button></div></div>
      <div class="dbox" id="dBox"><div class="dname" id="dName" hidden></div><div class="dtext" id="dText"></div><div class="dnext" id="dNext" hidden></div></div>
    </div>`;
    root.hidden = false;
    let i = -1, typing = 0, full = "", auto = false, timer = 0, autoT = 0;
    const L = $("#dL"), Rr = $("#dR"), side = {};
    const done = () => { clearInterval(timer); clearTimeout(autoT); root.hidden = true; root.innerHTML = ""; resolve(); };
    const showLine = () => {
      i++; if (i >= lines.length) return done();
      const ln = lines[i], sp = SPK[ln.s] || { n: ln.s };
      const nm = $("#dName"); nm.hidden = !sp.n; nm.textContent = sp.n || "";
      $("#dBox").classList.toggle("dnarr", ln.s === "narr");
      const art = sp.op ? opArt(sp.op).blader : sp.en ? enemyArt(sp.en).blader : sp.fig ? bladerArt("spk:" + ln.s, sp.fig) : null;
      if (art) {
        const isRight = !!sp.en || !!sp.right, img = isRight ? Rr : L;
        if (side[isRight ? "R" : "L"] !== ln.s) { img.classList.add("enter"); img.src = art; img.hidden = false; side[isRight ? "R" : "L"] = ln.s; requestAnimationFrame(() => requestAnimationFrame(() => img.classList.remove("enter"))); }
        if (isRight) img.style.transform = "scaleX(-1)";
        L.classList.toggle("dim", isRight); Rr.classList.toggle("dim", !isRight);
      } else { L.classList.add("dim"); Rr.classList.add("dim"); }
      full = ln.t; let n = 0; const tx = $("#dText"); tx.textContent = ""; $("#dNext").hidden = true;
      clearInterval(timer);
      typing = 1;
      timer = setInterval(() => { n += 2; tx.textContent = full.slice(0, n); if (n >= full.length) { clearInterval(timer); typing = 0; $("#dNext").hidden = false; if (auto) autoT = setTimeout(showLine, 1100 + full.length * 18); } }, 22);
    };
    root.onclick = ev => {
      if (ev.target.closest("#dSkip")) return done();
      if (ev.target.closest("#dAuto")) { auto = !auto; $("#dAuto").classList.toggle("on", auto); if (auto && !typing) showLine(); return; }
      clearTimeout(autoT);
      if (typing) { clearInterval(timer); typing = 0; $("#dText").textContent = full; $("#dNext").hidden = false; if (auto) autoT = setTimeout(showLine, 1200); }
      else showLine();
    };
    showLine();
  });
}

function gachaReveal(results) {
  return new Promise(resolve => {
    const top = Math.max(...results.map(r => OPS[r.key].rar));
    const root = $("#gacha");
    root.innerHTML = `<div class="gwrap"><canvas class="gcv" id="gcv"></canvas><div class="gtitle" id="gT"><div class="eyebrow">Random Booster</div><h1>3, 2, 1… Let it rip!</h1><p class="small dim">Tap to open</p></div><div class="ggrid" id="gG" hidden></div><button class="btn" id="gDone" hidden>Done</button></div>`;
    root.hidden = false;
    const cv = $("#gcv"), g = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
    const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; g.scale(dpr, dpr);
    const col = RC[top], stars = [];
    for (let k = 0; k < 90; k++) stars.push({ x: R() * W, y: R() * H, v: 2 + R() * 9, l: 20 + R() * 80 });
    let run = true;
    const loop = () => {
      if (!run || !cv.isConnected) return; requestAnimationFrame(loop);
      g.fillStyle = "rgba(2,4,10,.35)"; g.fillRect(0, 0, W, H);
      g.strokeStyle = col; g.lineWidth = 2; g.globalCompositeOperation = "lighter";
      for (const s of stars) { s.y += s.v; s.x -= s.v * .35; if (s.y > H + 40) { s.y = -40; s.x = R() * W * 1.3; } g.globalAlpha = .5; g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x + s.l * .35, s.y - s.l); g.stroke(); }
      g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    };
    loop(); sfx("special");
    let stage = 0;
    const show = () => {
      stage = 1; $("#gT").hidden = true; const G = $("#gG"); G.hidden = false;
      if (results.length === 1) { G.style.gridTemplateColumns = "1fr"; G.style.maxWidth = "260px"; }
      G.innerHTML = results.map((r, i) => { const op = OPS[r.key]; return `<div class="gcard" style="--rc:${RC[op.rar]};animation-delay:${i * .12}s">${r.isNew ? '<span class="gnew">NEW</span>' : ""}<img src="${spriteURL(op)}" alt="${esc(op.n)}"><span class="gst">${"★".repeat(op.rar)}<br>${esc(op.n)}<br><span style="font-size:.85em"><b style="color:${ELC[op.el]}">${elShort(op.el)}</b> ${esc(op.blader)}</span></span></div>`; }).join("");
      if (top >= 5) sfx("win"); else sfx("heal");
      setTimeout(() => { $("#gDone").hidden = false; stage = 2; }, results.length * 120 + 500);
    };
    root.onclick = ev => {
      if (ev.target.id === "gDone") { run = false; root.hidden = true; root.innerHTML = ""; resolve(); return; }
      if (stage === 0) show();
    };
    setTimeout(() => { if (stage === 0) show(); }, 1600);
  });
}

// ---------- inbox ----------
function mailTo(s, m) {
  s.inbox = s.inbox || [];
  const mail = { id: ++s.mailSeq, t: Date.now(), from: m.from || "BBA", title: m.title, body: m.body || "", rewards: m.rewards || {},
    claimed: false, read: false, exp: m.noExp ? 0 : Date.now() + MAIL_DAYS * DAY_MS, tag: m.tag || "" };
  s.inbox.unshift(mail);
  return mail;
}
function sendMail(m, quiet) { const mail = mailTo(S, m); if (!quiet) toast(`New mail: ${m.title}`, "gold"); return mail; }
const hasRewards = m => Object.keys(m.rewards).length > 0;
const unclaimedMail = () => (S.inbox || []).filter(m => !m.claimed && hasRewards(m));
const unreadMail = () => (S.inbox || []).filter(m => !m.read || (!m.claimed && hasRewards(m)));
function purgeMail() {
  const now = Date.now();
  S.inbox = (S.inbox || []).filter(m => !(m.exp && now > m.exp) && !(m.claimed && now - m.t > MAIL_DAYS * DAY_MS)).slice(0, 120);
}
function claimMail(m) {
  if (!m || m.claimed || !hasRewards(m)) { if (m) m.read = true; return []; }
  m.claimed = true; m.read = true;
  return give(m.rewards);
}

  g.fillStyle = "#c8d0e0"; g.beginPath(); g.ellipse(cx, cy, R * 1.08, R * 1.08 * e, 0, 0, 7); g.fill();

  const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .8); vig.addColorStop(0, "#0000"); vig.addColorStop(1, "#000b");

// rival Bladers' Beyblades fight a few levels under the stage, with stock parts and 80% Spin and ATK
const RIVAL_LV = 3, RIVAL_SCALE = .8;
const convOne = (s, lv) => { if (!s.op) return { en: s.e, LV: lv + (ENEMY[s.e].boss ? 3 : 0) }; const LV = Math.max(1, lv - RIVAL_LV); return { op: s.op, LV, prog: progForLV(s.op, LV), scale: RIVAL_SCALE }; };
// a rival team for a 1-on-1 tag battle: up to three Beyblades from the stage's rounds; bosses always come, and last
function rivalPicks(waves) {
  const all = waves.flat(), isBoss = s => s.e && ENEMY[s.e].boss;
  const boss = all.filter(isBoss), rest = all.filter(s => !isBoss(s));
  // prefer the last round's rivals (the stronger ones), then fill from earlier rounds
  const pool = [...rest.slice().reverse()];
  const picks = pool.slice(0, Math.max(0, TEAM_SIZE - boss.length)).reverse();
  return [...picks, ...boss].slice(0, TEAM_SIZE);
}
const rivalTeam = (waves, lv) => rivalPicks(waves).map(s => convOne(s, lv));
const allySpecs = ids => ids.filter(owned).map(k => ({ op: k, prog: S.ops[k] }));
const recFor = lv => lv < 20 ? "rec1" : lv < 40 ? "rec2" : lv < 60 ? "rec3" : "rec4";
function squadOrToast(mode) {
  const ids = S.team[mode].filter(owned);
  if (!ids.length) { toast("Pick at least one Beyblade."); return null; }
  return ids;
}
function opsXp(ids, xp) { for (const k of ids) opXp(k, xp); return { k: "xp", n: xp }; }
function rollPart(rars, pool) {
  let r = R(), rar = 1;
  for (let i = 0; i < rars.length; i++) { if (r < rars[i]) { rar = i + 1; break; } r -= rars[i]; rar = i + 1; }
  const pt = makePart(randomModel(pool), rar); S.parts.push(pt);
  return { k: "part", n: 1, part: pt };
}

async function launchNode(id) {

  spendSanity(cost); S.stats.battles++; save();

      const stars = missions.filter(m => m.ok).length, prev = nodeStars(id);
