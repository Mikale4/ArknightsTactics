<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e3350d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pokémon Kanto Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: one-screen phone app. Trainer and money on top, a scrolling view in the middle, five tabs at the bottom;
   battles open full screen. Look: bright and rounded, Poké Ball red and white, like the handheld menus. */
:root{
  --bg:#eef2f8; --card:#ffffff; --card2:#f5f7fb; --card3:#e8edf5; --line:#d8deea; --line2:#c2cadb;
  --text:#1f2633; --dim:#5d6678; --faint:#8a93a6;
  --red:#e3350d; --red2:#b8280a; --blue:#3b7dd8; --blue2:#2a5aa8; --gold:#f2b63a; --good:#2a9a5a; --bad:#d8402e;
  --f-title:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;
  --f-body:"Nunito","Segoe UI",Roboto,Arial,sans-serif;
  --f-display:var(--f-title);
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.35 var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}
img.px,.px img,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- app shell ---------- */
#app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);position:relative;
  background:radial-gradient(circle at 100% 0,#ffffff 0,transparent 40%),
    radial-gradient(circle at 92% 30%,transparent 46px,#e3350d0d 47px 49px,transparent 50px),
    radial-gradient(circle at 6% 70%,transparent 60px,#3b7dd80d 61px 63px,transparent 64px),var(--bg)}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#f0442a,var(--red));color:#fff;
  box-shadow:0 3px 0 #9a2208,0 6px 14px #0002;padding-top:calc(8px + env(safe-area-inset-top,0px));position:relative;z-index:2}
.me{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.me-av{width:36px;height:36px;flex:none;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 2px #9a2208;overflow:hidden;display:grid;place-items:center}
.me-av img{width:44px;height:44px;object-fit:cover;object-position:50% 10%}
.me-name{font:700 14px var(--f-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-name .num{font:800 11px var(--f-body);opacity:.85}
.me-xp{height:4px;background:#ffffff44;margin-top:3px;width:80px;max-width:100%;border-radius:2px;overflow:hidden}
.me-xp i{display:block;height:100%;background:#fff}
.res{display:flex;gap:5px;flex:none}
.pill{display:flex;align-items:center;gap:3px;padding:3px 8px 3px 3px;background:#fff;color:var(--text);border-radius:999px;font:800 12.5px var(--f-body);
  font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:inset 0 -2px 0 #0001}
.pill svg{width:18px;height:18px;flex:none}
.pill small{font:600 10px var(--f-body);color:var(--dim)}
#view{overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px #0000000d;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;color:var(--faint);font:700 11px var(--f-title);position:relative;white-space:nowrap}
#tabs button svg{width:24px;height:24px}
#tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#tabs button.on{color:var(--red)}
#tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* ---------- text ---------- */
h1,h2,h3{margin:0;font-family:var(--f-title);font-weight:700;line-height:1.1;text-wrap:balance}
h1{font-size:28px} h2{font-size:21px} h3{font-size:16px}
.eyebrow{font:800 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11.5px}
.good{color:var(--good)} .bad{color:var(--bad)} .gold{color:#b8860b}
p{margin:0}

/* ---------- surfaces ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 2px 0 #00000008,0 4px 16px #1f26330d;border:1px solid var(--line)}
.sub{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.divider{height:1px;background:var(--line);margin:2px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border:2px solid var(--line);border-radius:999px;font:700 12.5px var(--f-title);color:var(--dim);background:#fff}
.chip[style*="--tc"]{border-color:color-mix(in srgb,var(--tc) 50%,#fff)}
.chip.on{color:#fff;background:var(--red);border-color:var(--red)}
.chip.on[style*="--tc"]{background:var(--tc);border-color:var(--tc)}
.chip:disabled{opacity:.4}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font:800 11px var(--f-body);background:var(--card3);color:var(--dim)}
.ty{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font:700 11.5px var(--f-title);color:#fff;background:var(--tc);text-shadow:0 1px 1px #0005;box-shadow:inset 0 -2px 0 #0002;white-space:nowrap}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.tabs2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card3);border-radius:999px;padding:3px;gap:2px}
.tabs2 button{padding:8px 4px;font:700 13px var(--f-title);color:var(--dim);border-radius:999px;white-space:nowrap}
.tabs2 button.on{background:#fff;color:var(--red);box-shadow:0 2px 6px #0002}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:999px;
  font:700 16px var(--f-title);color:#fff;background:linear-gradient(180deg,#f2563a,var(--red));box-shadow:0 3px 0 var(--red2),0 6px 12px #e3350d33;transition:transform .08s,filter .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red2)}
.btn.blue{background:linear-gradient(180deg,#5a96e8,var(--blue));box-shadow:0 3px 0 var(--blue2),0 6px 12px #3b7dd833}
.btn.ghost{color:var(--text);background:#fff;box-shadow:0 2px 0 var(--line2),inset 0 0 0 2px var(--line)}
.btn.red{background:linear-gradient(180deg,#f06a5a,var(--bad));box-shadow:0 3px 0 #8a2018}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{filter:grayscale(1);opacity:.5;pointer-events:none}
.cost{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:800}
.cost svg{width:16px;height:16px}
.btn .cost{font-family:var(--f-body)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:96px;padding:12px;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 3px 0 var(--line),0 6px 14px #1f26330d}
.tile h3{font-size:17px;padding-right:34px}
.tile .tsub{font-size:12px;color:var(--dim)}
.tile .ticon{position:absolute;right:10px;top:10px;width:40px;height:40px}
.tile .ticon svg{width:100%;height:100%}
.tile:disabled{opacity:.5}
.tile.ls-t{background:linear-gradient(140deg,#ffe8e2,#fff 70%)}
.tile.ds-t{background:linear-gradient(140deg,#e2ecff,#fff 70%)}
.tile.wide{grid-column:1/-1;min-height:74px}
.tile.chap,.tile.hunt{min-height:92px;background:linear-gradient(115deg,color-mix(in srgb,var(--cc) 30%,#fff),#fff 70%);padding-right:84px}
.tile .chtr{position:absolute;right:6px;bottom:0;height:86px;width:86px;object-fit:contain;object-position:bottom}
.tile.shopit{min-height:118px}
.tile.shopit .ticon{width:44px;height:44px}
.hint{color:var(--text);text-align:left;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:#fff8e6;border:2px solid #f2d68a}
.hint svg{flex:none}

/* ---------- portraits ---------- */
.pt{position:relative;width:var(--s,72px);flex:none;text-align:center}
.pt .ring{position:relative;width:100%;aspect-ratio:1;border-radius:50%;padding:4px;
  background:radial-gradient(circle at 50% 70%,#fff 0 40%,transparent 41%),linear-gradient(135deg,color-mix(in srgb,var(--gc) 55%,#fff),color-mix(in srgb,var(--gc2) 55%,#fff));
  box-shadow:inset 0 0 0 3px #fff,0 0 0 2px color-mix(in srgb,var(--gc) 70%,#fff),0 3px 6px #0002}
.pt .ring img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.pt .lv{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);min-width:24px;padding:0 5px;height:18px;border-radius:9px;
  background:#fff;border:2px solid var(--gc);font:800 11px/14px var(--f-body);color:var(--text)}
.pt.locked .ring{filter:grayscale(1) opacity(.5)}
.pt .potb{position:absolute;right:-4px;top:14px;font:900 9px var(--f-body);color:#fff;background:#7a4ad8;border-radius:5px;padding:1px 3px;z-index:2}
.pt .heldb{position:absolute;left:-3px;top:14px;width:18px;height:18px;z-index:2;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0003}
.pt .heldb svg{width:100%;height:100%}
.rstars{display:flex;justify-content:center;gap:0;height:12px;margin-bottom:2px}
.rstars svg{width:12px;height:12px}
.pname{margin-top:9px;font:700 12.5px/1.1 var(--f-title);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pname .sty{display:flex;justify-content:center;gap:3px;margin-top:3px}
.pname .sty i{width:14px;height:5px;border-radius:3px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 8px}
.rcell{display:flex;flex-direction:column;align-items:center;padding:6px 2px 6px;border-radius:14px;min-width:0}
.rcell .pt{--s:70px}
.rcell .pw{font:700 11px var(--f-body);color:var(--dim);font-variant-numeric:tabular-nums}
.rcell.ready{background:radial-gradient(60% 50% at 50% 35%,#ffe9a0,transparent)}
.rcell.adv .ring{box-shadow:inset 0 0 0 3px #fff,0 0 0 3px #f2b63a,0 0 12px #f2b63a}
.rcell.sel{background:#ffe8e2;box-shadow:inset 0 0 0 2px var(--red)}

/* ---------- summary ---------- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.statgrid div{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.statgrid span{color:var(--dim)}
.statgrid b{font-variant-numeric:tabular-nums}
.sbar{display:grid;grid-template-columns:34px 34px 1fr;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.sbar span{color:var(--dim);font-weight:800} .sbar b{text-align:right}
.sbar i{height:8px;background:var(--card3);border-radius:4px;overflow:hidden} .sbar em{display:block;height:100%;border-radius:4px}
.ab{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.abicon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;font:700 14px var(--f-title);color:#fff;background:var(--tc);box-shadow:inset 0 -3px 0 #0002;text-shadow:0 1px 1px #0005}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:6px;background:var(--card3);border-radius:3px}
.pips i.on{background:var(--red)}
.bar{height:9px;background:var(--card3);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc84,#8ae8b0);border-radius:5px}
.opcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 22%,#fff),#fff 60%,color-mix(in srgb,var(--tc2) 18%,#fff))}
.opcard .opart{width:136px;height:136px;border-radius:50%;background:radial-gradient(circle at 50% 75%,#fff 0 45%,color-mix(in srgb,var(--tc) 30%,#fff) 46%);display:grid;place-items:center;box-shadow:inset 0 0 0 4px #fff,0 0 0 2px color-mix(in srgb,var(--tc) 60%,#fff)}
.opcard .opart img{width:124px;height:124px;object-fit:contain}
.opcard .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.evoline{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.evoline button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:12px;min-width:60px}
.evoline button.cur{background:#ffe8e2;box-shadow:inset 0 0 0 2px var(--red)}
.evoline button.unowned .pt{filter:grayscale(.8) opacity(.6)}
.evorow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card2);border:1px solid var(--line);border-radius:14px}
.evorow > img{width:52px;height:52px;object-fit:contain}
.ri{display:grid;place-items:center;border-radius:12px;background:var(--card2);border:1px solid var(--line);flex:none}
.ri svg{width:72%;height:72%}

/* ---------- home ---------- */
.lobby{position:relative;min-height:calc(100% - 4px);display:flex;flex-direction:column;gap:12px}
.stage{position:relative;height:min(52vh,430px);margin:-14px -16px 0;overflow:hidden;background:linear-gradient(180deg,#5aa0ea,#a8d6f6 55%,#e8f6ff)}
.stage .sky{position:absolute;inset:0;background:radial-gradient(40px 14px at 20% 22%,#fff 60%,transparent 62%),radial-gradient(60px 16px at 28% 20%,#fff 60%,transparent 62%),
  radial-gradient(50px 14px at 76% 14%,#fff 60%,transparent 62%),radial-gradient(70px 18px at 84% 12%,#fff 60%,transparent 62%);animation:drift 30s linear infinite alternate}
@keyframes drift{to{transform:translateX(30px)}}
.stage .hill{position:absolute;left:-20%;right:-20%;bottom:16%;height:40%;border-radius:50% 50% 0 0;background:#7ac25a;box-shadow:0 -20px 0 -6px #9ad87a}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#6ab24a,#4a8a3a)}
.stage .floor::before{content:"";position:absolute;left:50%;top:18%;width:66%;height:44%;transform:translateX(-50%);border-radius:50%;background:#d8c88a;box-shadow:inset 0 -6px 0 #b8a868}
.stage img.assist{position:absolute;left:56%;bottom:13%;height:62%;max-width:70%;object-fit:contain;object-position:bottom;transform-origin:50% 100%;transform:translateX(-50%);
  filter:drop-shadow(0 8px 6px #0003);animation:breathe 3.2s ease-in-out infinite;cursor:pointer}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1,1)}50%{transform:translateX(-50%) scale(1.01,1.03)}}
.stage img.trainer{position:absolute;left:4%;bottom:12%;height:34%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 4px #0003)}
.stage img.trainer.solo{left:50%;transform:translateX(-50%);height:48%}
.stage .quip{position:absolute;left:16px;right:76px;top:14px;padding:10px 12px;background:#fff;border:3px solid #48506a;border-radius:14px;font-size:14px;animation:rise .3s ease-out;z-index:3}
.stage .quip b{color:var(--red);font:700 13px var(--f-title);display:block}
.stage .nameplate{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:3px;padding:8px 12px;background:#ffffffe6;border-radius:14px;box-shadow:0 3px 10px #0002}
.stage .nameplate b{font:700 20px/1 var(--f-title)}
.stage .sidebtns{position:absolute;right:10px;bottom:20px;display:flex;flex-direction:column;gap:20px;z-index:2}
.stage .sidebtns.left{left:10px;right:auto;top:14px;bottom:auto}
.sidebtn{position:relative;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:#fff;color:var(--red);box-shadow:0 3px 0 var(--line2),0 4px 10px #0002}
.sidebtn svg{width:26px;height:26px}
.sidebtn small{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font:700 10px var(--f-title);color:#1f2633;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}
.sidebtn .dot{top:-3px;right:-3px}
.sidebtn .cnt{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--red);color:#fff;font:800 11px/19px var(--f-body);font-style:normal;text-align:center;border:2px solid #fff}
.badgecase{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px;background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:inset 0 2px 6px #0000000f}
.badgecase.sm{margin-top:10px;padding:6px}
.bdg{aspect-ratio:1;display:grid;place-items:center} .bdg svg{width:86%;height:86%}
.bdg.on svg{filter:drop-shadow(0 2px 2px #0003)}
.bigbadge{width:110px;height:110px;animation:pop .5s} .bigbadge svg{width:100%;height:100%;filter:drop-shadow(0 6px 8px #0003)}

/* ---------- journey ---------- */
.ep-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff,#ffeae4)}
.mapwrap{position:relative;margin:0 -16px;overflow:hidden}
.mapwrap svg.map{display:block;width:100%;height:auto}
.mnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text)}
.mnode .disc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#fff;border:4px solid #48506a;box-shadow:0 4px 10px #0003;overflow:hidden}
.mnode .disc svg{width:26px;height:26px;color:var(--red)}
.mnode .disc img{width:120%;height:120%;object-fit:contain;object-position:center 20%}
.mnode.boss .disc{width:64px;height:64px;border-color:var(--red)}
.mnode.story .disc{border-color:var(--blue)}
.mnode.chest .disc{border-color:var(--gold)}
.mnode.side .disc{border-style:dashed;border-color:#7a4ad8}
.mnode.next .disc{border-color:var(--gold);animation:pulse 1.4s infinite}
.mnode.locked{opacity:.45;pointer-events:none}
.mnode.locked .disc{filter:grayscale(1)}
.mnode.done .disc{background:#e8f8ee}
.mnode .lbl{font:700 11px var(--f-title);padding:1px 8px;border-radius:999px;background:#fff;box-shadow:0 2px 4px #0003;white-space:nowrap}
.mnode .nst{display:flex;height:11px} .mnode .nst svg{width:11px;height:11px}
@keyframes pulse{50%{box-shadow:0 0 0 5px #f2b63a66,0 0 18px #f2b63a}}
.mission{display:flex;align-items:center;gap:8px;font-size:13px}
.mission svg{width:16px;height:16px;flex:none}
.nstars{display:flex;gap:1px} .nstars svg{width:16px;height:16px}

/* ---------- team select ---------- */
.squad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 8px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.slot{display:flex;flex-direction:column;align-items:center;position:relative}
.slot .pt{--s:min(66px,18vw)}
.slot .empty{width:min(66px,18vw);aspect-ratio:1;border-radius:50%;border:3px dashed var(--line2);margin-top:14px}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:#1f263380;backdrop-filter:blur(2px);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#modal .mbox{width:100%;max-width:520px;max-height:calc(100% - 30px);overflow:auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 40px #0004;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{padding:9px 16px;background:#fff;border:3px solid #48506a;color:var(--text);font:700 14px var(--f-body);border-radius:14px;box-shadow:0 8px 24px #0003;animation:tin .25s ease-out}
.toast.gold{border-color:var(--gold)}

/* ---------- battle ---------- */

.bwrap{position:relative;width:100%;height:100%;overflow:hidden;touch-action:manipulation}
#bcv{position:absolute;inset:0;display:block;touch-action:none}
.btop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:8px 10px;pointer-events:none}

.bt-title b{font:700 14px var(--f-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.wx{width:34px;height:34px;display:grid;place-items:center;font-size:18px;background:#ffffffd9;border-radius:10px}
.tog{min-width:44px;height:34px;padding:0 10px;border-radius:10px;background:#ffffffd9;font:700 13px var(--f-title);color:var(--text);box-shadow:0 2px 6px #0002}
.tog.on{background:var(--blue);color:#fff}
.turnstrip{position:absolute;left:0;right:0;top:52px;display:flex;gap:4px;padding:0 10px;z-index:3;pointer-events:none}

.turnstrip img.en{border-color:var(--red)}
.turnstrip img:first-child{width:40px;height:40px;border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.bmsg{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-height:62px;padding:12px 16px;background:#fff;border:4px solid #48506a;
  border-radius:16px;box-shadow:inset 0 0 0 3px #e8d090,0 6px 18px #0005;font:700 16px/1.35 var(--f-body);color:#1f2633;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.bmsg.show{opacity:1}
.bmsg.big{font-size:17px}
.bmsg.pop{animation:mpop .18s ease-out}
@keyframes mpop{from{transform:translateY(4px)}}
.bctl{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:none;flex-direction:column;gap:8px;
  background:linear-gradient(0deg,#1f2633f2 60%,#1f263300)}
.bctl.on{display:flex}
.bwait{font:700 13px var(--f-title);color:#fff;text-align:center}
.bwho{display:flex;align-items:center;gap:8px;min-width:0}
.bpt{width:48px;height:48px;border-radius:50%;border:3px solid #fff;flex:none;background:#fff;object-fit:contain}
.bwn{min-width:0;color:#fff}
.bwn b{display:block;font:700 16px var(--f-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bwn small{display:block;font-size:11.5px;color:#d8dee8}
.mvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mvbtn{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-height:64px;padding:8px 10px;border-radius:14px;text-align:left;
  background:linear-gradient(180deg,#fff,#eef1f6);border:3px solid var(--tc);box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 70%,#000);color:var(--text);overflow:hidden}
.mvbtn b{font:700 14px/1.1 var(--f-title);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvbtn .mvmeta{display:flex;flex-wrap:wrap;gap:3px}
.mvbtn .ty{font-size:10px;padding:0 6px}
.mvbtn .eff{font:900 9.5px var(--f-body);padding:0 5px;border-radius:5px;color:#fff}
.mvbtn .eff.se{background:var(--good)} .mvbtn .eff.nve{background:#8a93a6} .mvbtn .eff.no{background:var(--bad)}
.mvbtn.off{filter:grayscale(.7);opacity:.75}
.mvbtn .cdv{position:absolute;right:6px;top:6px;font:900 11px var(--f-body);background:#1f2633;color:#fff;border-radius:6px;padding:0 5px}
.mvbtn.ready{animation:pulse 1.4s infinite}
.mvbtn.picking{border-color:var(--good);box-shadow:0 0 14px var(--good)}
.mvbtn:active{transform:translateY(2px)}
.btrainer{position:absolute;right:-30%;top:18%;width:42%;max-width:220px;z-index:4;transition:right .4s cubic-bezier(.2,.8,.2,1);pointer-events:none}

.btrainer:not(.in) q{display:none}
.btrainer q{position:absolute;right:30%;top:-10%;width:180%;max-width:300px;padding:8px 10px;background:#fff;border:3px solid #48506a;border-radius:12px;font:700 12.5px var(--f-body);quotes:none}
.bpop{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:#1f263399}
.bpopbox{width:100%;max-width:400px;max-height:90%;overflow:auto;background:#fff;border-radius:20px;padding:16px;animation:rise .2s ease-out;color:var(--text)}

.result{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 16px;
  background:radial-gradient(80% 60% at 50% 40%,#ffffffee,#eef2f8f5);animation:rise .3s ease-out;text-align:center;overflow:auto;color:var(--text)}
.result h1{font-size:clamp(30px,9vw,44px);color:var(--red)}

.bigstars{display:flex;gap:6px} .bigstars span{width:48px;height:48px;display:block} .bigstars svg{width:100%;height:100%}

.bigstars span:nth-child(2){animation-delay:.15s}.bigstars span:nth-child(3){animation-delay:.3s}
.lvups{display:flex;flex-direction:column;gap:4px;width:100%;max-width:360px}

.cutin{position:absolute;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.cutin .band{position:absolute;left:-20%;right:-20%;top:30%;height:40%;transform:skewY(-8deg);background:linear-gradient(90deg,transparent,var(--ec) 15%,#fff 50%,var(--ec) 85%,transparent);opacity:.95;animation:bandin .9s ease-out both}

.cutin img{position:absolute;bottom:26%;height:42%;left:-4%;image-rendering:pixelated;filter:drop-shadow(0 0 14px var(--ec));animation:artin .95s cubic-bezier(.2,.8,.2,1) both}

.cutin .sk b{display:block;font:700 clamp(26px,8vw,42px)/1 var(--f-title);color:#fff;-webkit-text-stroke:2px #1f2633;paint-order:stroke;text-shadow:0 0 14px var(--ec)}
@keyframes bandin{0%{transform:skewY(-8deg) scaleY(0)}20%{transform:skewY(-8deg) scaleY(1)}85%{opacity:.95}100%{opacity:0}}
@keyframes lines{from{background-position:0 0}to{background-position:-300px 0}}
@keyframes artin{0%{transform:translateX(-40%);opacity:0}25%{transform:translateX(0);opacity:1}80%{transform:translateX(6%);opacity:1}100%{transform:translateX(12%);opacity:0}}
@keyframes skin{0%{transform:translateX(30%);opacity:0}25%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}

/* ---------- dialogue ---------- */
#dlg{position:fixed;inset:0;z-index:70;background:#000;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.dchar.left{left:2%} .dchar.right{right:2%}
.dchar.dim{filter:brightness(.6) drop-shadow(0 8px 8px #0004)}
.dchar.enter{opacity:0;transform:translateY(16px)}
.dbox{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));min-height:126px;padding:20px 18px 18px;background:#fff;border:5px solid #48506a;border-radius:18px;
  box-shadow:inset 0 0 0 4px #e8d090,0 8px 24px #0006}

@keyframes bob{50%{transform:translateY(4px)}}

.dnarr .dtext{font-style:italic;color:#48506a}

/* ---------- Pokédex ---------- */
.dexhead{background:linear-gradient(135deg,#fff,#ffeae4)}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.dexcell{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;background:#fff;border:1px solid var(--line);border-radius:12px;min-width:0}

.dexcell .tiny{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}

.dexcell .ball{position:absolute;right:4px;top:4px;width:14px;height:14px} .dexcell .ball svg{width:100%;height:100%}

/* ---------- Safari Zone ---------- */
.banner-card{position:relative;overflow:hidden;min-height:220px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  background:linear-gradient(180deg,#f2c87a,#e8d890 50%,#9ac86a)}
.banner-card .bmain{position:absolute;right:-4%;bottom:0;height:88%;max-width:62%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 6px #0003)}
.banner-card .bcrowd{position:absolute;right:0;top:0;display:grid;grid-template-columns:repeat(3,64px);gap:0;opacity:.95}

.freepull{display:flex;gap:10px;justify-content:flex-start;text-align:left;line-height:1.2;background:linear-gradient(180deg,#8ad86a,#4a9a3a);box-shadow:0 3px 0 #2a6a1a;animation:freeglow 2s ease-in-out infinite}
.freepull.master{background:linear-gradient(180deg,#a87ae8,#7a3fb8);box-shadow:0 3px 0 #4a1a7a}
.freepull small{font:700 12px var(--f-body);opacity:.9}
@keyframes freeglow{50%{filter:brightness(1.12)}}
#gacha{position:fixed;inset:0;z-index:75;background:#1f2633;display:flex;justify-content:center}
.gwrap{position:relative;width:100%;max-width:560px;height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.gcv{position:absolute;inset:0;width:100%;height:100%}
.gtitle{position:relative;text-align:center;color:#1f2633}

.ggrid{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%;max-width:520px}
.gcard{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 60%,#fff,#e8edf5);border:3px solid var(--rc);box-shadow:0 4px 0 #0002;animation:cardin .45s backwards}
.gcard.r4{box-shadow:0 0 0 2px #3b7dd8,0 0 14px #3b7dd8} .gcard.r5{box-shadow:0 0 0 2px #f2b63a,0 0 18px #f2b63a}
.gcard img{position:absolute;left:50%;top:6%;width:96%;transform:translateX(-50%);object-fit:contain}
.gcard .gst{position:absolute;left:0;right:0;bottom:0;padding:2px;text-align:center;font:700 10px/1.15 var(--f-title);background:#fffd;color:#1f2633}

@keyframes cardin{from{transform:translateY(30px) scale(.8);opacity:0}}
#gDone{position:relative}
.evo{background:radial-gradient(circle at 50% 45%,#2a3a6a,#0a0e1a)}
.evostage{position:relative;width:min(70vw,300px);aspect-ratio:1}
.evostage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.evostage .b{opacity:0}
.evostage.go .a{animation:evoA 3s steps(1) forwards}
.evostage.go .b{animation:evoB 3s steps(1) forwards}
.evostage.go img{filter:brightness(0) invert(1) drop-shadow(0 0 20px #fff)}
.evostage.done img{filter:none;transition:filter .5s}
.evostage.done .a{opacity:0} .evostage.done .b{opacity:1}

@keyframes evoB{0%,10%,25%,38%,50%,60%,68%,75%,81%,86%,90%,94%{opacity:0}5%,18%,32%,44%,55%,64%,72%,78%,84%,88%,92%,96%,100%{opacity:1}}
.evotext{position:relative;max-width:360px;padding:14px 18px;background:#fff;border:4px solid #48506a;border-radius:16px;font:700 16px/1.4 var(--f-body);color:#1f2633;text-align:center}
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.starter{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 22%,#fff),#fff);border:3px solid color-mix(in srgb,var(--tc) 60%,#fff);box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 60%,#fff)}

.tcard{background:linear-gradient(135deg,#fff,#e2ecff)}

.tload{position:absolute;left:14%;right:14%;bottom:calc(16% + env(safe-area-inset-bottom,0px));text-align:center;font:800 12px var(--f-body);color:#1f2633;transition:opacity .4s}
.tload.done{opacity:0}
.tbar{height:8px;border-radius:4px;background:#ffffff99;overflow:hidden;margin-bottom:6px;border:2px solid #fff}

// ---------- utils ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + "K" : Math.round(n).toLocaleString("en-US");
const fmtFull = n => Math.round(n).toLocaleString("en-US");
const pct = v => Math.round(v * 100) + "%";
function seeded(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const dur = ms => { const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000); if (m >= 60) return Math.floor(m / 60) + "h " + (m % 60) + "m"; return m + ":" + String(s).padStart(2, "0"); };
const today = () => new Date().toISOString().slice(0, 10);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function shade(hex, amt) {
  let c = hex.replace("#", ""); if (c.length === 3) c = c.split("").map(x => x + x).join("");
  const n = parseInt(c.slice(0, 6), 16), f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return "#" + [f(n >> 16 & 255), f(n >> 8 & 255), f(n & 255)].map(v => v.toString(16).padStart(2, "0")).join("");
}
function circ(g, x, y, r, col) { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
const dexNo = id => "#" + String(id).padStart(3, "0");

// ---------- types ----------
// The fifteen types of Kanto, with the type chart as it has stood since Gold and Silver (Ghost beats Psychic).
const TYPES = ["Normal", "Fire", "Water", "Electric", "Grass", "Ice", "Fighting", "Poison", "Ground", "Flying", "Psychic", "Bug", "Rock", "Ghost", "Dragon"];
const TC = { Normal: "#a8a77a", Fire: "#ee8130", Water: "#6390f0", Electric: "#f7d02c", Grass: "#7ac74c", Ice: "#96d9d6", Fighting: "#c22e28", Poison: "#a33ea1",
  Ground: "#e2bf65", Flying: "#a98ff3", Psychic: "#f95587", Bug: "#a6b91a", Rock: "#b6a136", Ghost: "#735797", Dragon: "#6f35fc" };
const ELC = TC; // the renderer colours units by their first type
const CHART = (() => {
  const se = { Fire: "Grass Ice Bug", Water: "Fire Ground Rock", Electric: "Water Flying", Grass: "Water Ground Rock", Ice: "Grass Ground Flying Dragon",
    Fighting: "Normal Ice Rock", Poison: "Grass", Ground: "Fire Electric Poison Rock", Flying: "Grass Fighting Bug", Psychic: "Fighting Poison",
    Bug: "Grass Psychic", Rock: "Fire Ice Flying Bug", Ghost: "Psychic Ghost", Dragon: "Dragon" };
  const nve = { Normal: "Rock", Fire: "Fire Water Rock Dragon", Water: "Water Grass Dragon", Electric: "Electric Grass Dragon", Grass: "Fire Grass Poison Flying Bug Dragon",
    Ice: "Fire Water Ice", Fighting: "Poison Flying Psychic Bug", Poison: "Poison Ground Rock Ghost", Ground: "Grass Bug", Flying: "Electric Rock", Psychic: "Psychic",
    Bug: "Fire Fighting Poison Flying Ghost", Rock: "Fighting Ground" };
  const imm = { Normal: "Ghost", Electric: "Ground", Fighting: "Ghost", Ground: "Flying", Ghost: "Normal" };
  const c = {};
  for (const a of TYPES) { c[a] = {}; for (const d of TYPES) c[a][d] = 1; }
  for (const [tab, v] of [[se, 2], [nve, .5], [imm, 0]]) for (const a in tab) for (const d of tab[a].split(" ")) c[a][d] = v;
  return c;
})();
const typeEff = (mt, defTypes) => defTypes.reduce((m, d) => m * CHART[mt][d], 1);
const typeChip = t => `<span class="ty" style="--tc:${TC[t]}">${t}</span>`;
const typeChips = ts => ts.map(typeChip).join("");
// what a type is strong and weak against, for the summary screen
const typeStrong = t => TYPES.filter(d => CHART[t][d] > 1);
const defWeak = ts => TYPES.filter(a => typeEff(a, ts) > 1);
const defResist = ts => TYPES.filter(a => typeEff(a, ts) < 1);

// =====================================================================
//  POKÉMON, MOVES, ABILITIES AND HELD ITEMS
//  Every Pokémon has three moves: S1 is free to use every turn, S2 and S3 have cooldowns (S3 starts on cooldown).
//  Skills keep the move's real type, category, power, accuracy and added effects (MOVES in a3a_dex.js).
// =====================================================================
const CAT_N = { P: "Physical", S: "Special", X: "Status" };
const CD = { 1: 0, 2: 3, 3: 4 };
const SPREAD = .75; // moves that hit every opposing Pokémon deal 75% damage, as in Double Battles
function moveTarget(M) {
  if (M.tg === "foes") return "aoe_enemies";
  if (M.tg === "self") return "self";
  if (M.tg === "team") return "team";
  if (M.tg === "ally") return "ally_single";
  if (M.tg === "field") return M.sp === "haze" ? "field" : "team";
  return "enemy";
}
// how a move looks in battle: contact moves run in, the rest fly across (or burst over every target)
function moveAnim(M, target) {
  if (M.c === "X") return target === "enemy" || target === "aoe_enemies" ? "status" : /recover|softboiled|rest/.test(M.sp || "") || M.hl ? "heal" : "buff";
  if (M.sp === "selfdestruct" || M.sp === "explosion") return "boom";
  if (target === "aoe_enemies") return M.ct ? "spin" : ["Rock", "Grass", "Normal", "Bug"].includes(M.t) ? "volley" : "nova";
  return M.ct ? "melee" : "shoot";
}
function makeSkill(key, slot) {
  const M = MOVES[key], target = moveTarget(M);
  const sk = { slot, key, name: M.n, type: M.t, cat: M.c, pow: M.p, acc: M.a, cd: CD[slot], cd0: slot === 3 ? 2 : 0, target, M, anim: moveAnim(M, target) };
  if (M.c === "X" && slot === 1) sk.cd = 0;
  if (key === "lowkick") { sk.pow = 60; sk.weight = 1; } // power depends on the target's weight
  if (M.hit) sk.hits = M.hit;
  sk.desc = moveDesc(sk);
  return sk;
}
// ---------- generated move text ----------
const P = v => Math.round(v * 100) + "%";
const statList = st => st.map(([s, n]) => `${STAGE_N[s]} ${n > 0 ? "+" : ""}${n}`).join(", ");
function moveDesc(sk) {
  const M = sk.M, out = [], who = sk.target === "aoe_enemies" ? "each target" : "the target";
  const fixed = { dragonrage: "Always deals 40 damage", sonicboom: "Always deals 20 damage", nightshade: "Deals damage equal to the user's level", seismictoss: "Deals damage equal to the user's level",
    psywave: "Deals random damage between half and 1.5× the user's level", superfang: "Cuts the target's HP in half" }[M.sp];
  if (fixed) out.push(fixed);
  if (sk.weight) out.push("Heavier targets take more damage (20 to 120 power)");
  if (M.n === "High Jump Kick" || M.n === "Jump Kick") out.push("If it misses, the user crashes and loses half its max HP");
  if (sk.target === "aoe_enemies" && M.p) out.push(`Hits every opposing Pokémon (${P(SPREAD)} damage each)`);
  if (M.hit) out.push(M.hit[0] === M.hit[1] ? `Strikes ${M.hit[0]} times` : `Strikes ${M.hit[0]} to ${M.hit[1]} times`);
  if (M.pri > 0) out.push("Priority move: the user gets 30% turn meter back afterwards");
  if (M.cr) out.push("High critical-hit ratio");
  if (M.ail && M.c !== "X") out.push(`${M.ac}% chance to ${{ PAR: "paralyze", BRN: "burn", FRZ: "freeze", PSN: "poison", TOX: "badly poison", SLP: "put to sleep", CNF: "confuse", TRAP: "bind", INFAT: "infatuate" }[M.ail]} ${who}`);
  if (M.ail && M.c === "X") out.push({ PAR: "Paralyzes", BRN: "Burns", FRZ: "Freezes", PSN: "Poisons", TOX: "Badly poisons", SLP: "Puts to sleep", CNF: "Confuses", INFAT: "Infatuates", DISABLE: "Disables (no S2 or S3 for 2 turns)", SEED: "Plants a Leech Seed on", TRAP: "Binds" }[M.ail] + (sk.target === "aoe_enemies" ? " every opposing Pokémon" : " the target") + (M.ac < 100 && M.ac ? ` (${M.ac}%)` : ""));
  if (M.fl) out.push(`${M.fl}% chance to make ${who} flinch (lose 40% turn meter)`);
  if (M.st) {
    const t = M.sw === "self" ? (sk.target === "team" ? "your team's" : "the user's") : M.sw === "foes" ? "every opposing Pokémon's" : "the target's";
    out.push(`${M.sc < 100 ? M.sc + "% chance: " : ""}${t} ${statList(M.st)}`);
  }
  if (M.dr > 0) out.push(`The user recovers ${M.dr}% of the damage dealt`);
  if (M.dr < 0) out.push(`The user takes ${-M.dr}% of the damage dealt as recoil`);
  if (M.hl) out.push(`Restores ${M.hl}% of the user's max HP`);
  const sp = { transform: "Transforms into the target: copies its types, stats, stat changes and moves", metronome: "Uses a random damaging move",
    splash: "But nothing happens!", haze: "Resets the stat changes of every Pokémon in battle", rest: "Fully restores HP and cures status, then sleeps for 2 turns",
    reflect: "Reflect: your team takes a third less physical damage for 5 turns", lightscreen: "Light Screen: your team takes a third less special damage for 5 turns",
    substitute: "Uses 1/4 of the user's max HP to make a Substitute that takes hits for it", mist: "Mist: your team's stats can't be lowered for 5 turns",
    focusenergy: "Focus Energy: the user's critical-hit ratio rises sharply", dreameater: "Only works on a sleeping target; the user recovers half the damage dealt",
    payday: "Coins scatter: extra Poké Dollars after a win", hyperbeam: "The user must recharge and loses its next turn",
    explosion: "The user faints", selfdestruct: "The user faints", roar: "Scares the target off: its turn meter and stat changes reset",
    whirlwind: "Blows the target away: its turn meter and stat changes reset", fissure: "One-hit KO if it lands (30%). Fails against bosses",
    horndrill: "One-hit KO if it lands (30%). Fails against bosses", guillotine: "One-hit KO if it lands (30%). Fails against bosses", toxic: "",
    recover: "", softboiled: "", leechseed: "", disable: "" }[M.sp];
  if (sp) out.push(sp);
  if (!out.length && M.c !== "X") out.push("A plain attack");
  return out.map(x => x.charAt(0).toUpperCase() + x.slice(1)).join(". ") + ".";
}

const L = (s, t) => ({ s, t });
// "pidgey:4" → { op: "pidgey", LV: 4 }; "+" marks a Gym Leader's Pokémon, "!" the ace (a boss)
const W = (...list) => list.map(x => {
  const [op, rest = ""] = x.split(":"), LV = parseInt(rest, 10) || 0;
  return { op, LV, ...(rest.endsWith("!") ? { boss: 1, hpX: 1.8 } : rest.endsWith("+") ? { hpX: 1.15 } : {}) };
});
const TR = (name, spr, intro, lose, ball = "poke") => ({ name, spr, intro, lose, ball });

          L("blue", "Then I'll take this one! Hey, why don't we have a battle? Our Pokémon are raring to go!"),
        ] },
        { id: "b", type: "battle", name: "Rival in the Lab", lv: 5, env: "lab", trainer: TR("Blue", "blue", "I'll make my Pokémon fight! Smell ya later? Not yet!", "What? Unbelievable! I picked the wrong Pokémon!"),
          rivalWaves: () => [[{ op: rivalMon(0), LV: 4, moves: { charmander: ["scratch", "growl"], squirtle: ["tackle", "tailwhip"], bulbasaur: ["tackle", "growl"] }[rivalMon(0)] }]], pre: [
          L("oak", "A battle between friends! Remember: Fire beats Grass, Grass beats Water, and Water beats Fire. Tap your opponent to aim, then choose a move."),
        ], post: [
          L("blue", "Okay! I'll make my Pokémon battle to toughen it up! Gramps, see ya!"),
          L("oak", "Well done. The bond between Trainer and Pokémon grows with every battle."),
        ] },
        { id: "c", type: "battle", name: "Route 1", lv: 3, env: "route", wild: 1, catch: "pidgey", waves: [W("pidgey:3", "rattata:3")], pre: [
          L("narr", "Tall grass rustles on Route 1. Wild Pokémon live here; Trainers who walk the grass meet them."),
          L("oak", "Weaken a wild Pokémon and you can catch it. Take these Poké Balls!"),
        ], post: [L("narr", "Gotcha! The wild Pidgey was caught!")] },
        { id: "d", type: "chest", name: "Oak's Parcel", reward: { lmd: 1500, rec1: 6, permit: 3 }, pre: [
          L("oak", "You brought my Parcel from the Viridian Poké Mart? Thank you! Ah, my custom Poké Balls."),
          L("oak", "Here is a Pokédex. It records every Pokémon you see and catch. Completing it is my dream! And take a few Safari Balls; the Safari Zone near Fuchsia City is open to visitors."),
        ] },
        { id: "e", type: "battle", name: "Viridian Forest", lv: 6, env: "forest", trainer: TR("Bug Catcher Rick", "bugcatcher", "Hey! You have Pokémon! Come on! Let's battle 'em!", "No! Caterpie can't cut it!"),
          waves: [W("caterpie:6", "weedle:6"), W("metapod:7", "kakuna:7")], pre: [
          L("bug", "Bug Pokémon evolve quickly! Caterpie becomes Metapod and then Butterfree. Did you know?"),
        ] },
        { id: "f", type: "side", name: "Spark in the Forest", lv: 7, env: "forest", wild: 1, catch: "pikachu", waves: [W("pikachu:7!")], pre: [
          L("narr", "Something yellow darts between the trees, crackling with electricity."),
        ], post: [L("narr", "Gotcha! Pikachu was caught! It eyes its Poké Ball suspiciously, but stays by your side.")] },
        { id: "g", type: "battle", name: "Pewter Gym: Camper Liam", lv: 10, env: "gym", trainer: TR("Camper Liam", "camper", "Stop right there! You're light-years from facing Brock!", "Darn! Light-years isn't time... it measures distance!"),
          waves: [W("geodude:10", "sandshrew:11")], pre: [] },
        { id: "h", type: "boss", name: "Brock, the Rock-Solid Leader", lv: 13, env: "gym", badgeWin: 0,
          trainer: TR("Leader Brock", "brock", "I believe in rock-hard defense and determination. Show me your best!", "I took you for granted. As proof of your victory, here's the Boulder Badge!"),
          waves: [W("geodude:12+", "onix:14!")], pre: [
          L("brock", "So, you're here. I'm Brock, Pewter's Gym Leader. My rock-hard willpower is evident even in my Pokémon."),
          L("brock", "Rock-type Pokémon shrug off Normal and Flying moves. Water and Grass, though... we'll see what you brought."),
        ], post: [
          L("brock", "The Boulder Badge raises the Attack of your Pokémon. And with one Badge, they'll grow stronger for you: up to Lv 22."),
          L("narr", "The Boulder Badge glints in your Trainer Case. Seven more to go."),
        ] },
      ] },
    { id: "c2", title: "Mt. Moon to Cerulean City", env: "cave", map: "cave", badge: 1, reward: { lmd: 4000, orundum: 300, moonstone: 1 },
      nodes: [
        { id: "a", type: "story", name: "Into Mt. Moon", pre: [
          L("narr", "Mt. Moon. Meteorites fell here long ago, and the cave is said to be home to rare Pokémon."),
          L("hiker", "Watch your step! Zubat swarm in the dark, and the Geodude look just like rocks."),
          L("narr", "Deeper in, men in black uniforms marked with a red R are digging through the rock."),
        ] },
        { id: "b", type: "battle", name: "Mt. Moon B1F", lv: 9, env: "cave", wild: 1, catch: "zubat", waves: [W("zubat:9", "geodude:9", "paras:10")] },
        { id: "c", type: "battle", name: "Team Rocket in the Cave", lv: 12, env: "cave", trainer: TR("Team Rocket Grunt", "teamrocketgruntm", "We're pulling a big job here! Get lost, kid!", "Darn it all! I'm telling the boss!"),
          waves: [W("rattata:12", "zubat:12"), W("ekans:13", "sandshrew:12")], pre: [
          L("grunt", "Team Rocket will find the fossils revived from Mt. Moon's meteorites! They're worth a fortune!"),
        ] },
        { id: "d", type: "side", name: "Clefairy Under the Moon", lv: 12, env: "cave", wild: 1, catch: "clefairy", waves: [W("clefairy:11", "clefairy:12!")], pre: [
          L("narr", "In a hidden chamber, a ring of Clefairy dances around a glowing stone. They notice you."),
        ], post: [L("narr", "Gotcha! A Clefairy was caught! The others scatter, leaving a Moon Stone behind.")] },
        { id: "e", type: "battle", name: "Super Nerd Miguel", lv: 12, env: "cave", trainer: TR("Super Nerd Miguel", "supernerd", "Hey, stop! I found these fossils! They're both mine!", "Okay! I'll share! Take one!"),
          waves: [W("grimer:12", "voltorb:12", "koffing:12")] },
        { id: "f", type: "battle", name: "Nugget Bridge", lv: 17, env: "route", trainer: TR("Blue", "blue", "Yo! You're still struggling along back here?", "Hey! Take it easy! You won already!"),
          rivalWaves: () => [W("pidgeotto:17", "abra:16"), W("rattata:15", rivalMon(0) + ":18")], pre: [
          L("blue", "I caught a whole bunch of Pokémon on the way here. Let me show you how strong they are!"),
        ], post: [L("blue", "Hmph! At least you're raising your Pokémon. I'm off to see Bill. Smell ya later!")] },
        { id: "g", type: "battle", name: "Cerulean Gym: Swimmer Luis", lv: 16, env: "sea", weather: "rain", trainer: TR("Swimmer Luis", "swimmerm", "Splash! I'm first up! Let's do it!", "That can't be! I lost!"),
          waves: [W("horsea:16", "shellder:16")] },
        { id: "h", type: "boss", name: "Misty, the Tomboyish Mermaid", lv: 20, env: "sea", weather: "rain", badgeWin: 1,
          trainer: TR("Leader Misty", "misty", "My policy is an all-out offensive with Water-type Pokémon!", "Wow! You're too much! All right, you can have the Cascade Badge.", "great"),
          waves: [W("staryu:18+", "starmie:21!")], pre: [
          L("misty", "Hi, you're a new face! What's your policy on Pokémon? Mine is all-out offense with Water types!"),
          L("narr", "It's raining in the Cerulean Gym. Water-type moves are 50% stronger, and Fire-type moves are weaker."),
        ], post: [L("misty", "The Cascade Badge raises your Pokémon's Sp. Def, and they'll follow you up to Lv 26. Now go! I've got training to do.")] },
      ] },
    { id: "c3", title: "Vermilion City", env: "city", map: "city", badge: 2, reward: { lmd: 5000, orundum: 300, thunderstone: 1 },
      nodes: [
        { id: "a", type: "story", name: "The Pokémaniac's Cottage", pre: [
          L("bill", "Hiya! I'm a Pokémon... No, I'm not! Call me Bill! I'm a true Pokémaniac!"),
          L("bill", "I fused myself with a Pokémon by accident. Help me run the Cell Separation System, would you?"),
          L("narr", "With a whir, Bill steps out of the teleporter, human again."),
          L("bill", "Thanks! Here, take this S.S. Anne ticket. The cruise ship is in Vermilion City; there are Trainers aboard from all over."),
        ] },
        { id: "b", type: "battle", name: "Route 6", lv: 15, env: "route", wild: 1, catch: "meowth", waves: [W("oddish:15", "bellsprout:15"), W("meowth:16", "pidgey:15")] },
        { id: "c", type: "battle", name: "S.S. Anne: Gentleman", lv: 18, env: "sea", trainer: TR("Gentleman Brooks", "gentleman", "Competing against the young keeps me youthful.", "Good fight. Ah, I feel young again!"),
          waves: [W("growlithe:18", "ponyta:18")] },
        { id: "d", type: "battle", name: "S.S. Anne: Rival", lv: 19, env: "sea", trainer: TR("Blue", "blue", "Bonjour! Are you surprised to see me here?", "Humph! At least you're raising your Pokémon!"),
          rivalWaves: () => [W("pidgeotto:19", "raticate:16"), W("kadabra:18", rivalMon(1) + ":20")], pre: [
          L("blue", "I got an invitation too. Let me check out your Pokémon! I'll show you what a real Trainer does!"),
        ] },
        { id: "e", type: "side", name: "Diglett's Cave", lv: 19, env: "cave", wild: 1, catch: "diglett", waves: [W("diglett:18", "diglett:18"), W("dugtrio:22!")] },
        { id: "f", type: "battle", name: "Vermilion Gym: Sailor Dwayne", lv: 21, env: "plant", trainer: TR("Sailor Dwayne", "sailor", "This is no place for kids! Prepare to be shocked!", "You're not so bad, kid."),
          waves: [W("pikachu:21", "pikachu:21")] },
        { id: "g", type: "boss", name: "Lt. Surge, the Lightning American", lv: 23, env: "plant", badgeWin: 2,
          trainer: TR("Leader Lt. Surge", "ltsurge", "Hey, kid! Electric Pokémon saved me during the war! They'll zap you, just like my enemies!", "Whoa! You're the real deal, kid! Fine then, take the Thunder Badge!", "great"),
          waves: [W("voltorb:21+", "pikachu:18+", "raichu:24!")], pre: [
          L("surge", "Hey, kid! What do you think you're doing here? Ground types don't feel a thing from my Electric attacks, but do you even have one?"),
        ], post: [L("surge", "The Thunder Badge raises your Pokémon's Defense. And they'll listen to you up to Lv 32!")] },
      ] },
    { id: "c4", title: "Rock Tunnel to Celadon City", env: "city", map: "city", badge: 3, reward: { lmd: 6000, orundum: 400, leafstone: 1 },
      nodes: [
        { id: "a", type: "story", name: "Rock Tunnel", pre: [
          L("narr", "Rock Tunnel is pitch-black. Without Flash, Trainers feel their way along the walls."),
          L("hiker", "Ooh, you sure startled me! You've got Pokémon? Then you know the rules!"),
        ] },
        { id: "b", type: "battle", name: "Rock Tunnel", lv: 21, env: "cave", wild: 1, catch: "machop", waves: [W("geodude:20", "zubat:20"), W("machop:21", "onix:22")] },
        { id: "c", type: "chest", name: "Celadon Mansion", reward: { op: "eevee", lmd: 2000 }, pre: [
          L("narr", "On the top floor of Celadon Mansion, a Poké Ball rests on a table with a note: 'Take good care of me.'"),
          L("narr", "Inside is an Eevee. Its genes are unstable: an evolution stone can turn it into Vaporeon, Jolteon or Flareon."),
        ] },
        { id: "d", type: "battle", name: "Rocket Game Corner", lv: 23, env: "city", trainer: TR("Team Rocket Grunt", "teamrocketgruntm", "I'm guarding this poster! Go away, or else!", "Dang! Our hideout might be discovered!"),
          waves: [W("raticate:22", "zubat:22"), W("koffing:23", "grimer:23")], pre: [
          L("grunt", "There's no hideout behind this poster. Definitely not. Now beat it!"),
        ] },
        { id: "e", type: "boss", name: "Giovanni's Hideout", lv: 26, env: "plant", trainer: TR("Giovanni", "giovanni", "So! I must say, I am impressed you got here!", "WHAT! This can't be!"),
          waves: [W("onix:25+", "rhyhorn:24+", "kangaskhan:29!")], pre: [
          L("giovanni", "Team Rocket captures Pokémon from around the world. They're important tools for keeping our criminal enterprise going."),
          L("giovanni", "I will not tolerate you meddling in my plans. You shall now experience pain!"),
        ], post: [L("giovanni", "I see that you raise Pokémon with utmost care. I shall return to my training. Keep the Silph Scope."), L("narr", "Giovanni leaves behind the Silph Scope. It can see through the ghosts of Lavender Town.")] },
        { id: "f", type: "battle", name: "Celadon Gym: Lass & Beauty", lv: 24, env: "forest", weather: "sun", trainer: TR("Beauty Tamia", "beauty", "Welcome to the Celadon Gym. Mind the flowers!", "Oh! I'm so sorry for my rudeness!"),
          waves: [W("bellsprout:23", "oddish:23"), W("exeggcute:24", "weepinbell:24")] },
        { id: "g", type: "boss", name: "Erika, the Nature-Loving Princess", lv: 27, env: "forest", badgeWin: 3,
          trainer: TR("Leader Erika", "erika", "I am Erika, Leader of Celadon Gym. I teach the art of flower arranging. My Pokémon are of the Grass type.", "Oh! I concede defeat. You are remarkably strong. I must confer upon you the Rainbow Badge.", "great"),
          waves: [W("victreebel:29+", "tangela:24+", "vileplume:29!")], pre: [
          L("erika", "Hello. Lovely weather, isn't it? It's so pleasant in my greenhouse. Oh, dear... I must have dozed off."),
          L("narr", "Every Pokémon in Erika's greenhouse knows how to put its opponents to sleep. Grass types shrug off Water, Electric and Ground moves."),
        ], post: [L("erika", "The Rainbow Badge raises your Pokémon's Sp. Atk, and they'll follow you up to Lv 44.")] },
      ] },
    { id: "c5", title: "Lavender Town to Fuchsia City", env: "tower", map: "tower", badge: 4, reward: { lmd: 7000, orundum: 400 },
      nodes: [
        { id: "a", type: "story", name: "The Pokémon Tower", pre: [
          L("narr", "Lavender Town. The Pokémon Tower is a resting place for Pokémon that have passed on."),
          L("fuji", "Team Rocket killed a Marowak trying to protect its child. Its spirit cannot rest. And now they hold me prisoner here..."),
          L("narr", "Through the Silph Scope, the shadowy ghosts on the tower stairs take shape."),
        ] },
        { id: "b", type: "battle", name: "Tower Channelers", lv: 25, env: "tower", trainer: TR("Channeler Hope", "channeler", "Be gone... Intruders...", "Wha? Where am I?"),
          waves: [W("gastly:24", "gastly:24"), W("haunter:26", "cubone:25")], pre: [
          L("narr", "Ghost types shrug off Normal and Fighting moves completely. Psychic and Ghost moves hit them hard."),
        ] },
        { id: "c", type: "boss", name: "The Restless Soul", lv: 30, env: "tower", wild: 1, waves: [W("marowak:30!")], pre: [
          L("narr", "Be gone... Be gone..."),
          L("narr", "The ghost is Cubone's mother, Marowak. Calm its spirit so it can rest."),
        ], post: [L("narr", "The Marowak's spirit is calmed. It fades away peacefully."), L("fuji", "Thank you. Take this Poké Flute; its tune can wake even the deepest sleeper.")] },
        { id: "d", type: "side", name: "Snorlax Blocks the Way", lv: 30, env: "route", wild: 1, catch: "snorlax", waves: [W("snorlax:30!")], pre: [
          L("narr", "A sleeping Pokémon blocks the road. It doesn't budge. You play the Poké Flute..."),
          L("narr", "Snorlax woke up! It attacked in a grumpy rage!"),
        ], post: [L("narr", "Gotcha! Snorlax was caught! It went straight back to sleep in its Poké Ball.")] },
        { id: "e", type: "battle", name: "Cycling Road", lv: 29, env: "route", trainer: TR("Biker Jared", "biker", "We're the toughest bikers on Cycling Road!", "Whoa! You're the real deal!"),
          waves: [W("koffing:28", "grimer:28"), W("weezing:29", "muk:29")] },
        { id: "f", type: "chest", name: "The Safari Zone Warden", reward: { permit: 5, rec2: 4, lmd: 3000 }, pre: [
          L("narr", "The Safari Zone Warden lost his gold teeth somewhere in the park. You find them in the grass."),
          L("narr", "Warden: Thank you! Here, have some Safari Balls on the house. Rare Pokémon live in my park: Chansey, Kangaskhan, Tauros, Scyther and more."),
        ] },
        { id: "g", type: "battle", name: "Fuchsia Gym: Jugglers", lv: 33, env: "gym", trainer: TR("Juggler Nate", "juggler", "Strength isn't the key for Pokémon. It's strategy!", "Hm? Strategy isn't everything?"),
          waves: [W("drowzee:31", "kadabra:31"), W("hypno:33", "drowzee:33")] },
        { id: "h", type: "boss", name: "Koga, the Poisonous Ninja Master", lv: 39, env: "gym", badgeWin: 4,
          trainer: TR("Leader Koga", "koga", "Fwahahaha! A mere child like you dares to challenge me?", "Humph! You have proven your worth! Here, take the Soul Badge.", "ultra"),
          waves: [W("koffing:37+", "muk:39+"), W("koffing:37+", "weezing:43!")], pre: [
          L("koga", "I shall show you true terror as a ninja master! You shall feel the despair of poison and sleep techniques!"),
        ], post: [L("koga", "The Soul Badge raises your Pokémon's Speed, and they'll obey you up to Lv 47.")] },
      ] },
    { id: "c6", title: "Saffron City", env: "city", map: "city", badge: 5, reward: { lmd: 8000, orundum: 500, linkcord: 1 },
      nodes: [
        { id: "a", type: "story", name: "Silph Co. Takeover", pre: [
          L("narr", "Team Rocket has taken over Silph Co., the company that makes Poké Balls. They want its newest invention: the Master Ball."),
          L("sci", "Please, help us! They've locked down every floor!"),
        ] },
        { id: "b", type: "battle", name: "Silph Co. Labs", lv: 33, env: "plant", trainer: TR("Scientist Ted", "scientist", "Electricity! It's our future!", "My calculations were off!"),
          waves: [W("magnemite:33", "voltorb:33"), W("magneton:35", "electrode:35")] },
        { id: "c", type: "chest", name: "Lapras on 7F", reward: { op: "lapras", lmd: 2000 }, pre: [
          L("sci", "Oh, thank you! Team Rocket was going to take this Pokémon. Please, it should be with someone like you. It's a Lapras."),
        ] },
        { id: "d", type: "battle", name: "Silph Co.: Rival", lv: 37, env: "plant", trainer: TR("Blue", "blue", "What kept you? Let's see what you're made of!", "Hah! I was just testing you."),
          rivalWaves: () => [W("pidgeot:37", "alakazam:35"), W("growlithe:38", rivalMon(1) + ":40")], pre: [
          L("blue", "Hah! I knew you'd show up. I'm going to beat you, then the boss!"),
        ] },
        { id: "e", type: "boss", name: "Giovanni at Silph Co.", lv: 40, env: "plant", trainer: TR("Giovanni", "giovanni", "Ah, you again. It seems you have the gift. Too bad it will be wasted.", "Arrgh! I lost again!?"),
          waves: [W("nidorino:37+", "kangaskhan:35+"), W("rhyhorn:37+", "nidoqueen:41!")], pre: [
          L("giovanni", "The president of Silph and I are discussing a business proposal. A child has no place here."),
        ], post: [L("giovanni", "Blast it all! You ruined our plans for Silph! But Team Rocket will never fall!"), L("sci", "You saved us! Please, take this Master Ball prototype... oh, it seems Team Rocket broke it. Here's a Linking Cord instead.")] },
        { id: "f", type: "side", name: "The Fighting Dojo", lv: 36, env: "gym", gift: "hitmonlee", trainer: TR("Karate Master Koichi", "blackbelt", "Hwaah! You're the one who wants to take on our dojo?", "Hwa! Arrgh! Beaten! As a reward, take one of our prized fighters."),
          waves: [W("mankey:32", "machop:32"), W("primeape:34", "machoke:36!")], post: [L("narr", "The Karate Master gives you Hitmonlee, the Kicking Pokémon.")] },
        { id: "g", type: "battle", name: "Saffron Gym: Psychics", lv: 36, env: "tower", trainer: TR("Psychic Johan", "psychic", "You know that power too!", "I knew it would end like this!"),
          waves: [W("slowpoke:34", "kadabra:34"), W("slowbro:37", "mrmime:36")] },
        { id: "h", type: "boss", name: "Sabrina, the Master of Psychic Pokémon", lv: 40, env: "tower", badgeWin: 5,
          trainer: TR("Leader Sabrina", "sabrina", "I had a vision of your arrival! I have had psychic powers since I was a child.", "This loss shocks me! But a loss is a loss. Take the Marsh Badge.", "ultra"),
          waves: [W("kadabra:38+", "mrmime:37+"), W("venomoth:38+", "alakazam:43!")], pre: [
          L("sabrina", "I dislike fighting, but if you wish, I will show you my powers!"),
          L("narr", "Psychic types are only weak to Bug and Ghost moves. Dark types don't exist in Kanto yet."),
        ], post: [L("sabrina", "The Marsh Badge makes your Pokémon's Sp. Atk even stronger, and they'll obey up to Lv 52.")] },
      ] },
    { id: "c7", title: "Cinnabar Island", env: "sea", map: "sea", badge: 6, reward: { op: "aerodactyl", lmd: 9000, orundum: 500, firestone: 1 },
      nodes: [
        { id: "a", type: "story", name: "Seafoam Islands", pre: [
          L("narr", "You surf south from Fuchsia. The Seafoam Islands are a frozen maze of caves, and something powerful sleeps in their depths."),
        ] },
        { id: "b", type: "battle", name: "Seafoam Caves", lv: 38, env: "ice", weather: "hail", wild: 1, catch: "seel", waves: [W("seel:38", "slowpoke:37"), W("shellder:38", "psyduck:38")], pre: [
          L("narr", "Hail falls inside the caves. Every Pokémon that isn't an Ice type loses a little HP each turn."),
        ] },
        { id: "c", type: "side", name: "Articuno", lv: 50, env: "ice", weather: "hail", wild: 1, catch: "articuno", waves: [W("articuno:50!")], pre: [
          L("narr", "A bird of legend spreads wings of ice. The air freezes around Articuno."),
        ], post: [L("narr", "Gotcha! Articuno was caught!")] },
        { id: "d", type: "battle", name: "Pokémon Mansion", lv: 39, env: "volcano", wild: 1, catch: "growlithe", waves: [W("growlithe:37", "ponyta:38", "koffing:38"), W("grimer:38", "magmar:40")], pre: [
          L("narr", "A diary in the burnt mansion: 'July 5. We named the newly discovered Pokémon Mew.' ... 'Feb. 6. Mew gave birth. We named the newborn Mewtwo.'"),
        ] },
        { id: "e", type: "chest", name: "The Fossil Lab", reward: { op: "omanyte", lmd: 3000 }, pre: [
          L("sci", "Ah, you have a fossil from Mt. Moon! Leave it with me... There! A Pokémon that lived in ancient seas: Omanyte!"),
          L("sci", "And the Old Amber from Pewter Museum holds the DNA of an ancient flying Pokémon. I'll have that ready when you've earned the Volcano Badge."),
        ] },
        { id: "f", type: "battle", name: "Cinnabar Gym: Super Nerds", lv: 38, env: "volcano", weather: "sun", trainer: TR("Super Nerd Erik", "supernerd", "Do you know how hot Pokémon fire breath can get?", "Yow! Hot, hot, hot!"),
          waves: [W("vulpix:36", "growlithe:36"), W("ninetales:38", "ponyta:40")] },
        { id: "g", type: "boss", name: "Blaine, the Hotheaded Quiz Master", lv: 44, env: "volcano", weather: "sun", badgeWin: 6,
          trainer: TR("Leader Blaine", "blaine", "Hah! I am Blaine! I am the Leader of Cinnabar Gym! My fiery Pokémon will incinerate all challengers!", "I have burned down to nothing! Not even ashes remain! You have earned the Volcano Badge!", "ultra"),
          waves: [W("growlithe:42+", "ponyta:40+"), W("rapidash:42+", "arcanine:47!")], pre: [
          L("blaine", "Hah! You better have Burn Heal! The sun burns hot in my Gym: Water moves are weaker here."),
        ], post: [L("blaine", "The Volcano Badge heightens the Attack of your Pokémon, and they'll obey you up to Lv 56."), L("sci", "And here is your Aerodactyl, revived from the Old Amber!")] },
      ] },
    { id: "c8", title: "Viridian City", env: "route", map: "route", badge: 7, reward: { lmd: 10000, orundum: 600 },
      nodes: [
        { id: "a", type: "story", name: "The Last Gym", pre: [

// =====================================================================
//  SPRITES — Pokémon Showdown's Black/White sprites (front and back) and FireRed/LeafGreen trainer sprites,
//  embedded by build.sh as base64 (SPR_DATA). Battle units are drawn as billboards: the back sprite when the
//  camera looks over their shoulder, the front sprite when it faces them, always turned towards the opponents.
// =====================================================================
const SPR = { img: {}, box: {}, icon: {}, ready: false, loaded: 0, total: 0 };
const sprSrc = (set, k) => SPR_DATA[set][k] ? "data:image/png;base64," + SPR_DATA[set][k] : "";
const sprFront = k => SPR.icon[k] || sprSrc("f", k);
const sprFull = k => sprSrc("f", k);
const trainerURL = k => sprSrc("t", k);
const PX = 2.1; // world units per sprite pixel
function sprImg(set, k) { return SPR.img[set + ":" + k]; }
// trim box of a sprite (the opaque pixels), measured once when it loads
function measure(im) {
  const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext("2d"); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = c.width - 1; y1 = c.height - 1; }
  return { x0, y0, x1, y1, w: c.width, h: c.height, c };
}
// square menu icon cropped to the Pokémon (so small Pokémon don't vanish in big empty frames)
function makeIcon(k, box) {
  const s = Math.max(box.x1 - box.x0 + 1, box.y1 - box.y0 + 1) + 4, c = document.createElement("canvas");
  c.width = s; c.height = s;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  g.drawImage(box.c, box.x0, box.y0, box.x1 - box.x0 + 1, box.y1 - box.y0 + 1, Math.round((s - (box.x1 - box.x0 + 1)) / 2), s - 2 - (box.y1 - box.y0 + 1), box.x1 - box.x0 + 1, box.y1 - box.y0 + 1);
  try { SPR.icon[k] = c.toDataURL(); } catch (e) { /* keep the full sprite */ }
}
function preloadSprites(onProgress) {
  const jobs = [];
  for (const set of ["f", "b", "t"]) for (const k in SPR_DATA[set]) jobs.push([set, k]);
  SPR.total = jobs.length; SPR.loaded = 0;
  return Promise.all(jobs.map(([set, k]) => new Promise(res => {
    const im = new Image();
    im.onload = () => { const box = measure(im); SPR.box[set + ":" + k] = box; if (set === "f") makeIcon(k, box); delete box.c; SPR.loaded++; onProgress && onProgress(SPR.loaded / SPR.total); res(); };
    im.onerror = () => { SPR.loaded++; res(); };
    im.src = sprSrc(set, k); SPR.img[set + ":" + k] = im;
  }))).then(() => { SPR.ready = true; });
}

// ---------- battle drawing ----------
// pose names follow the battle director: idle · run · swing · shoot · cast · buff · hit · victory
function monMotion(pose, ph) {
  const T = pose.time || 0, k = clamp(pose.t || 0, 0, 1), nm = pose.name || "idle";
  const m = { dx: 0, dy: 0, sx: 1, sy: 1 + Math.sin(T * 2.4 + ph) * .022, rot: 0, alpha: 1, white: 0 };

function fitHome() {

}

// ---------- sound (tiny WebAudio synth) ----------
const SFX = { ctx: null, noise: null };
function sfx(kind) {

    const A = SFX.ctx || (SFX.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (A.state === "suspended") A.resume();

    const osc = (type, f0, f1, dur, vol, at = 0) => {
      const o = A.createOscillator(), g = A.createGain(); o.type = type; o.connect(g); g.connect(A.destination);

      g.gain.setValueAtTime(.0001, t + at); g.gain.exponentialRampToValueAtTime(vol, t + at + .015); g.gain.exponentialRampToValueAtTime(.0001, t + at + dur);
      o.start(t + at); o.stop(t + at + dur + .02);

    const noise = (dur, vol, freq = 1200) => {
      if (!SFX.noise) { const b = A.createBuffer(1, A.sampleRate * .6, A.sampleRate), d = b.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = R() * 2 - 1; SFX.noise = b; }
      const s = A.createBufferSource(), f = A.createBiquadFilter(), g = A.createGain(); s.buffer = SFX.noise; f.type = "lowpass"; f.frequency.value = freq;
      s.connect(f); f.connect(g); g.connect(A.destination);

    };
    if (kind === "blaster") osc("square", 1500 + R() * 300, 160, .17, .05);
    else if (kind === "saber") { noise(.16, .2, 2600); osc("sine", 1100, 320, .14, .02); }
    else if (kind === "bow") { noise(.06, .22, 3200); osc("triangle", 240, 110, .14, .06); }
    else if (kind === "shot") { noise(.11, .38, 3400); osc("square", 190, 55, .09, .06); }
    else if (kind === "arts") { osc("sine", 620, 1500, .18, .045); osc("triangle", 310, 920, .22, .03, .03); }
    else if (kind === "hit") noise(.12, .18, 900);
    else if (kind === "crit") { noise(.2, .28, 1600); osc("square", 300, 90, .2, .05); }
    else if (kind === "boom") { noise(.7, .45, 420); osc("sine", 120, 30, .6, .25); }
    else if (kind === "zap") { for (let k = 0; k < 4; k++) osc("square", 800 + R() * 900, 200 + R() * 300, .07, .03, k * .06); }
    else if (kind === "heal") { [523, 659, 784].forEach((f, k) => osc("sine", f, f * 1.01, .25, .05, k * .07)); }
    else if (kind === "special") { osc("sawtooth", 160, 640, .45, .045); osc("sine", 320, 1280, .45, .04); }
    else if (kind === "win") { [392, 523, 659, 784].forEach((f, k) => osc("triangle", f, f, .32, .07, k * .12)); }
    else if (kind === "lose") { [392, 330, 262].forEach((f, k) => osc("triangle", f, f * .98, .4, .06, k * .18)); }
    else if (kind === "flame") noise(.6, .2, 700);
    else if (kind === "tap") osc("sine", 880, 660, .05, .03);
    else if (kind === "warp") osc("sine", 200, 1400, .4, .04);

}

async function handle(e) {

      if (e.dot) { addParts(chestW(vu), 8, { col: "#c86ad8", speed: 50, vy: 40, life: 600, size: 2.6, g: -30 }); setPose(vu, "hit", 300); await bwait(220); break; }

async function doAttack(e) {

function sceneSVG(env) {
  const th = mapTheme(env), rng = seeded(hash(env + "scene"));
  const day = !["cave", "tower", "plateau", "volcano"].includes(env);
  const sky = { route: ["#4a8ad8", "#8ec4f2", "#dff2ff"], forest: ["#1e4a2a", "#4a8a4a", "#a8d88a"], city: ["#5a9ae0", "#a8d0f2", "#f2f8ff"], sea: ["#3a7ad8", "#7ab8f2", "#d8f0ff"],
    cave: ["#0c0a10", "#2a2430", "#4a3e48"], tower: ["#140a24", "#3a1a52", "#7a4a8a"], plateau: ["#0a0614", "#2a1a4a", "#6a3a8a"], volcano: ["#2a0a06", "#7a2a10", "#e07a3a"],
    ice: ["#3a5a80", "#8ab0d8", "#e8f4ff"], lab: ["#3a4a5a", "#7a90a8", "#d8e2ec"], gym: ["#202838", "#384a68", "#6a7ea0"], plant: ["#1a1e2a", "#3a4258", "#8a92a8"] }[env] || ["#4a8ad8", "#8ec4f2", "#dff2ff"];
  let hills = "";
  for (let k = 0; k < 7; k++) { const x = rng() * 400, r = 80 + rng() * 120; hills += `<ellipse cx="${x}" cy="${620 + rng() * 40}" rx="${r}" ry="${r * .45}" fill="${shade(th.a, -.1 - rng() * .2)}"/>`; }
  let trees = "";
  if (env === "route" || env === "forest") for (let k = 0; k < 14; k++) { const x = rng() * 420 - 10, h = 50 + rng() * 60; trees += `<rect x="${x - 4}" y="${640 - h * .3}" width="8" height="${h * .3}" fill="#5a3a1e"/><circle cx="${x}" cy="${640 - h * .5}" r="${h * .32}" fill="${shade("#3f8a3a", -rng() * .3)}"/>`; }
  let fx = "";
  if (!day) for (let k = 0; k < 40; k++) fx += `<circle cx="${rng() * 400}" cy="${rng() * 420}" r="${rng() * 1.3 + .3}" fill="#fff" opacity="${.2 + rng() * .6}"/>`;
  else for (let k = 0; k < 5; k++) { const x = rng() * 400, y = 80 + rng() * 200; fx += `<ellipse cx="${x}" cy="${y}" rx="${40 + rng() * 40}" ry="${10 + rng() * 8}" fill="#fff" opacity=".55"/>`; }
  return `<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" style="position:absolute;inset:0;width:100%;height:100%">
    <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset=".6" stop-color="${sky[1]}"/><stop offset=".85" stop-color="${sky[2]}"/></linearGradient></defs>
    <rect width="400" height="800" fill="url(#sk)"/>${fx}${hills}${trees}
    <rect y="640" width="400" height="160" fill="${shade(th.a, -.25)}"/><rect y="640" width="400" height="6" fill="${shade(th.a, .15)}" opacity=".6"/></svg>`;
}
function playScene(lines, title, env) {
  return new Promise(resolve => {
    const root = $("#dlg"), th = mapTheme(env);
    root.innerHTML = `<div class="dwrap">
      <div class="dbg" style="background:${th.b}">${sceneSVG(env)}</div>
      <img class="dchar left px" id="dL" alt="" hidden><img class="dchar right px" id="dR" alt="" hidden>
      <div class="dtop"><span class="ttl">${esc(title || "")}</span><div class="row"><button class="tog" id="dAuto">AUTO</button><button class="tog" id="dSkip">SKIP</button></div></div>
      <div class="dbox" id="dBox"><div class="dname" id="dName" hidden></div><div class="dtext" id="dText"></div><div class="dnext" id="dNext" hidden>▼</div></div>
    </div>`;
    root.hidden = false;
    let i = -1, typing = 0, full = "", auto = false, timer = 0, autoT = 0;
    const Lf = $("#dL"), Rr = $("#dR"), side = {};
    const done = () => { clearInterval(timer); clearTimeout(autoT); root.hidden = true; root.innerHTML = ""; resolve(); };
    const showLine = () => {
      i++; if (i >= lines.length) return done();
      const ln = lines[i], sp = SPK[ln.s] || { n: ln.s };
      const nm = $("#dName"), name = ln.s === "me" ? S.name : sp.n; nm.hidden = !name; nm.textContent = name || "";
      $("#dBox").classList.toggle("dnarr", ln.s === "narr");
      const spr = sp.t === "me" ? avatar() : sp.t;
      if (spr) {
        const isRight = ln.s !== "me", img = isRight ? Rr : Lf;
        if (side[isRight ? "R" : "L"] !== ln.s) { img.classList.add("enter"); img.src = trainerURL(spr); img.hidden = false; side[isRight ? "R" : "L"] = ln.s; requestAnimationFrame(() => requestAnimationFrame(() => img.classList.remove("enter"))); }
        Lf.classList.toggle("dim", isRight); Rr.classList.toggle("dim", !isRight);
      } else { Lf.classList.add("dim"); Rr.classList.add("dim"); }
      full = ln.t.replace(/\{name\}/g, S.name); let n = 0; const tx = $("#dText"); tx.textContent = ""; $("#dNext").hidden = true;
      clearInterval(timer);
      typing = 1;
      timer = setInterval(() => { n += 2; tx.textContent = full.slice(0, n); if (n >= full.length) { clearInterval(timer); typing = 0; $("#dNext").hidden = false; if (auto) autoT = setTimeout(showLine, 1100 + full.length * 18); } }, 22);
    };
    root.onclick = ev => {
      if (ev.target.closest("#dSkip")) return done();
      if (ev.target.closest("#dAuto")) { auto = !auto; $("#dAuto").classList.toggle("on", auto); if (auto && !typing) showLine(); return; }
      clearTimeout(autoT);
      if (typing) { clearInterval(timer); typing = 0; $("#dText").textContent = full; $("#dNext").hidden = false; if (auto) autoT = setTimeout(showLine, 1200); }
      else showLine();
    };
    showLine();
  });
}

function gachaReveal(results, master) {
  return new Promise(resolve => {
    const top = Math.max(...results.map(r => OPS[r.key].rar));
    const root = $("#gacha");
    root.innerHTML = `<div class="gwrap"><canvas class="gcv" id="gcv"></canvas><div class="gtitle" id="gT"><div class="eyebrow">Safari Zone</div><h1>${master ? "Go, Master Ball!" : "Throw!"}</h1><p class="small">Tap to skip</p></div><div class="ggrid" id="gG" hidden></div><button class="btn" id="gDone" hidden>Done</button></div>`;
    root.hidden = false;
    const cv = $("#gcv"), g = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
    const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; g.scale(dpr, dpr);
    const kind = master ? "master" : BALL_OF(top), t0 = performance.now();
    let run = true;
    const loop = () => {
      if (!run || !cv.isConnected) return; requestAnimationFrame(loop);
      const t = (performance.now() - t0) / 1000;
      const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#f2c87a"); sky.addColorStop(.6, "#c8b05a"); sky.addColorStop(1, "#6a8a3a");
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      for (let k = 0; k < 18; k++) { const x = (k * 97 % W), y = H * .62 + (k % 3) * 12; g.fillStyle = "#4a7a2a"; g.beginPath(); g.moveTo(x - 14, y + 30); g.lineTo(x, y + Math.sin(t * 3 + k) * 3); g.lineTo(x + 14, y + 30); g.fill(); }
      const k = Math.min(1, t / .7), bx = lerp(-30, W / 2, k), by = H * .66 - Math.sin(k * Math.PI) * H * .3;
      const wob = t > .8 && t < 2.3 ? Math.sin((t - .8) * 9) * .5 * (1 - (t - .8) / 1.6) : 0;
      if (t < 2.4) drawBall(g, bx, t > .7 ? H * .66 : by, 26, kind, t < .7 ? t * 16 : wob, 0);
      else { const f = Math.min(1, (t - 2.4) * 4); g.globalAlpha = 1 - f; drawBall(g, W / 2, H * .66, 26 + f * 30, kind, 0, f); g.globalAlpha = 1; g.fillStyle = `rgba(255,255,255,${1 - f})`; g.fillRect(0, 0, W, H); }
