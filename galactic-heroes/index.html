<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Galactic Heroes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Resource bar on top, a scrolling holotable view in the middle,
   a five-tab nav at the bottom; battles open as a full-screen overlay. Single dark "deep space" look. */
:root{
  --space:#05080f; --hull:#0b1220; --hull2:#111a2d; --hull3:#18233d; --line:#223150; --line2:#34476f;
  --text:#e8edf7; --dim:#8f9bb6; --faint:#5b6886;
  --gold:#f2c14e; --gold2:#b8862a; --gold-ink:#1b1305; --holo:#5fd4ff;
  --ls:#4aa3ff; --ls-deep:#0f2a52; --ds:#ff4b4b; --ds-deep:#4a0d16;
  --hp:#3ddc84; --prot:#d7deec; --tm:#5fd4ff;
  --buff:#43d67e; --debuff:#ff5c5c; --crit:#ffd34d; --heal:#5dfc9b;
  --g1:#a3adc2; --g2:#4fd17f; --g3:#3fa7ff; --g4:#b26bff; --g5:#f2c14e;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow Semi Condensed","Segoe UI",Roboto,Arial,sans-serif;
  --cut:10px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box;background:var(--space)}
body{height:100%;margin:0;background:var(--space);color:var(--text);font:15px/1.35 var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}

/* ---------- app shell ---------- */
#app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;position:relative;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 72% 9%,#fff6 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 42%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 33% 63%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 85%,#fff6 50%,transparent 51%),
    radial-gradient(120% 60% at 50% -10%,#16264a 0%,transparent 60%),
    var(--space)}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:linear-gradient(180deg,#0d1730,#0a1222);border-bottom:1px solid var(--line)}
.me{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.me-badge{width:34px;height:34px;flex:none;display:grid;place-items:center;font:800 15px var(--f-display);color:var(--gold-ink);
  background:linear-gradient(135deg,var(--gold),var(--gold2));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.me-name{font:700 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-xp{height:3px;background:var(--hull3);margin-top:3px;width:80px;max-width:100%}
.me-xp i{display:block;height:100%;background:var(--holo)}
.res{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;background:var(--hull2);border:1px solid var(--line);border-radius:999px;
  font:700 13px var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px;flex:none}
.pill small{font:500 10px var(--f-body);color:var(--dim)}
#view{overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#080e1b;border-top:1px solid var(--line)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--faint);
  font:700 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;position:relative}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--gold)}
#tabs button.on::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dot{position:absolute;top:5px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--ds);box-shadow:0 0 6px var(--ds)}

/* ---------- type ---------- */
h1,h2,h3{margin:0;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;text-wrap:balance;line-height:1.05}
h1{font-size:30px;font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:15px;font-weight:700}
.eyebrow{font:700 11px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--holo)}
.dim{color:var(--dim)} .small{font-size:12.5px} .tiny{font-size:11px}
.ls{color:var(--ls)} .ds{color:var(--ds)} .gold{color:var(--gold)}
p{margin:0}

/* ---------- surfaces ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel{background:var(--hull);border:1px solid var(--line);padding:12px;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.sub{background:var(--hull2);border:1px solid var(--line);border-radius:6px;padding:10px}
.divider{height:1px;background:var(--line);margin:2px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border:1px solid var(--line2);border-radius:999px;font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--hull)}
.chip.on{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.chip:disabled{opacity:.35}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font:700 10.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--hull3);color:var(--dim)}
.tag.ls{background:color-mix(in srgb,var(--ls) 18%,transparent);color:var(--ls)}
.tag.ds{background:color-mix(in srgb,var(--ds) 18%,transparent);color:var(--ds)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;
  font:800 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);
  background:linear-gradient(180deg,#ffd877,var(--gold) 45%,var(--gold2));
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:filter .12s,transform .08s}
.btn:active{transform:translateY(1px);filter:brightness(.92)}
.btn.blue{color:#04121f;background:linear-gradient(180deg,#9be6ff,var(--holo) 45%,#2a8fbf)}
.btn.ghost{color:var(--text);background:var(--hull3);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.red{color:#fff;background:linear-gradient(180deg,#ff7b7b,var(--ds) 50%,#a51e2a)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{filter:grayscale(1) brightness(.55);pointer-events:none}
.cost{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.cost svg{width:14px;height:14px}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;padding:18px 16px 16px;min-height:150px;
  background:radial-gradient(90% 120% at 100% 0%,#1d3c78 0%,transparent 60%),radial-gradient(70% 90% at 0% 100%,#4a1020 0%,transparent 60%),var(--hull)}
.hero h1{font-size:38px;line-height:.9;letter-spacing:.04em}
.hero h1 span{display:block;color:var(--gold);font-size:22px;letter-spacing:.32em}
.gp{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.gp b{font:800 26px var(--f-display);color:var(--holo);font-variant-numeric:tabular-nums}
.hero-art{position:absolute;right:-30px;bottom:-8px;width:230px;max-width:62%;opacity:.95;pointer-events:none}
.hero > *{position:relative}
.hero .hero-art{position:absolute}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:96px;padding:12px;
  background:var(--hull2);border:1px solid var(--line);overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.tile h3{font-size:17px}
.tile .tsub{font-size:12px;color:var(--dim)}
.tile .ticon{position:absolute;right:8px;top:8px;width:40px;height:40px;opacity:.85}
.tile .ticon svg{width:100%;height:100%}
.tile:disabled{opacity:.45}
.tile{color:var(--text)}
.tile.ls-t{background:linear-gradient(140deg,var(--ls-deep),var(--hull2) 70%)}
.tile.ds-t{background:linear-gradient(140deg,var(--ds-deep),var(--hull2) 70%)}
.tile.wide{grid-column:1/-1;min-height:74px}
.tile .badge{position:absolute;left:12px;top:10px}
.hint{color:var(--text);text-align:left;display:flex;gap:10px;align-items:center;padding:10px 12px;border-left:3px solid var(--holo);background:linear-gradient(90deg,#0f2840,transparent)}

/* ---------- portraits ---------- */
.pt{position:relative;width:var(--s,72px);flex:none;text-align:center}
.pt .ring{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;padding:3px;background:var(--gc,var(--g1));
  box-shadow:0 0 0 1px #0008,0 0 12px color-mix(in srgb,var(--gc,var(--g1)) 35%,transparent)}
.pt .ring img{display:block;width:100%;height:100%;border-radius:50%;pointer-events:none}
.pt .lv{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);min-width:22px;padding:0 4px;height:18px;border-radius:9px;
  background:#0a0f1c;border:1px solid var(--gc,var(--g1));font:800 11px/16px var(--f-display);color:var(--text)}
.stars{display:flex;justify-content:center;gap:0;height:11px;margin-bottom:2px}
.stars svg{width:11px;height:11px}
.pt.locked .ring{filter:grayscale(1) brightness(.45)}
.pt .zeta{position:absolute;right:-2px;top:12px}
.pname{margin-top:9px;font:700 12px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;text-align:center;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.2em}
.shardbar{height:6px;margin-top:5px;background:var(--hull3);border-radius:3px;overflow:hidden}
.shardbar i{display:block;height:100%;background:linear-gradient(90deg,var(--holo),#a7ecff)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 10px}
.rcell{display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;border-radius:8px}
.rcell .pt{--s:72px}
.rcell .pw{font:600 11px var(--f-body);color:var(--dim);font-variant-numeric:tabular-nums}
.rcell.ready{background:radial-gradient(60% 50% at 50% 35%,#5fd4ff33,transparent)}
.rcell.sel{background:var(--hull3);box-shadow:inset 0 0 0 2px var(--gold)}
.rcell.dis{opacity:.35}

/* ---------- character sheet ---------- */
.sheet-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.sheet-top .pt{--s:112px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.statgrid div{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.statgrid b{font-variant-numeric:tabular-nums}
.ab{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.abicon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;font:800 13px var(--f-display);color:var(--text);
  background:radial-gradient(circle at 35% 30%,var(--hull3),#060a14);border:2px solid var(--line2)}
.abicon.special{border-color:var(--holo)} .abicon.unique{border-color:var(--g4)} .abicon.leader{border-color:var(--gold)}
.abicon svg{width:24px;height:24px}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:5px;background:var(--hull3);border-radius:1px}
.pips i.on{background:var(--holo)}
.pips i.on.om{background:var(--gold)}
.bar{height:8px;background:var(--hull3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--holo),#b3f0ff)}
.gear-name{font:800 18px var(--f-display);letter-spacing:.06em}

/* ---------- campaign ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{padding:10px 6px;font:800 14px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--hull)}
.seg button.on.lsb{background:linear-gradient(180deg,#2765b6,#173d73);color:#fff}
.seg button.on.dsb{background:linear-gradient(180deg,#b3262f,#5e0f17);color:#fff}
.chap-head{padding:14px;position:relative;overflow:hidden}
.chap-head .cnum{position:absolute;right:10px;top:-6px;font:800 76px var(--f-display);opacity:.12;line-height:1}
.nodes{display:flex;flex-direction:column;gap:10px;position:relative}
.nodes::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:2px;background:repeating-linear-gradient(180deg,var(--line2) 0 6px,transparent 6px 10px)}
.node{position:relative;display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px 8px 0;
  background:var(--hull);border:1px solid var(--line);border-radius:8px}
.node.locked{opacity:.4}
.node .nid{position:relative;z-index:1;justify-self:center;width:40px;height:40px;display:grid;place-items:center;font:800 15px var(--f-display);
  background:var(--hull3);border:2px solid var(--line2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.node.boss .nid{background:linear-gradient(135deg,var(--ds),#6c0f19);border:0;color:#fff}
.node.next .nid{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink)}
.node .ntitle{font:700 14px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.minis{display:flex;gap:3px;margin-top:4px}
.minis .pt{--s:26px}
.minis .pt .ring{padding:1.5px}
.nstars{display:flex;gap:1px}
.nstars svg{width:14px;height:14px}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:#02040acc;backdrop-filter:blur(3px);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#modal .mbox{width:100%;max-width:520px;max-height:calc(100% - 40px);overflow:auto;background:var(--hull);border:1px solid var(--line2);padding:16px;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;
  align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{padding:9px 14px;background:#0d1a30f0;border:1px solid var(--holo);color:var(--text);font:600 14px var(--f-body);border-radius:6px;
  box-shadow:0 8px 24px #000a;animation:tin .25s ease-out}
.toast.gold{border-color:var(--gold)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.rewards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rw{display:flex;flex-direction:column;align-items:center;gap:3px;width:70px;font:700 12px var(--f-display);text-align:center}
.rw .ri{width:54px;height:54px;display:grid;place-items:center;border-radius:10px;background:var(--hull2);border:1px solid var(--line2)}
.rw .ri svg{width:30px;height:30px}
.ri{display:grid;place-items:center;border-radius:10px;background:var(--hull2);border:1px solid var(--line2)}
.ri svg{width:70%;height:70%}
.rw .pt{--s:54px}

/* ---------- squad select ---------- */
.squad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 8px 12px;background:var(--hull2);border:1px solid var(--line);border-radius:8px}
.slot{display:flex;flex-direction:column;align-items:center;position:relative}
.slot .pt{--s:min(58px,15vw)}
.slot .empty{width:min(58px,15vw);aspect-ratio:1;border-radius:50%;border:2px dashed var(--line2);margin-top:13px}
.slot .crown{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:20px;height:14px;z-index:2}
.leadtxt{padding:10px 12px;border-left:3px solid var(--gold);background:linear-gradient(90deg,#2b2108,transparent)}

/* ---------- battle (canvas scene + DOM HUD) ---------- */
#battle{position:fixed;inset:0;z-index:40;background:#000;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bwrap{position:relative;width:100%;height:100%;overflow:hidden;touch-action:manipulation}
#bcv{position:absolute;inset:0;display:block;touch-action:none}
.btop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:8px 12px;background:linear-gradient(180deg,#000a,transparent);pointer-events:none}
.btop > *{pointer-events:auto}
.bt-title{flex:1;min-width:0;line-height:1.05;text-shadow:0 1px 3px #000}
.bt-title small{display:block;font:600 10.5px var(--f-body);color:#c9d3e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-title b{font:800 15px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.tog{min-width:44px;height:34px;padding:0 10px;border:1px solid #ffffff40;border-radius:6px;background:#0b1220cc;font:800 13px var(--f-display);letter-spacing:.06em;color:var(--text)}
.tog.on{background:var(--holo);color:#03131f;border-color:var(--holo)}
.bban{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
.bban.show{opacity:1;transform:none}
.bban small{display:block;font:700 12px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:#d8e2f2;text-shadow:0 1px 4px #000}
.bban b{display:inline-block;margin-top:2px;padding:2px 26px;font:800 clamp(24px,7vw,40px)/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  background:linear-gradient(90deg,transparent,#000b 18%,#000b 82%,transparent);text-shadow:0 0 18px #f2c14e88}
.bban.ls b{color:#bfe0ff;text-shadow:0 0 18px #4aa3ffaa} .bban.ds b{color:#ffc2c2;text-shadow:0 0 18px #ff4b4baa}
.bctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px 14px 14px;
  background:linear-gradient(0deg,#000d 30%,transparent);min-height:96px;pointer-events:none}
.bctl > *{pointer-events:auto}
.bwho{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.bpt{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);flex:none;box-shadow:0 0 14px #f2c14e66}
.bwn{min-width:0}
.bwn b{display:block;font:800 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bwn small{display:block;font-size:11px;color:#b9c4d8}
.babs{display:flex;gap:12px;padding-bottom:12px}
.abtn{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,#2b3d63,#070c18);border:2px solid #9aa4b8;box-shadow:0 4px 14px #000a;transition:transform .1s}
.abtn.special{border-color:var(--holo);box-shadow:0 0 14px #5fd4ff55,0 4px 14px #000a}
.abtn:active{transform:scale(.93)}
.abtn.off{filter:grayscale(.7)}
.abtn svg{width:30px;height:30px}
.abtn .cdv{position:absolute;inset:0;border-radius:50%;background:#000b;display:grid;place-items:center;font:800 24px var(--f-display);color:#fff}
.abtn .alabel{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font:700 9.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:#c9d3e6;white-space:nowrap}
.bwait{font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#c9d3e6}
.bpop{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:#000a}
.bpopbox{width:100%;max-width:400px;max-height:90%;overflow:auto;background:var(--hull);border:1px solid var(--line2);padding:16px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));animation:rise .2s ease-out}
.bpopbox .bpt{width:46px;height:46px}
.result{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;
  background:radial-gradient(70% 50% at 50% 40%,#0d1a33e6,#000000f0);animation:rise .3s ease-out;text-align:center;overflow:auto}
.result h1{font-size:50px;letter-spacing:.12em}
.bigstars{display:flex;gap:6px}
.bigstars span{width:48px;height:48px;display:block}
.bigstars svg{width:100%;height:100%}
.bigstars span.on{animation:pop .4s backwards}
.bigstars span:nth-child(2){animation-delay:.15s}.bigstars span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;transition-duration:.01s!important}
}
@media (min-width:600px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }

const SLOTS = [[150, 0], [228, -105], [228, 105], [315, -52], [315, 58]];
const BT = { on: false, cv: null, g: null, W: 0, H: 0, dpr: 1, clock: 0, speed: 1, paused: false, vus: new Map(),

  cam: null, camT: null, camK: 3, home: null, shake: 0, env: null, B: null, target: null, active: null, picking: false,
  raf: 0, last: 0, orbit: false, shx: 0, shy: 0, K: null, flash: 0, flashCol: "#fff", letterbox: 0, letterboxT: 0 };

const v3 = {
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],

}
function proj(K, x, y, z) {

function drawSky(K) {

    }

  if (BT.picking && BT.B) for (const u of BT.B.targetable(BT.B.waiting || BT.B.units[0])) { const vu = BT.vus.get(u.uid); if (vu && vu !== BT.target) groundEllipse(K, vu.pos.x, vu.pos.z, 30 * vu.bs, "rgba(255,90,90,.45)", false, 1.5); }
  if (BT.target && !BT.target.dead && BT.picking) groundEllipse(K, BT.target.pos.x, BT.target.pos.z, 36 * BT.target.bs, "#ff4b4b", false, 3, BT.clock / 300, [10, 6]);
  drawRings(K);

  drawFloats(K);
  g.restore();
  if (BT.flash > 0) { g.fillStyle = BT.flashCol; g.globalAlpha = BT.flash; g.fillRect(0, 0, W, H); g.globalAlpha = 1; BT.flash = Math.max(0, BT.flash - dt / 260); }

}
function weather(K) {

  g.fillStyle = BT.env.snow ? "rgba(255,255,255,.75)" : "rgba(255,140,60,.8)";
  for (let k = 0; k < n; k++) {

// ---------- timing helpers (battle clock, honours pause + speed) ----------
const bwait = ms => new Promise(res => BT.waits.push({ until: BT.clock + ms, res }));
const btween = (dur, fn, easeOn = true) => new Promise(res => BT.tweens.push({ t0: BT.clock, dur: Math.max(1, dur), fn, res, ease: easeOn }));
function setPose(vu, name, dur = 0, back = true) { vu.pose = { name, t0: BT.clock, dur, back }; }
function camTo(p, k = 3, cut = false) { Object.assign(BT.camT, p); BT.camK = k; if (cut) Object.assign(BT.cam, BT.camT); }
function camHome(k = 2.6) { BT.orbit = false; camTo({ ...BT.home }, k); }
function fitHome() {
  const land = BT.W / BT.H > 1.05;
  const c = { tx: 0, ty: 40, tz: 0, yaw: land ? 0 : -1.2, pitch: land ? .24 : .5, dist: 900, fov: land ? .62 : .7, roll: 0 };
  const pts = [];
  for (const s of SLOTS) for (const sx of [-1, 1]) for (const dx of [-38, 38]) pts.push([s[0] * sx + dx, 0, s[1]], [s[0] * sx + dx, 160, s[1]]);
  const topM = land ? 64 : 84, botM = land ? 112 : 140, sideM = 4;
  const fit = () => {
    let lo = 150, hi = 6000;
    for (let k = 0; k < 26; k++) {
      const mid = (lo + hi) / 2; c.dist = mid; const K = camBasis(c); let ok = true;
      for (const p of pts) { const q = proj(K, ...p); if (!q || q[0] < sideM || q[0] > BT.W - sideM || q[1] < topM || q[1] > BT.H - botM) { ok = false; break; } }
      if (ok) hi = mid; else lo = mid;
    }
    c.dist = hi;
  };
  for (let it = 0; it < 5; it++) {
    fit();
    const K = camBasis(c); let y0 = 1e9, y1 = -1e9, x0 = 1e9, x1 = -1e9;
    for (const p of pts) { const q = proj(K, ...p); if (!q) continue; y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); }
    const s = K.focal / c.dist;
    const dx = ((x0 + x1) / 2 - BT.W / 2) / s, dy = ((y0 + y1) / 2 - (topM + BT.H - botM) / 2) / s;
    c.tx += K.r[0] * dx - K.u[0] * dy; c.ty += K.r[1] * dx - K.u[1] * dy; c.tz += K.r[2] * dx - K.u[2] * dy;
  }
  fit();
  return c;
}

// =====================================================================
//  BATTLE DIRECTOR — plays engine events as animation + camera work,
//  drives the HUD and player input.
// =====================================================================
const VU = uid => BT.vus.get(uid);
const avg = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);

// ---------- sound (tiny WebAudio synth) ----------
const SFX = { ctx: null, noise: null };
function sfx(kind) {
  if (!S.settings.sound) return;
  try {
    const A = SFX.ctx || (SFX.ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (A.state === "suspended") A.resume();
    const t = A.currentTime;
    const osc = (type, f0, f1, dur, vol, at = 0) => {
      const o = A.createOscillator(), g = A.createGain(); o.type = type; o.connect(g); g.connect(A.destination);
      o.frequency.setValueAtTime(f0, t + at); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + at + dur);
      g.gain.setValueAtTime(.0001, t + at); g.gain.exponentialRampToValueAtTime(vol, t + at + .015); g.gain.exponentialRampToValueAtTime(.0001, t + at + dur);
      o.start(t + at); o.stop(t + at + dur + .02);
    };
    const noise = (dur, vol, freq = 1200) => {
      if (!SFX.noise) { const b = A.createBuffer(1, A.sampleRate * .6, A.sampleRate), d = b.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = R() * 2 - 1; SFX.noise = b; }
      const s = A.createBufferSource(), f = A.createBiquadFilter(), g = A.createGain(); s.buffer = SFX.noise; f.type = "lowpass"; f.frequency.value = freq;
      s.connect(f); f.connect(g); g.connect(A.destination);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.start(t); s.stop(t + dur);
    };
    if (kind === "blaster") osc("square", 1500 + R() * 300, 160, .17, .05);
    else if (kind === "saber") { osc("sawtooth", 95, 170, .14, .06); osc("sawtooth", 170, 70, .28, .045, .12); }
    else if (kind === "hit") noise(.12, .18, 900);
    else if (kind === "crit") { noise(.2, .28, 1600); osc("square", 300, 90, .2, .05); }
    else if (kind === "boom") { noise(.7, .45, 420); osc("sine", 120, 30, .6, .25); }
    else if (kind === "zap") { for (let k = 0; k < 4; k++) osc("square", 800 + R() * 900, 200 + R() * 300, .07, .03, k * .06); }
    else if (kind === "heal") { [523, 659, 784].forEach((f, k) => osc("sine", f, f * 1.01, .25, .05, k * .07)); }
    else if (kind === "special") { osc("sawtooth", 160, 640, .45, .045); osc("sine", 320, 1280, .45, .04); }
    else if (kind === "win") { [392, 523, 659, 784].forEach((f, k) => osc("triangle", f, f, .32, .07, k * .12)); }
    else if (kind === "lose") { [392, 330, 262].forEach((f, k) => osc("triangle", f, f * .98, .4, .06, k * .18)); }
    else if (kind === "flame") noise(.6, .2, 700);
    else if (kind === "tap") osc("sine", 880, 660, .05, .03);
    else if (kind === "warp") osc("sine", 200, 1400, .4, .04);
  } catch (e) { /* audio unavailable */ }
}

// ---------- camera shots ----------
const aspect = () => Math.min(1.7, BT.W / BT.H);
const fitDist = (extent, minD, fov = .62) => Math.max(minD, extent / (2 * Math.tan(fov / 2) * aspect()));
function focusShot(vu) {
  const h = (vu.u.def.fig.h || 1) * vu.bs;
  return { tx: vu.pos.x + vu.dir * 10, ty: 55 * h, tz: vu.pos.z, yaw: BT.home.yaw + vu.dir * .62, pitch: .07, dist: fitDist(90, 270 * Math.max(.75, h)), fov: .62, roll: -vu.dir * .035 };
}
function impactShot(a, t) {
  const d = Math.hypot(a.pos.x - t.pos.x, a.pos.z - t.pos.z);
  return { tx: (a.pos.x + t.pos.x) / 2, ty: 52, tz: (a.pos.z + t.pos.z) / 2, yaw: BT.home.yaw - a.dir * .4, pitch: .13, dist: fitDist(d + 150, 300), fov: .62, roll: 0 };
}
function aoeShot(ts, a) {
  return { tx: avg(ts.map(t => t.pos.x)), ty: 48, tz: avg(ts.map(t => t.pos.z)), yaw: BT.home.yaw - a.dir * .3, pitch: .2, dist: fitDist(380, 470, .66), fov: .66, roll: 0 };
}
function nudgeShot(px, pz, k, zoom) {
  const h = BT.home, land = BT.W / BT.H > 1.05;
  return { ...h, tx: lerp(h.tx, px, k), tz: lerp(h.tz, pz, k), dist: h.dist * (land ? zoom : 1 - (1 - zoom) * .4) };
}
function twoShot(a, t) {
  if (!t || t === a) return nudgeShot(a.pos.x, a.pos.z, .12, .95);
  return { ...nudgeShot((a.pos.x + t.pos.x) / 2, (a.pos.z + t.pos.z) / 2, .25, .88), yaw: BT.home.yaw + a.dir * .06 };
}

// ---------- movement ----------
async function moveTo(vu, x, z, speedMul = 1) {
  const sx = vu.pos.x, sz = vu.pos.z, d = Math.hypot(x - sx, z - sz);
  if (d < 4) return;
  vu.face = Math.sign(x - sx) || vu.dir;
  setPose(vu, "run", 0, false);
  await btween(clamp(d * 1.05, 180, 520) / speedMul, k => { vu.pos.x = lerp(sx, x, k); vu.pos.z = lerp(sz, z, k); vu.y = Math.sin(k * Math.PI) * 6; });
  vu.y = 0; vu.face = vu.dir; setPose(vu, "idle");
}
async function engage(a, t) {
  const x = t.pos.x - a.dir * 64 * t.bs, z = t.pos.z + (a.pos.z > t.pos.z ? 6 : -6);
  if (Math.hypot(a.pos.x - x, a.pos.z - z) < 12) return;
  await moveTo(a, x, z, 1.15);
}
async function returnHome() {
  const list = [...BT.vus.values()].filter(vu => !vu.dead && (Math.hypot(vu.pos.x - vu.home.x, vu.pos.z - vu.home.z) > 3 || vu.y > 1));
  await Promise.all(list.map(async vu => {
    if (vu.y > 1) { const y0 = vu.y; await btween(160, k => { vu.y = y0 * (1 - k); }); }
    await moveTo(vu, vu.home.x, vu.home.z, 1.25);
    vu.face = vu.dir;
  }));
}

// ---------- fx helpers ----------
function sparks(vu, col = "#ffd9a0", n = 14) { addParts(chestW(vu), n, { col, speed: 220, life: 380, size: 2.6, g: 380, spread: 10 }); }
function boltColor(vu) { return vu.u.def.fig.bolt || (vu.u.id === "rex" || vu.u.id === "jango" ? "#4aa3ff" : vu.u.id === "chewie" ? "#5dff7a" : "#ff4a3a"); }
async function fireBolt(a, t, k = 0) {
  const from = tipW(a, k % 2 && a.out && a.out.tip2 ? "tip2" : "tip");
  const to = chestW(t); to[0] += (R() - .5) * 10; to[1] += (R() - .5) * 14;
  const d = Math.hypot(to[0] - from[0], to[1] - from[1], to[2] - from[2]), dur = clamp(d / 2.4, 80, 240);
  BT.bolts.push({ from, to, t0: BT.clock, dur, col: boltColor(a), len: .32 });
  addParts(from, 5, { col: "#ffe2a0", speed: 60, life: 160, size: 3, g: 0 });
  sfx("blaster");
  await bwait(dur);
  addParts(to, 9, { col: boltColor(a), speed: 160, life: 300, size: 2.4, g: 200 });
}
function lightningArc(a, t, col, dur, key = "hand") {
  BT.arcs.push({ from: () => billboard(a, (a.out && a.out[key]) || [16, -60]), to: () => chestW(t), col, t0: BT.clock, dur });
}
function auraBurst(vu, col, ring = true) {

  if (ring) BT.rings.push({ x: vu.pos.x, z: vu.pos.z, r0: 10, r1: 70, t0: BT.clock, dur: 700, col, w: 3 });
  addParts([vu.pos.x, 10, vu.pos.z], 16, { col, speed: 40, vy: 110, life: 800, size: 2.4, g: -20, spread: 40 });

// ---------- event playback ----------
async function gate() { while (BT.paused && BT.on) await new Promise(r => setTimeout(r, 120)); }
async function play(evs) {
  for (let i = 0; i < evs.length; i++) {
    if (BT.quit || !BT.on) return;
    await gate();
    await handle(evs[i]);
  }
}
async function handle(e) {
  const vu = e.u != null ? VU(e.u) : null;
  switch (e.k) {
    case "turn": {
      BT.active = vu;
      if (e.tms) for (const [uid, tm] of e.tms) { const v = VU(uid); if (v) v.tmT = tm; }
      if (vu) { vu.tmT = 0; camTo(twoShot(vu, null), 1.6); }
      await bwait(150);
      break;
    }
    case "wave": {
      for (const [uid, v] of BT.vus) if (v.team === "E" && v.dead) BT.vus.delete(uid);
      const list = e.units.map(uid => addVU(BT.B.byId(uid), true));
      banner(`Wave ${e.w + 1}`, "WAVE", "ds");
      BT.letterboxT = 1;
      camTo({ ...BT.home, tx: 200, yaw: BT.home.yaw - .45, dist: BT.home.dist * .75, pitch: .2 }, 2.2);
      await bwait(350);
      sfx("warp");
      list.forEach((v, k) => { v.spawnT = BT.clock + k * 110; setTimeout(() => warpFx(v), 0); });
      await bwait(1000);
      BT.letterboxT = 0; hideBanner(); camHome(2.4);
      await bwait(300);
      break;
    }
    case "act": {
      BT.act = e;
      if (!vu) break;
      const tv = e.t != null ? VU(e.t) : null;
      if (e.sp) {
        banner(e.name, vu.u.def.n, vu.team === "A" ? "ls" : "ds");
        BT.letterboxT = 1; sfx("special");
        camTo(focusShot(vu), 5.5);
        setPose(vu, e.anim === "buff" || e.anim === "heal" ? "buff" : e.anim === "lightning" || e.anim === "push" || e.anim === "choke" ? "cast" : "buff", 650);
        auraBurst(vu, vu.team === "A" ? "#5fd4ff" : "#ff4b4b", false);
        await bwait(720);
      } else {
        camTo(twoShot(vu, tv), 2.4);
        await bwait(100);
      }
      if (e.anim === "buff" || e.anim === "heal") {
        const col = e.anim === "heal" ? "#5dfc9b" : "#f2c14e";
        setPose(vu, "buff", 700);
        sfx(e.anim === "heal" ? "heal" : "special");
        const group = e.tgt === "allies" ? [...BT.vus.values()].filter(v => v.team === vu.team && !v.dead) : [vu];
        if (e.tgt === "allies") camTo({ ...BT.home, tx: avg(group.map(v => v.pos.x)), dist: fitDist(420, 460), yaw: BT.home.yaw + vu.dir * .25, pitch: .2 }, 3);
        for (const v of group) auraBurst(v, col);
        await bwait(600);
      }
      break;
    }
    case "atk": await doAttack(e); break;
    case "dmg": {
      if (!vu) break;
      const lostHp = e.hp < vu.hp;
      vu.hp = e.hp; vu.prot = e.prot;
      floatText(e.u, fmtFull(e.n), e.crit ? "crit" : e.dot ? "dot" : lostHp ? "dmg" : "prot");
      if (e.dot) { addParts(chestW(vu), 8, { col: "#c86bff", speed: 50, vy: 40, life: 600, size: 2.6, g: -30 }); await bwait(300); break; }
      vu.flash = BT.clock + 160;
      if (vu.hp > 0) setPose(vu, "hit", 360);
      if (e.crit) { BT.shake = Math.max(BT.shake, 9); sfx("crit"); } else sfx("hit");
      await bwait(50);
      break;
    }
    case "heal": {
      if (!vu) break;
      vu.hp = e.hp; vu.prot = e.prot;
      floatText(e.u, "+" + fmtFull(e.n), e.isProt ? "prot" : "heal");
      addParts([vu.pos.x, 30, vu.pos.z], 8, { col: e.isProt ? "#cfe3ff" : "#5dfc9b", speed: 30, vy: 90, life: 700, size: 2.2, g: -10, spread: 30 });
      await bwait(70);
      break;
    }
    case "txt": {
      if (!vu) break;
      floatText(e.u, e.s, e.c);
      if (e.evade) { const x0 = vu.pos.x; btween(260, k => { vu.pos.x = x0 - vu.dir * Math.sin(k * Math.PI) * 26; }); }
      await bwait(e.s === "STUNNED" ? 450 : 80);
      break;
    }
    case "fx": if (vu) { vu.effs = e.list; vu.stealth = e.list.some(x => x[0] === "stealth"); } break;
    case "tm": if (vu) { vu.tmT = e.tm; if (e.v >= 30) floatText(e.u, `+${Math.round(e.v)}% TURN METER`, "txt"); } break;

      addParts(chestW(vu), 26, { col: vu.team === "A" ? "#9fd8ff" : "#ffb0a0", speed: 90, vy: 60, life: 1100, size: 2.4, g: -40, spread: 26 });

      await bwait(220);

}
function warpFx(v) {
  BT.rings.push({ x: v.home.x, z: v.home.z, r0: 50, r1: 8, t0: BT.clock, dur: 600, col: v.team === "A" ? "#5fd4ff" : "#ff6a5a", w: 3 });
  addParts([v.home.x, 0, v.home.z], 18, { col: v.team === "A" ? "#9fe0ff" : "#ffb0a0", speed: 30, vy: 200, life: 700, size: 2.2, g: 0, spread: 24 });
}

async function doAttack(e) {
  const a = VU(e.a), ts = e.t.map(VU).filter(v => v && !v.dead);
  if (!a || a.dead || !ts.length) return;
  const main = ts[0], sp = e.sp;
  switch (e.anim) {
    case "melee": case "zap": {
      await engage(a, main);
      if (sp) camTo(impactShot(a, main), 5);
      if (e.anim === "zap") {
        setPose(a, "cast", 420); await bwait(110);
        lightningArc(a, main, "#7fd4ff", 280); sfx("zap"); await bwait(170); sparks(main, "#9fe0ff");
      } else {
        setPose(a, "swing", 430); sfx("saber"); await bwait(205);
        sparks(main, (a.out && a.out.tipc) || "#ffe0a0");
        if (sp) { BT.shake = Math.max(BT.shake, 6); }
      }
      break;
    }
    case "spin": {
      const cx = avg(ts.map(t => t.home.x)) - a.dir * 90;
      await moveTo(a, cx, 0, 1.2);
      if (sp) camTo(aoeShot(ts, a), 4);
      a.spin = BT.clock; setPose(a, "swing", 600); sfx("saber");
      await bwait(300);
      for (const t of ts) sparks(t, (a.out && a.out.tipc) || "#ffe0a0", 8);
      BT.shake = Math.max(BT.shake, 7);
      bwait(300).then(() => { a.spin = null; });
      break;
    }
    case "shoot": case "volley": {
      if (sp) camTo(e.aoe ? aoeShot(ts, a) : impactShot(a, main), 4);
      const shots = e.anim === "volley" ? (e.aoe ? ts : [main, main, main]) : [main];
      setPose(a, "shoot", 260 + shots.length * 90);
      await bwait(50);
      await Promise.all(shots.map(async (t, k) => { await bwait(k * 85); await fireBolt(a, t, k); }));
      break;
    }
    case "lightning": {
      setPose(a, "cast", 760);
      if (sp) camTo(e.aoe ? aoeShot(ts, a) : impactShot(a, main), 4);
      await bwait(150);
      sfx("zap");
      for (const t of ts) { lightningArc(a, t, "#b9a6ff", 520); if (a.u.def.fig.type === "hood" || a.u.def.fig.w === "none") lightningArc(a, t, "#8fd0ff", 520, "tip"); }
      await bwait(260);
      for (const t of ts) { sparks(t, "#c9b8ff", 10); setPose(t, "hit", 400); }
      BT.shake = Math.max(BT.shake, 5);
      break;
    }
    case "push": {
      setPose(a, "cast", 600);
      if (sp) camTo(aoeShot(ts, a), 4);
      await bwait(160);
      sfx("special");
      BT.rings.push({ x: a.pos.x + a.dir * 40, z: a.pos.z, r0: 10, r1: 360, t0: BT.clock, dur: 520, col: "#9fe0ff", w: 5 });
      await bwait(220);
      for (const t of ts) { const x0 = t.pos.x; btween(380, k => { t.pos.x = x0 + a.dir * Math.sin(k * Math.PI) * 34; }); }
      BT.shake = Math.max(BT.shake, 6);
      break;
    }
    case "choke": {
      setPose(a, "choke", 1000);
      if (sp) camTo(impactShot(a, main), 4);
      await bwait(150);
      main.aura = BT.clock + 900; main.auraCol = "#7a3aff";
      await btween(320, k => { main.y = k * 28 + Math.sin(BT.clock / 30) * 1.5; });
      BT.shake = Math.max(BT.shake, 4);
      bwait(420).then(() => btween(160, k => { main.y = 28 * (1 - k); }));
      break;
    }
    case "grenade": {
      setPose(a, "throw", 620);
      if (sp) camTo(aoeShot(ts, a), 3.5);
      await bwait(260);
      const to = [avg(ts.map(t => t.pos.x)), 0, avg(ts.map(t => t.pos.z))];
      BT.nades.push({ from: tipW(a, "hand"), to, t0: BT.clock, dur: 520, h: 120 });
      await bwait(520);
      sfx("boom"); BT.flash = .55; BT.flashCol = "#ffd9a0"; BT.shake = 16;
      addParts([to[0], 10, to[2]], 50, { col: "#ff9a3a", speed: 260, vy: 160, life: 700, size: 4.5, g: 200, spread: 60 });
      addParts([to[0], 20, to[2]], 30, { col: "#5a4a40", speed: 80, vy: 90, life: 1200, size: 6, g: -20, spread: 80, add: false });
      BT.rings.push({ x: to[0], z: to[2], r0: 10, r1: 320, t0: BT.clock, dur: 520, col: "#ffcf8a", w: 6 });
      for (const t of ts) { const x0 = t.pos.x; btween(360, k => { t.pos.x = x0 + a.dir * Math.sin(k * Math.PI) * 30; t.y = Math.sin(k * Math.PI) * 18; }); }
      break;
    }
    case "flame": {
      setPose(a, "shoot", 900);
      if (sp) camTo(aoeShot(ts, a), 4);
      sfx("flame");
      await btween(560, k => {
        const t = ts[Math.min(ts.length - 1, Math.floor(k * ts.length))]; if (!t) return;
        const from = tipW(a), to = chestW(t);
        for (let n = 0; n < 3; n++) BT.parts.push({ p: [...from], v: [(to[0] - from[0]) * 2.4 + (R() - .5) * 60, (to[1] - from[1]) * 2.4 + R() * 40, (to[2] - from[2]) * 2.4 + (R() - .5) * 60],
          g: -40, t0: BT.clock, life: 420, size: 5 + R() * 4, col: R() < .5 ? "#ff8a2a" : "#ffd04a", add: true, drag: 1.2 });
      }, false);
      BT.shake = Math.max(BT.shake, 5);
      break;
    }
    default: {
      setPose(a, "shoot", 300); await fireBolt(a, main);
    }
  }
}

function press(el, onTap, onHold) {
  let timer = 0, held = false, sx = 0, sy = 0;
  el.addEventListener("pointerdown", ev => { held = false; sx = ev.clientX; sy = ev.clientY; clearTimeout(timer); timer = setTimeout(() => { held = true; onHold && onHold(ev); }, 430); });
  el.addEventListener("pointermove", ev => { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 12) clearTimeout(timer); });

function unitAt(x, y) {
  let best = null, bd = 1e9;
  for (const vu of BT.vus.values()) {
    if (!vu.scr || vu.dead || vu.gone) continue;
    const s = vu.scr.s, top = vu.scr.y + ((vu.out && vu.out.head ? vu.out.head[1] : -92) - 16) * s;
    if (x > vu.scr.x - 32 * s - 6 && x < vu.scr.x + 32 * s + 6 && y > top - 10 && y < vu.scr.y + 10) {
      const d = Math.abs(x - vu.scr.x) + Math.abs(y - (top + vu.scr.y) / 2) * .5;
      if (d < bd) { bd = d; best = vu; }
    }
  }
  return best;
}

async function intro() {
  const h = BT.home, B = BT.B;
  banner(BT.cfg.title || "Battle", BT.cfg.sub || "", BT.cfg.side === "dark" ? "ds" : "ls");
  camTo({ ...h, tx: 230, ty: 70, yaw: h.yaw - 1.05, pitch: .55, dist: h.dist * 1.15 }, 1, true);
  const foes = [...BT.vus.values()].filter(v => v.team === "E"), mine = [...BT.vus.values()].filter(v => v.team === "A");
  foes.forEach((v, k) => { v.spawnT = BT.clock + 200 + k * 120; bwait(200 + k * 120).then(() => warpFx(v)); });
  camTo({ ...h, tx: 160, yaw: h.yaw - .5, pitch: .3, dist: h.dist * .78 }, 1.25);
  sfx("warp");
  await bwait(1100);
  camTo({ ...h, tx: -170, yaw: h.yaw + .55, pitch: .16, dist: h.dist * .7 }, 1.6);
  mine.forEach((v, k) => { v.spawnT = BT.clock + k * 110; bwait(k * 110).then(() => warpFx(v)); });
  await bwait(1100);
  hideBanner(); BT.letterboxT = 0;
  camHome(1.8);
  await bwait(600);
  void B;
}
async function runBattle() {
  const B = BT.B;
  await intro();
  await play(B.ev.splice(0));
  while (!B.over && !BT.quit && BT.on) {
    const r = B.step();
    if (r === "input") {
      await play(B.ev.splice(0));
      if (BT.quit || !BT.on) return;
      if (B.auto) B.autoAct();
      else {
        camHome(3);
        const ch = await new Promise(res => { BT.inputRes = res; showControls(B.waiting); });
        if (ch === "quit" || BT.quit) return;
        if (ch === "auto") B.autoAct(); else B.playerAct(ch.i, ch.t);
      }
      hideControls();
    }
    await play(B.ev.splice(0));
  }
  if (BT.quit || !BT.on) return;
  await outro();
}
async function outro() {
  const B = BT.B, res = B.result, h = BT.home;
  hideControls(); BT.active = null;
  await bwait(250);
  const mine = [...BT.vus.values()].filter(v => v.team === "A" && !v.dead);
  if (res.win) {
    for (const v of mine) setPose(v, "victory", 0, false);
    camTo({ tx: avg(mine.map(v => v.pos.x)), ty: 55, tz: avg(mine.map(v => v.pos.z)), yaw: h.yaw + .55, pitch: .1, dist: fitDist(320, 360), fov: .62, roll: 0 }, 1.8);
    BT.orbit = true; sfx("win"); banner("Victory", "", "ls");
  } else {
    const foes = [...BT.vus.values()].filter(v => v.team === "E" && !v.dead);
    for (const v of foes) setPose(v, "victory", 0, false);
    camTo({ tx: avg(foes.map(v => v.pos.x)), ty: 60, tz: 0, yaw: h.yaw - .5, pitch: .14, dist: fitDist(320, 380), fov: .62, roll: 0 }, 1.4);
    sfx("lose"); banner("Defeat", "", "ds");
  }
  BT.letterboxT = 1;
  await bwait(1700);
  hideBanner();
  const rewards = res.win ? BT.cfg.onWin(res, B) : (BT.cfg.onLose ? BT.cfg.onLose(res, B) : []);
  save();
  const el = document.createElement("div");
  el.className = "result";
  el.innerHTML = `<div class="eyebrow">${esc(BT.cfg.sub || "")}</div>
    <h1 class="${res.win ? "gold" : "ds"}">${res.win ? "Victory" : "Defeat"}</h1>
    ${res.win && BT.cfg.stars !== false ? `<div class="bigstars">${[1, 2, 3].map(k => `<span class="${k <= res.stars ? "on" : ""}">${k <= res.stars ? IC.star : IC.starOff}</span>`).join("")}</div>` : ""}
    ${!res.win ? `<p class="small dim" style="max-width:34ch">Upgrade your characters' gear, levels and stars, or try a different leader.</p>` : ""}
    ${rewards && rewards.length ? `<div class="rewards">${rewardsHTML(rewards)}</div>` : ""}
    <div class="row" style="gap:10px;margin-top:6px">
      ${BT.cfg.retry ? `<button class="btn ghost" id="rRetry">Retry</button>` : ""}
      <button class="btn" id="rDone">Continue</button>
    </div>`;
  $(".bwrap").appendChild(el);
  $("#rDone").onclick = () => { closeBattle(); BT.cfg.onClose && BT.cfg.onClose(res); };
  if ($("#rRetry")) $("#rRetry").onclick = () => { const r = BT.cfg.retry; closeBattle(); r(); };
}

// ---------- art ----------
const ART = {};
function squadArt(ids) {
  const key = ids.join(","); if (ART[key]) return ART[key];
  const cv = document.createElement("canvas"); cv.width = 360; cv.height = 240; const g = cv.getContext("2d");
  const xs = [190, 110, 270], ys = [220, 196, 196], sc = [1.65, 1.35, 1.35];
  [1, 2, 0].forEach(k => {
    const id = ids[k]; if (!id) return;
    const f = CH[id].fig;
    g.save(); g.translate(xs[k], ys[k]);
    g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.ellipse(0, 0, 30 * sc[k], 7 * sc[k], 0, 0, 7); g.fill();
    g.scale(sc[k] * (k === 2 ? -1 : 1), sc[k]);
    drawFigure(g, f, { name: k === 0 ? "victory" : "idle", time: .4 + k });
    g.restore();
  });
  try { ART[key] = cv.toDataURL(); } catch (e) { ART[key] = ""; }
  return ART[key];
}
function mountModel(cv, id) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth || 160, H = cv.clientHeight || 220;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d");
  let pose = { name: "idle", t0: performance.now(), dur: 0 };
  cv.onclick = () => {
    const f = CH[id].fig;
    const opts = /saber|staff/.test(f.w) ? ["swing", "buff", "victory"] : f.w === "none" ? ["cast", "buff", "choke"] : ["shoot", "buff", "victory"];
    pose = { name: pick(opts), t0: performance.now(), dur: 1000 };
  };
  const loop = now => {
    if (!cv.isConnected) return;
    requestAnimationFrame(loop);
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H * .9;
    const pg = g.createRadialGradient(cx, cy, 4, cx, cy, W * .45); pg.addColorStop(0, "rgba(95,212,255,.5)"); pg.addColorStop(1, "rgba(95,212,255,0)");
    g.fillStyle = pg; g.beginPath(); g.ellipse(cx, cy, W * .44, W * .1, 0, 0, 7); g.fill();
    g.strokeStyle = "rgba(95,212,255,.7)"; g.lineWidth = 1.5; g.beginPath(); g.ellipse(cx, cy, W * .32, W * .07, 0, 0, 7); g.stroke();
    g.globalAlpha = .25; for (let k = 0; k < 5; k++) { const y = cy - ((now / 18 + k * 40) % 200); g.fillStyle = "#5fd4ff"; g.fillRect(cx - W * .3, y, W * .6, 1); } g.globalAlpha = 1;
    let t = pose.dur ? (now - pose.t0) / pose.dur : 0;
    if (pose.dur && t >= 1) { pose = { name: "idle", t0: now, dur: 0 }; t = 0; }
    const f = CH[id].fig, sc = (H * .66) / (112 * Math.max(f.h || 1, .8));
    g.save(); g.translate(cx - 4, cy); g.scale(sc, sc); drawFigure(g, f, { name: pose.name, t, time: now / 1000 }); g.restore();
  };
  requestAnimationFrame(loop);
}

function shardSources(id) {
  const where = [];
  for (const t of ["light", "dark"]) CAMPAIGN[t].chapters.forEach((ch, c) => ch.shards.forEach((s, n) => { if (s === id) where.push(`${t === "light" ? "LS" : "DS"} ${nodeKey(c, n)}`); }));
  if (ARENA_STORE.some(a => a.id === id)) where.push("Arena Shipments");
  where.push("Chromium Packs");
  return "Shards from: " + [...new Set(where)].slice(0, 6).join(", ");
}
function nodeOpen(table, c, n) {
  if (c === 0 && n === 0) return true;
  const [pc, pn] = n === 0 ? [c - 1, 4] : [c, n - 1];
  return (S.camp[table][nodeKey(pc, pn)] || 0) > 0;
}
function firstOpenUncleared(table) {
  for (let c = 0; c < 6; c++) for (let n = 0; n < 5; n++) if (nodeOpen(table, c, n) && !S.camp[table][nodeKey(c, n)]) return [c, n];
  return null;
}
function nextHint() {
  const act = CH_IDS.find(id => !owned(id) && (S.shards[id] || 0) >= 10);
  if (act) return { act: "go", data: `data-v="char" data-a="${act}"`, text: `Activate <b>${esc(CH[act].n)}</b>. You have enough shards.` };
  if (DAILIES.some(d => !S.daily.claimed[d.id] && S.daily[d.id] >= d.goal)) return { act: "dailies", text: "Daily Activity rewards are ready to claim." };
  for (const t of ["light", "dark"]) {
    const nx = firstOpenUncleared(t);
    if (nx) { const node = nodeInfo(t, nx[0], nx[1]); return { act: "node", data: `data-c="${nx[0]}" data-n="${nx[1]}" data-t="${t}"`, text: `Fight ${t === "light" ? "Light" : "Dark"} Side battle <b>${node.key}</b>${node.boss ? ` against ${esc(CH[CAMPAIGN[t].chapters[nx[0]].boss].n)}` : ""}.` }; }
  }
  if (Date.now() - S.bronzeTime >= BRONZE_MS) return { act: "go", data: 'data-v="store"', text: "A free Bronzium pack is waiting in Shipments." };
  return null;
}

// =====================================================================
//  BATTLE LAUNCHERS
// =====================================================================
function squadUnits(ids) { return ids.filter(owned).map(id => ({ id, prog: S.roster[id] })); }

function campaignRewards(node, stars, sim) {
  const list = [], c = node.c;
  const credits = Math.round((90 + node.idx * 28) * (stars === 3 ? 1.2 : 1));
  S.credits += credits; list.push({ k: "credits", n: credits });
  const sal = c < 2 ? "sal1" : c < 4 ? (R() < .5 ? "sal1" : "sal2") : (R() < .5 ? "sal2" : "sal3");
  const sn = ri(2, 4) + Math.floor(c / 2); give({ [sal]: sn }); list.push({ k: sal, n: sn });
  if (R() < .45) { const m = ri(1, 2) + Math.floor(c / 3); give({ mats: m }); list.push({ k: "mats", n: m }); }
  if (R() < (sim ? .45 : .35)) { const d = c < 3 ? "droid1" : "droid2"; give({ [d]: 1 }); list.push({ k: d, n: 1 }); }
  if (R() < (node.boss ? .75 : .6)) { const s = ri(1, node.boss ? 3 : 2); addShards(node.shard, s); list.push({ k: "shard:" + node.shard, n: s }); }
  return list;
}
function launchCampaign(table, c, n) {
  const node = nodeInfo(table, c, n), ids = UI.squad && UI.squad.key === table ? UI.squad.ids : S.squads[table];
  const allies = squadUnits(ids);
  if (!allies.length) return toast("Pick at least one hero.");
  if (S.energy < node.energy) { refillModal(); return; }
  S.squads[table] = allies.map(a => a.id);
  spendEnergy(node.energy); S.stats.battles++; save();
  closeModal();
  startBattle({
    allies, waves: node.waves, env: ENV_FOR[table][c], side: table,
    title: `Battle ${node.key}`, sub: `${CAMPAIGN[table].n} · ${CAMPAIGN[table].chapters[c].n}`,
    onWin(res) {
      S.stats.wins++; S.daily.wins++;
      const prev = S.camp[table][node.key] || 0;
      S.camp[table][node.key] = Math.max(prev, res.stars);
      const list = campaignRewards(node, res.stars, false);
      const xp = 40 + node.idx * 32;
      for (const a of allies) charXp(a.id, xp);
      list.push({ k: "xp", n: xp });
      if (res.stars === 3 && !S.firstClear[table + node.key]) { S.firstClear[table + node.key] = 1; S.crystals += 20; list.push({ k: "crystals", n: 20 }); }
      if (n === 4 && prev === 0 && c < 5) toast(`Chapter ${c + 2} unlocked!`, "gold");
      return list;
    },
    onLose() { const back = node.energy - 1; S.energy += back; return back > 0 ? [{ k: "energy", n: back }] : []; },
    onQuit() { S.energy += node.energy - 1; save(); renderTop(); },
    retry: () => launchCampaign(table, c, n),
  });
}
function simNode(table, c, n, times) {
  const node = nodeInfo(table, c, n);
  if ((S.camp[table][node.key] || 0) < 3) return;
  times = Math.min(times, Math.floor(S.energy / node.energy));
  if (times < 1) return refillModal();
  const all = [];
  for (let k = 0; k < times; k++) { spendEnergy(node.energy); all.push(...campaignRewards(node, 3, true)); S.daily.wins++; S.stats.wins++; S.stats.battles++; }
  save();
  rewardModal(times > 1 ? `Simmed ×${times}` : "Battle simmed", all, `${CAMPAIGN[table].n} · ${node.key}`);
  renderTop();
}
function launchArena(k) {
  const A = S.arena, opp = A.opps[k];
  const ids = UI.squad && UI.squad.key === "arena" ? UI.squad.ids : S.squads.arena;
  const allies = squadUnits(ids);
  if (!allies.length) return toast("Pick at least one hero.");
  if (A.attempts <= 0) return toast("No attempts left. One recharges every 10 minutes.");
  if (A.attempts >= 5) A.aTime = Date.now();
  A.attempts--; S.squads.arena = allies.map(a => a.id); S.stats.battles++; save();
  startBattle({
    allies, waves: [opp.team.map(u => ({ ...u, ab: [...u.ab] }))], env: "arena", side: "light", stars: false,
    title: "Squad Arena", sub: `vs ${opp.name} · Rank #${opp.rank}`,
    onWin() {
      S.stats.wins++; S.daily.arena++;
      const list = [{ k: "tokens", n: 40 }]; S.tokens += 40;
      if (opp.rank < A.rank) { A.rank = opp.rank; list.unshift({ k: "rank", n: A.rank }); }
      genOpps();
      return list;
    },
    onLose() { return []; },
    onClose() { UI.view = "arena"; UI.arg = null; },
    onQuit() { UI.view = "arena"; UI.arg = null; },
  });
}

const ACT = {
  go(d) { closeModal(); if (d.v !== "squad") UI.squad = null; route(d.v, d.a || null); },
  back() { const a = UI.arg; UI.squad = null; route(a && a.mode === "arena" ? "arena" : "battles", a && a.table); },
  chap(d) { UI.chap[UI.table] = +d.c; rerender(); },
  node(d) { if (d.t) { UI.table = d.t; UI.chap[d.t] = +d.c; route("battles", d.t); } nodeModal(UI.table, +d.c, +d.n); },
  toSquad(d) { closeModal(); UI.squad = null; route("squad", { mode: "campaign", table: d.t, c: +d.c, n: +d.n }); },
  sim(d) { closeModal(); simNode(d.t, +d.c, +d.n, +d.x); rerender(); },
  pickSq(d) {
    const ids = UI.squad.ids, i = ids.indexOf(d.id);
    if (i >= 0) ids.splice(i, 1); else if (ids.length < 5) ids.push(d.id); else return toast("Your squad is full. Tap a squad member to swap them out.");
    sfxMenu(); rerender();
  },
  slot(d) {
    const k = +d.k, ids = UI.squad.ids, id = ids[k];
    openModal(`<div class="stack"><div class="row">${ptHTML(id, { s: 56 })}<div><h3>${esc(CH[id].n)}</h3><p class="tiny dim">${CH[id].lead ? esc(CH[id].lead.n) + ": " + esc(CH[id].lead.d) : "No leader ability."}</p></div></div>
      ${k > 0 ? `<button class="btn wide" data-act="makeLead" data-k="${k}">Make leader</button>` : ""}
      <button class="btn ghost wide" data-act="rmSlot" data-k="${k}">Remove from squad</button></div>`);
  },
  makeLead(d) { const ids = UI.squad.ids, [id] = ids.splice(+d.k, 1); ids.unshift(id); closeModal(); rerender(); },
  rmSlot(d) { UI.squad.ids.splice(+d.k, 1); closeModal(); rerender(); },
  fight() {
    const a = UI.arg;
    if (a.mode === "arena") launchArena(a.opp); else launchCampaign(a.table, a.c, a.n);
  },
  filter(d) { UI.filter = d.f; rerender(); },
  activate(d) { if (activate(d.id)) { toast(`${CH[d.id].n} joined your roster!`, "gold"); sfxMenu("win"); } rerender(); },
  promote(d) { if (promote(d.id)) { toast(`${CH[d.id].n} promoted to ${S.roster[d.id].stars}★`, "gold"); sfxMenu("win"); } rerender(); },
  gearUp(d) { if (gearUp(d.id)) { toast(`Gear ${roman(S.roster[d.id].gear)} equipped`); sfxMenu(); } rerender(); },
  abUp(d) { if (abUp(d.id, +d.i)) { toast(`${CH[d.id].ab[+d.i].n} upgraded`); sfxMenu(); } rerender(); },
  train(d) { const l = S.roster[d.id].lvl; train(d.id, d.it); if (S.roster[d.id].lvl > l) toast(`${CH[d.id].n} reached level ${S.roster[d.id].lvl}`); sfxMenu(); rerender(); },
  autoTrain(d) { const l = S.roster[d.id].lvl, n = autoTrain(d.id); if (n) toast(`Used ${n} droid${n > 1 ? "s" : ""}: level ${l} → ${S.roster[d.id].lvl}`); sfxMenu(); rerender(); },
  arenaFight(d) { UI.squad = null; route("squad", { mode: "arena", opp: +d.k }); },
  newOpps() { genOpps(); rerender(); },
  payout() {
    if (Date.now() - S.arena.payTime < PAYOUT_MS) return;
    const p = payout(S.arena.rank); S.crystals += p.crystals; S.tokens += p.tokens; S.arena.payTime = Date.now();
    rewardModal("Arena payout", [{ k: "crystals", n: p.crystals }, { k: "tokens", n: p.tokens }], `Rank #${S.arena.rank}`); rerender();
  },
  arenaBuy(d) {
    const it = ARENA_STORE[+d.k]; if (S.tokens < it.cost) return;
    S.tokens -= it.cost;
    if (it.type === "shard") addShards(it.id, it.n); else give({ [it.id]: it.n });
    toast(`Bought ${it.n}× ${it.type === "shard" ? CH[it.id].n + " shards" : ITEMS[it.id].n}`); rerender();
  },
  chromium() { if (S.crystals < 250) return; S.crystals -= 250; const r = openChromium(); save(); rewardModal("Chromium Pack", r, "Shipment"); rerender(); sfxMenu("win"); },
  chromium10() { if (S.crystals < 2200) return; S.crystals -= 2200; const all = []; for (let k = 0; k < 10; k++) all.push(...openChromium()); save(); rewardModal("10 Chromium Packs", all, "Shipment"); rerender(); sfxMenu("win"); },
  bronze(d) {
    if (d.free) { if (Date.now() - S.bronzeTime < BRONZE_MS) return; S.bronzeTime = Date.now(); }
    else { if (S.credits < 250) return; S.credits -= 250; }
    const r = openBronzium(); save(); rewardModal("Bronzium Pack", r, "Shipment"); rerender();
  },
  refill() { refillModal(); },
  refillBuy() { if (S.crystals < 50) return; S.crystals -= 50; S.energy = Math.max(S.energy, maxEnergy(S.lvl)); S.eTime = Date.now(); closeModal(); toast("Energy refilled"); rerender(); },
  heist() { if (S.crystals < 100) return; S.crystals -= 100; S.credits += 6000; toast("+6,000 credits"); rerender(); },
  buyDroids() { if (S.crystals < 80) return; S.crystals -= 80; give({ droid2: 4 }); toast("+4 Advanced Training Droids"); rerender(); },
  buySal() { if (S.crystals < 120) return; S.crystals -= 120; const r = [{ k: "sal1", n: 15 }, { k: "sal2", n: 10 }, { k: "sal3", n: 4 }]; for (const x of r) give({ [x.k]: x.n }); rewardModal("Salvage Crate", r, "Shipment"); rerender(); },
  dailies() { dailiesModal(); },
  claimDaily(d) {
    const q = DAILIES.find(x => x.id === d.id); if (!q || S.daily.claimed[q.id] || S.daily[q.id] < q.goal) return;
    S.daily.claimed[q.id] = 1; give(q.reward); dailiesModal(); renderTop(); save();
  },
  claimAll() { if (S.daily.claimed.all || !DAILIES.every(d => S.daily.claimed[d.id])) return; S.daily.claimed.all = 1; give(DAILY_ALL); dailiesModal(); renderTop(); save(); },
  closeModal() { closeModal(); rerender(); },
  settings() { settingsModal(false); },
  askReset() { settingsModal(true); },
  doReset() { S = newSave(); S.seenIntro = true; save(); closeModal(); route("home"); toast("Progress erased. Welcome back, Commander."); },
  toggleSound() { const n = $("#pname").value; S.settings.sound = !S.settings.sound; settingsModal(false); $("#pname").value = n; },
  saveName() { const v = ($("#pname").value || "").trim().slice(0, 18); if (v) S.name = v; closeModal(); save(); renderTop(); },
  startGame() { S.seenIntro = true; save(); closeModal(); sfxMenu("win"); route("home"); },
};
function sfxMenu(kind = "tap") { sfx(kind); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});

// =====================================================================
//  BOOT
// =====================================================================
function introModal() {
  openModal(`<div class="stack" style="align-items:center;text-align:center">
    <img src="${squadArt(["luke", "leia", "han"])}" alt="" style="width:240px;max-width:100%">
    <div class="eyebrow">A long time ago, in a galaxy far, far away…</div>
    <h1>Galactic<span style="display:block;color:var(--gold);font-size:20px;letter-spacing:.3em">Heroes</span></h1>
    <p class="small dim" style="max-width:36ch">Assemble squads of five, fill their turn meters, unleash specials and collect heroes from both sides of the Force. Start with Light Side Battle 1-A.</p>
    <button class="btn wide" data-act="startGame">Begin</button>
    <p class="tiny dim">Unofficial fan game. Not affiliated with Lucasfilm, Disney, EA or Capital Games.</p>
  </div>`);
}
function start(data) {
  S = (data && data.save) || load() || newSave();
  tickTimers();
  route(S.seenIntro ? "home" : "home");
  if (!S.seenIntro) introModal();
  setInterval(() => {
    if (BT.on) { tickTimers(); return; }
    const sig = () => [S.energy, S.arena.attempts, Date.now() - S.bronzeTime >= BRONZE_MS, Date.now() - S.arena.payTime >= PAYOUT_MS].join("|");
    const before = sig();
    tickTimers();
    const now = Date.now(), A = S.arena;
    if (before !== sig()) { save(); if (!$("#modal").innerHTML && UI.view !== "squad") rerender(); else renderTop(); }
    for (const el of $$("[data-cd]")) {
      const left = { bronze: BRONZE_MS - (now - S.bronzeTime), att: ARENA_MS - (now - A.aTime), pay: PAYOUT_MS - (now - A.payTime) }[el.dataset.cd];
      el.textContent = dur(Math.max(0, left));
    }
    const pill = $("#topbar .pill span"); if (pill) pill.innerHTML = `${S.energy}<small>/${maxEnergy(S.lvl)}</small>`;
  }, 1000);
  window.addEventListener("pagehide", () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } });
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: S }));
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot && window.claude.hot.data || {});
</script>
</body>
