<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Arknights Tactics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Resource bar on top, a scrolling holotable view in the middle,
   a five-tab nav at the bottom; battles open as a full-screen overlay. Single dark "deep space" look. */
:root{
  --space:#05080f; --hull:#0b1220; --hull2:#111a2d; --hull3:#18233d; --line:#223150; --line2:#34476f;
  --text:#e8edf7; --dim:#8f9bb6; --faint:#5b6886;
  --gold:#f2c14e; --gold2:#b8862a; --gold-ink:#1b1305; --holo:#5fd4ff;
  --ls:#4aa3ff; --ls-deep:#0f2a52; --ds:#ff4b4b; --ds-deep:#4a0d16;
  --hp:#3ddc84; --prot:#d7deec; --tm:#5fd4ff;
  --buff:#43d67e; --debuff:#ff5c5c; --crit:#ffd34d; --heal:#5dfc9b;
  --g1:#a3adc2; --g2:#4fd17f; --g3:#3fa7ff; --g4:#b26bff; --g5:#f2c14e;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow Semi Condensed","Segoe UI",Roboto,Arial,sans-serif;
  --cut:10px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box;background:var(--space)}
body{height:100%;margin:0;background:var(--space);color:var(--text);font:15px/1.35 var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}

/* ---------- app shell ---------- */
#app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;position:relative;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 72% 9%,#fff6 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 42%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 33% 63%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 85%,#fff6 50%,transparent 51%),
    radial-gradient(120% 60% at 50% -10%,#16264a 0%,transparent 60%),
    var(--space)}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:linear-gradient(180deg,#0d1730,#0a1222);border-bottom:1px solid var(--line)}
.me{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.me-badge{width:34px;height:34px;flex:none;display:grid;place-items:center;font:800 15px var(--f-display);color:var(--gold-ink);
  background:linear-gradient(135deg,var(--gold),var(--gold2));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.me-name{font:700 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-xp{height:3px;background:var(--hull3);margin-top:3px;width:80px;max-width:100%}
.me-xp i{display:block;height:100%;background:var(--holo)}
.res{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;background:var(--hull2);border:1px solid var(--line);border-radius:999px;
  font:700 13px var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px;flex:none}
.pill small{font:500 10px var(--f-body);color:var(--dim)}
#view{overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#080e1b;border-top:1px solid var(--line)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--faint);
  font:700 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;position:relative}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--gold)}
#tabs button.on::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dot{position:absolute;top:5px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--ds);box-shadow:0 0 6px var(--ds)}

/* ---------- type ---------- */
h1,h2,h3{margin:0;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;text-wrap:balance;line-height:1.05}
h1{font-size:30px;font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:15px;font-weight:700}
.eyebrow{font:700 11px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--holo)}
.dim{color:var(--dim)} .small{font-size:12.5px} .tiny{font-size:11px}
.ls{color:var(--ls)} .ds{color:var(--ds)} .gold{color:var(--gold)}
p{margin:0}

/* ---------- surfaces ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel{background:var(--hull);border:1px solid var(--line);padding:12px;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.sub{background:var(--hull2);border:1px solid var(--line);border-radius:6px;padding:10px}
.divider{height:1px;background:var(--line);margin:2px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border:1px solid var(--line2);border-radius:999px;font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--hull)}
.chip.on{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.chip:disabled{opacity:.35}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font:700 10.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--hull3);color:var(--dim)}
.tag.ls{background:color-mix(in srgb,var(--ls) 18%,transparent);color:var(--ls)}
.tag.ds{background:color-mix(in srgb,var(--ds) 18%,transparent);color:var(--ds)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;
  font:800 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);
  background:linear-gradient(180deg,#ffd877,var(--gold) 45%,var(--gold2));
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:filter .12s,transform .08s}
.btn:active{transform:translateY(1px);filter:brightness(.92)}
.btn.blue{color:#04121f;background:linear-gradient(180deg,#9be6ff,var(--holo) 45%,#2a8fbf)}
.btn.ghost{color:var(--text);background:var(--hull3);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.red{color:#fff;background:linear-gradient(180deg,#ff7b7b,var(--ds) 50%,#a51e2a)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{filter:grayscale(1) brightness(.55);pointer-events:none}
.cost{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.cost svg{width:14px;height:14px}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;padding:18px 16px 16px;min-height:150px;
  background:radial-gradient(90% 120% at 100% 0%,#1d3c78 0%,transparent 60%),radial-gradient(70% 90% at 0% 100%,#4a1020 0%,transparent 60%),var(--hull)}
.hero h1{font-size:38px;line-height:.9;letter-spacing:.04em}
.hero h1 span{display:block;color:var(--gold);font-size:22px;letter-spacing:.32em}
.gp{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.gp b{font:800 26px var(--f-display);color:var(--holo);font-variant-numeric:tabular-nums}
.hero-art{position:absolute;right:-30px;bottom:-8px;width:230px;max-width:62%;opacity:.95;pointer-events:none}
.hero > *{position:relative}
.hero .hero-art{position:absolute}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:96px;padding:12px;
  background:var(--hull2);border:1px solid var(--line);overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.tile h3{font-size:17px}
.tile .tsub{font-size:12px;color:var(--dim)}
.tile .ticon{position:absolute;right:8px;top:8px;width:40px;height:40px;opacity:.85}
.tile .ticon svg{width:100%;height:100%}
.tile:disabled{opacity:.45}
.tile{color:var(--text)}
.tile.ls-t{background:linear-gradient(140deg,var(--ls-deep),var(--hull2) 70%)}
.tile.ds-t{background:linear-gradient(140deg,var(--ds-deep),var(--hull2) 70%)}
.tile.wide{grid-column:1/-1;min-height:74px}
.tile .badge{position:absolute;left:12px;top:10px}
.hint{color:var(--text);text-align:left;display:flex;gap:10px;align-items:center;padding:10px 12px;border-left:3px solid var(--holo);background:linear-gradient(90deg,#0f2840,transparent)}

/* ---------- portraits ---------- */
.pt{position:relative;width:var(--s,72px);flex:none;text-align:center}
.pt .ring{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;padding:3px;background:var(--gc,var(--g1));
  box-shadow:0 0 0 1px #0008,0 0 12px color-mix(in srgb,var(--gc,var(--g1)) 35%,transparent)}
.pt .ring img{display:block;width:100%;height:100%;border-radius:50%;pointer-events:none}
.pt .lv{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);min-width:22px;padding:0 4px;height:18px;border-radius:9px;
  background:#0a0f1c;border:1px solid var(--gc,var(--g1));font:800 11px/16px var(--f-display);color:var(--text)}
.stars{display:flex;justify-content:center;gap:0;height:11px;margin-bottom:2px}
.stars svg{width:11px;height:11px}
.pt.locked .ring{filter:grayscale(1) brightness(.45)}
.pt .zeta{position:absolute;right:-2px;top:12px}
.pname{margin-top:9px;font:700 12px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;text-align:center;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.2em}
.shardbar{height:6px;margin-top:5px;background:var(--hull3);border-radius:3px;overflow:hidden}
.shardbar i{display:block;height:100%;background:linear-gradient(90deg,var(--holo),#a7ecff)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 10px}
.rcell{display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;border-radius:8px}
.rcell .pt{--s:72px}
.rcell .pw{font:600 11px var(--f-body);color:var(--dim);font-variant-numeric:tabular-nums}
.rcell.ready{background:radial-gradient(60% 50% at 50% 35%,#5fd4ff33,transparent)}
.rcell.sel{background:var(--hull3);box-shadow:inset 0 0 0 2px var(--gold)}
.rcell.dis{opacity:.35}

/* ---------- character sheet ---------- */
.sheet-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.sheet-top .pt{--s:112px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.statgrid div{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.statgrid b{font-variant-numeric:tabular-nums}
.ab{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.abicon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;font:800 13px var(--f-display);color:var(--text);
  background:radial-gradient(circle at 35% 30%,var(--hull3),#060a14);border:2px solid var(--line2)}
.abicon.special{border-color:var(--holo)} .abicon.unique{border-color:var(--g4)} .abicon.leader{border-color:var(--gold)}
.abicon svg{width:24px;height:24px}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:5px;background:var(--hull3);border-radius:1px}
.pips i.on{background:var(--holo)}
.pips i.on.om{background:var(--gold)}
.bar{height:8px;background:var(--hull3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--holo),#b3f0ff)}
.gear-name{font:800 18px var(--f-display);letter-spacing:.06em}

/* ---------- campaign ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{padding:10px 6px;font:800 14px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--hull)}
.seg button.on.lsb{background:linear-gradient(180deg,#2765b6,#173d73);color:#fff}
.seg button.on.dsb{background:linear-gradient(180deg,#b3262f,#5e0f17);color:#fff}
.chap-head{padding:14px;position:relative;overflow:hidden}
.chap-head .cnum{position:absolute;right:10px;top:-6px;font:800 76px var(--f-display);opacity:.12;line-height:1}
.nodes{display:flex;flex-direction:column;gap:10px;position:relative}
.nodes::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:2px;background:repeating-linear-gradient(180deg,var(--line2) 0 6px,transparent 6px 10px)}
.node{position:relative;display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px 8px 0;
  background:var(--hull);border:1px solid var(--line);border-radius:8px}
.node.locked{opacity:.4}
.node .nid{position:relative;z-index:1;justify-self:center;width:40px;height:40px;display:grid;place-items:center;font:800 15px var(--f-display);
  background:var(--hull3);border:2px solid var(--line2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.node.boss .nid{background:linear-gradient(135deg,var(--ds),#6c0f19);border:0;color:#fff}
.node.next .nid{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink)}
.node .ntitle{font:700 14px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.minis{display:flex;gap:3px;margin-top:4px}
.minis .pt{--s:26px}
.minis .pt .ring{padding:1.5px}
.nstars{display:flex;gap:1px}
.nstars svg{width:14px;height:14px}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:#02040acc;backdrop-filter:blur(3px);
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#modal .mbox{width:100%;max-width:520px;max-height:calc(100% - 40px);overflow:auto;background:var(--hull);border:1px solid var(--line2);padding:16px;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;
  align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{padding:9px 14px;background:#0d1a30f0;border:1px solid var(--holo);color:var(--text);font:600 14px var(--f-body);border-radius:6px;
  box-shadow:0 8px 24px #000a;animation:tin .25s ease-out}
.toast.gold{border-color:var(--gold)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.rewards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rw{display:flex;flex-direction:column;align-items:center;gap:3px;width:70px;font:700 12px var(--f-display);text-align:center}
.rw .ri{width:54px;height:54px;display:grid;place-items:center;border-radius:10px;background:var(--hull2);border:1px solid var(--line2)}
.rw .ri svg{width:30px;height:30px}
.ri{display:grid;place-items:center;border-radius:10px;background:var(--hull2);border:1px solid var(--line2)}
.ri svg{width:70%;height:70%}
.rw .pt{--s:54px}

/* ---------- squad select ---------- */
.squad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 8px 12px;background:var(--hull2);border:1px solid var(--line);border-radius:8px}
.slot{display:flex;flex-direction:column;align-items:center;position:relative}
.slot .pt{--s:min(66px,17vw)}
.slot .empty{width:min(66px,17vw);aspect-ratio:1;border-radius:50%;border:2px dashed var(--line2);margin-top:13px}
.slot .crown{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:20px;height:14px;z-index:2}
.leadtxt{padding:10px 12px;border-left:3px solid var(--gold);background:linear-gradient(90deg,#2b2108,transparent)}

/* ---------- battle (canvas scene + DOM HUD) ---------- */
#battle{position:fixed;inset:0;z-index:40;background:#000;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bwrap{position:relative;width:100%;height:100%;overflow:hidden;touch-action:manipulation}
#bcv{position:absolute;inset:0;display:block;touch-action:none}
.btop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:8px 12px;background:linear-gradient(180deg,#000a,transparent);pointer-events:none}
.btop > *{pointer-events:auto}
.bt-title{flex:1;min-width:0;line-height:1.05;text-shadow:0 1px 3px #000}
.bt-title small{display:block;font:600 10.5px var(--f-body);color:#c9d3e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-title b{font:800 15px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.tog{min-width:44px;height:34px;padding:0 10px;border:1px solid #ffffff40;border-radius:6px;background:#0b1220cc;font:800 13px var(--f-display);letter-spacing:.06em;color:var(--text)}
.tog.on{background:var(--holo);color:#03131f;border-color:var(--holo)}
.bban{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
.bban.show{opacity:1;transform:none}
.bban small{display:block;font:700 12px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:#d8e2f2;text-shadow:0 1px 4px #000}
.bban b{display:inline-block;margin-top:2px;padding:2px 26px;font:800 clamp(24px,7vw,40px)/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  background:linear-gradient(90deg,transparent,#000b 18%,#000b 82%,transparent);text-shadow:0 0 18px #f2c14e88}
.bban.ls b{color:#bfe0ff;text-shadow:0 0 18px #4aa3ffaa} .bban.ds b{color:#ffc2c2;text-shadow:0 0 18px #ff4b4baa}
.bctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:10px 14px 14px;
  background:linear-gradient(0deg,#000d 30%,transparent);min-height:96px;pointer-events:none}
.bctl > *{pointer-events:auto}
.bwho{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.bpt{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);flex:none;box-shadow:0 0 14px #f2c14e66}
.bwn{min-width:0}
.bwn b{display:block;font:800 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bwn small{display:block;font-size:11px;color:#b9c4d8}
.babs{display:flex;gap:12px;padding-bottom:12px}
.abtn{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,#2b3d63,#070c18);border:2px solid #9aa4b8;box-shadow:0 4px 14px #000a;transition:transform .1s}
.abtn.special{border-color:var(--holo);box-shadow:0 0 14px #5fd4ff55,0 4px 14px #000a}
.abtn:active{transform:scale(.93)}
.abtn.off{filter:grayscale(.7)}
.abtn svg{width:30px;height:30px}
.abtn .cdv{position:absolute;inset:0;border-radius:50%;background:#000b;display:grid;place-items:center;font:800 24px var(--f-display);color:#fff}
.abtn .alabel{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font:700 9.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:#c9d3e6;white-space:nowrap}
.bwait{font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#c9d3e6}
.bpop{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:#000a}
.bpopbox{width:100%;max-width:400px;max-height:90%;overflow:auto;background:var(--hull);border:1px solid var(--line2);padding:16px;

.banner-card{position:relative;overflow:hidden;min-height:220px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  background:radial-gradient(90% 90% at 80% 30%,#5a2a10,transparent 70%),linear-gradient(160deg,#141c30,#0a1020)}

.gcv{position:absolute;inset:0;width:100%;height:100%}
.ggrid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:520px}

  box-shadow:0 0 16px color-mix(in srgb,var(--rc,#4aa3ff) 55%,transparent);animation:cardin .45s backwards}
.gcard img{position:absolute;left:50%;bottom:0;height:96%;transform:translateX(-50%);object-fit:contain}

.turnstrip{position:absolute;left:0;right:0;top:52px;display:flex;gap:4px;padding:0 10px;z-index:3;pointer-events:none}

.skbtn.off{filter:grayscale(.8)}
.skbtn svg{width:28px;height:28px}

@keyframes lines{from{background-position:0 0}to{background-position:-300px 0}}

.mats{display:flex;gap:8px;flex-wrap:wrap}
.mat{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;border-radius:999px;background:var(--hull2);border:1px solid var(--line);font:700 12px var(--f-display);font-variant-numeric:tabular-nums}

}

    passives: f ? (f.passives || []) : +rar >= 6 ? [TPL_PASSIVES[Math.floor(rng() * TPL_PASSIVES.length)]].filter(Boolean) : [],
    runes: f ? f.runes : CLASS_RUNES[cls],
  };
  if (op.leader && op.leader.scope === "Element" && !op.leader.element) op.leader.element = el;
  op.maxElite = op.rar <= 2 ? 0 : op.rar === 3 ? 1 : 2;
  OPS[slug] = op; OP_KEYS.push(slug);
}

function genOpps() {

const SFX = { ctx: null, noise: null };

    else if (kind === "hit") noise(.12, .18, 900);
    else if (kind === "crit") { noise(.2, .28, 1600); osc("square", 300, 90, .2, .05); }
    else if (kind === "boom") { noise(.7, .45, 420); osc("sine", 120, 30, .6, .25); }
    else if (kind === "zap") { for (let k = 0; k < 4; k++) osc("square", 800 + R() * 900, 200 + R() * 300, .07, .03, k * .06); }

    else if (kind === "win") { [392, 523, 659, 784].forEach((f, k) => osc("triangle", f, f, .32, .07, k * .12)); }

}

  addParts([v.home.x, 0, v.home.z], 18, { col: v.team === "A" ? "#9fe0ff" : "#ffb0a0", speed: 30, vy: 200, life: 700, size: 2.2, g: 0, spread: 24 });
}
function cutIn(vu, skillName) {
  const wrap = $(".bwrap"); if (!wrap) return;
  const d = (950 / BT.speed / 1000).toFixed(2) + "s";
  const src = vu.u.isOp ? spriteURL(vu.u.def) : enemyArt(vu.u.key).full;
  const el = document.createElement("div");
  el.className = "cutin"; el.style.setProperty("--ec", elc(vu));
  el.innerHTML = `<div class="band" style="animation-duration:${d}"></div><div class="lines" style="animation-duration:${d}"></div>
    <img src="${src}" alt="" style="animation-duration:${d};${vu.team === "E" ? "left:auto;right:-10%;transform:scaleX(-1)" : ""}">
    <div class="sk" style="animation-duration:${d}"><small>${esc(vu.u.n)}</small><b>${esc(skillName)}</b></div>`;

// ---------- playback ----------
async function gate() { while (BT.paused && BT.on) await new Promise(r => setTimeout(r, 120)); }
async function play(evs) {
  for (let i = 0; i < evs.length; i++) { if (BT.quit || !BT.on) return; await gate(); await handle(evs[i]); }
}
function updateStrip() {
  const el = $("#bStrip"); if (!el || !BT.B) return;
  el.innerHTML = BT.B.predictOrder(7).map(uid => { const u = BT.B.byId(uid); return `<img class="${u.team === "E" ? "en" : ""}" src="${u.isOp ? headURL(u.def) : enemyArt(u.key).head}" alt="">`; }).join("");
}
async function handle(e) {
  const vu = e.u != null ? VU(e.u) : null;
  switch (e.k) {
    case "turn": {
      BT.active = vu;
      if (e.tms) for (const [uid, tm] of e.tms) { const v = VU(uid); if (v) v.tmT = tm; }
      if (vu) { vu.tmT = 0; camTo(twoShot(vu, null), 1.6); }
      updateStrip();
      await bwait(140);
      break;
    }
    case "wave": {
      for (const [uid, v] of BT.vus) if (v.team === "E" && v.dead) BT.vus.delete(uid);
      const list = e.units.map(uid => addVU(BT.B.byId(uid), true));
      await preloadOps(list.filter(v => v.sprite).map(v => v.u.key));
      banner(`Wave ${e.w + 1} / ${BT.B.waves.length}`, "Incoming", "ds");
      BT.letterboxT = 1;
      camTo({ ...BT.home, tx: 200, yaw: BT.home.yaw - .45, dist: BT.home.dist * .75, pitch: .2 }, 2.2);
      await bwait(350); sfx("warp");
      list.forEach((v, k) => { v.spawnT = BT.clock + k * 110; bwait(k * 110).then(() => warpFx(v)); });
      await bwait(1000);
      BT.letterboxT = 0; hideBanner(); camHome(2.4);
      updateStrip();
      await bwait(300);
      break;
    }
    case "act": {
      BT.act = e; if (!vu) break;
      const tv = e.t != null ? VU(e.t) : null;
      if (e.s3) {
        BT.letterboxT = 1; sfx("special");
        cutIn(vu, e.name);
        camTo(focusShot(vu), 5.5);
        setPose(vu, e.anim === "orb" || e.anim === "nova" ? "cast" : "buff", 800);
        auraBurst(vu, elc(vu), false);
        await bwait(950);
      } else if (e.slot === 2) {
        banner(e.name, vu.u.n, vu.team === "A" ? "ls" : "ds");
        camTo(tv && tv !== vu ? twoShot(vu, tv) : focusShot(vu), 3.2);
        await bwait(420);
      } else { camTo(twoShot(vu, tv), 2.4); await bwait(90); }
      if (e.anim === "buff" || e.anim === "heal") {
        const col = e.anim === "heal" ? "#5dfc9b" : "#f2c14e";
        setPose(vu, "buff", 700); sfx(e.anim === "heal" ? "heal" : "special");
        const group = e.tgt === "team" || e.tgt === "aoe_allies" ? [...BT.vus.values()].filter(v => v.team === vu.team && !v.dead) : tv ? [tv] : [vu];
        if (group.length > 1) camTo({ ...BT.home, tx: avg(group.map(v => v.pos.x)), dist: fitDist(420, 460), yaw: BT.home.yaw + vu.dir * .25, pitch: .2 }, 3);
        if (e.tgt === "ally_single" && tv && tv !== vu) BT.bolts.push({ from: tipW(vu), to: chestW(tv), t0: BT.clock, dur: 260, col, len: .9, w: 1.4 });
        for (const v of group) auraBurst(v, col);
        await bwait(600);
      }
      break;
    }
    case "atk": await doAttack(e); break;
    case "dmg": {
      if (!vu) break;
      const lostHp = e.hp < vu.hp;
      vu.hp = e.hp; vu.sh = e.sh;
      floatText(e.u, fmtFull(e.n), e.crit ? "crit" : e.dot ? "dot" : e.glance ? "prot" : lostHp ? "dmg" : "prot");
      if (e.glance) floatText(e.u, "GLANCING", "txt");
      if (e.dot) { addParts(chestW(vu), 8, { col: "#ff8a3a", speed: 50, vy: 40, life: 600, size: 2.6, g: -30 }); await bwait(300); break; }
      vu.flash = BT.clock + 160;
      if (vu.hp > 0) setPose(vu, "hit", 340);
      if (e.crit) { BT.shake = Math.max(BT.shake, 9); sfx("crit"); } else sfx("hit");
      await bwait(45);
      break;
    }
    case "heal": {
      if (!vu) break;
      vu.hp = e.hp; vu.sh = e.sh;
      floatText(e.u, "+" + fmtFull(e.n), e.isShield ? "prot" : "heal");
      addParts([vu.pos.x, 30, vu.pos.z], 8, { col: e.isShield ? "#c8ffd6" : "#5dfc9b", speed: 30, vy: 90, life: 700, size: 2.2, g: -10, spread: 30 });
      await bwait(60);
      break;
    }
    case "txt": if (vu) { floatText(e.u, e.s, e.c); await bwait(e.s === "STUNNED" ? 420 : 70); } break;
    case "fx": if (vu) { vu.effs = e.list; vu.sh = e.sh; vu.stealth = e.list.some(x => x[0] === "STEALTH"); } break;
    case "tm": if (vu) { vu.tmT = e.tm; if (!e.quiet && e.v >= 20) floatText(e.u, `+${Math.round(e.v)}% ATB`, "txt"); else if (!e.quiet && e.v <= -10) floatText(e.u, `${Math.round(e.v)}% ATB`, "debuff"); } updateStrip(); break;
    case "death": {
      if (!vu) break;
      vu.dead = true; vu.deathT = BT.clock; vu.hp = 0; vu.sh = 0; vu.effs = [];
      addParts(chestW(vu), 26, { col: vu.team === "A" ? "#9fd8ff" : "#ffb0a0", speed: 90, vy: 60, life: 1100, size: 2.4, g: -40, spread: 26 });
      BT.shake = Math.max(BT.shake, 5);
      if (BT.target === vu) BT.target = null;
      updateStrip();
      await bwait(220);
      break;
    }
    case "revive": {
      if (!vu) break;
      vu.dead = false; vu.gone = false; vu.hp = e.hp; vu.lag = e.hp; vu.sh = 0; vu.effs = [];
      if (!e.inPlace) { vu.pos.x = vu.home.x; vu.pos.z = vu.home.z; vu.spawnT = BT.clock; }
      warpFx(vu); auraBurst(vu, "#ffd76b"); floatText(e.u, "REVIVED", "buff");
      updateStrip();
      await bwait(500);
      break;
    }
    case "end": {
      await returnHome();
      if (BT.letterboxT) { BT.letterboxT = 0; }
      hideBanner(); camHome(2.4); BT.act = null;
      await bwait(130);
      break;
    }
  }
}
async function doAttack(e) {
  const a = VU(e.a), ts = e.t.map(VU).filter(v => v && !v.dead);
  if (!a || a.dead || !ts.length) return;
  const main = ts[0], sp = e.sp, col = elc(a), first = !e.h;
  switch (e.anim) {
    case "melee": {
      await engage(a, main);
      if (sp && first) camTo(impactShot(a, main), 5);
      setPose(a, "swing", e.n > 2 ? 300 : 420); sfx("saber");
      await bwait(e.n > 2 ? 140 : 200);
      slashAt(main, col, sp); sparks(main, col);
      if (sp) BT.shake = Math.max(BT.shake, 6);
      break;
    }
    case "spin": {
      if (first) { await moveTo(a, avg(ts.map(t => t.home.x)) - a.dir * 100, 0, 1.2); if (sp) camTo(aoeShot(ts, a), 4); }
      a.spin = BT.clock; setPose(a, "swing", 520); sfx("saber");
      await bwait(260);
      for (const t of ts) { slashAt(t, col, true); sparks(t, col, 8); }
      BT.shake = Math.max(BT.shake, 7);
      bwait(260).then(() => { a.spin = null; });
      break;
    }
    case "shoot": {
      if (sp && first) camTo(impactShot(a, main), 4);
      setPose(a, "shoot", 260);
      await bwait(40);
      await fireBolt(a, main, { col, sound: "blaster", speed: 3 });
      break;
    }
    case "volley": {
      if (first && sp) camTo(aoeShot(ts, a), 4);
      setPose(a, "shoot", 300);
      await Promise.all(ts.map(async (t, k) => { await bwait(k * 70); await fireBolt(a, t, { col, speed: 3 }); }));
      break;
    }
    case "orb": {
      if (sp && first) camTo(impactShot(a, main), 4);
      setPose(a, "cast", 520);
      await bwait(150);
      await fireBolt(a, main, { col, len: .14, w: 2.6, speed: 1.7, big: true, sound: "zap" });
      BT.rings.push({ x: main.pos.x, z: main.pos.z, r0: 8, r1: 60, t0: BT.clock, dur: 400, col, w: 4 });
      break;
    }
    case "nova": {
      if (first) { setPose(a, "cast", 900); if (sp) camTo(aoeShot(ts, a), 4); await bwait(180); }
      const cx = avg(ts.map(t => t.pos.x)), cz = avg(ts.map(t => t.pos.z));
      if (first) { BT.rings.push({ x: cx, z: cz, r0: 30, r1: 260, t0: BT.clock, dur: 520, col, w: 5 }); sfx("boom"); }
      else sfx("zap");
      await bwait(first ? 260 : 120);
      for (const t of ts) { addParts([t.pos.x, 4, t.pos.z], 18, { col, speed: 60, vy: 260, life: 560, size: 3.2, g: 80, spread: 20 }); slashAt(t, col, false); }
      if (first) { BT.flash = .35; BT.flashCol = col; BT.shake = Math.max(BT.shake, 10); }
      break;
    }
    default: { setPose(a, "shoot", 300); await fireBolt(a, main, { col }); }
  }
}

// ---------- HUD ----------
function skillIcon(u, sk) {
  if (!sk) return IC.boost;
  const ef = sk.effects || [];
  if (sk.target === "ally_single" || ef.some(e => /heal|revive/.test(e.type))) return IC.heal;
  if (ef.some(e => e.what === "TAUNT" || e.type === "shieldCasterHP")) return IC.shield;
  if (sk.target === "self" || sk.target === "team" || sk.target === "aoe_allies") return IC.boost;
  if (u.cls === "Sniper") return IC.bow;
  if (MELEE.has(u.cls)) return IC.sword;
  return IC.orb;
}
function banner(name, sub, cls) { const b = $("#bBan"); if (!b) return; b.className = "bban show " + (cls || ""); b.innerHTML = `<small>${esc(sub)}</small><b>${esc(name)}</b>`; }
function hideBanner() { const b = $("#bBan"); if (b) b.className = "bban"; }
function hideControls(txt = "") { BT.picking = false; BT.allyPick = null; const c = $("#bCtl"); if (c) c.innerHTML = txt ? `<div class="bwait">${txt}</div>` : ""; }
function showControls(u) {

  c.innerHTML = `<div class="bwho"><img class="bpt" src="${headURL(u.def)}" alt=""><div class="bwn"><b>${esc(u.n)}</b><small id="bHint">Tap an enemy to target · hold for details</small></div></div>
    <div class="babs">${[1, 2, 3].map(slot => {
      const sk = u.skills.find(s => s.slot === slot); if (!sk) return "";

      r({ slot, t: sk.target === "enemy" && BT.target ? BT.target.u : null });
    }, () => popup(skillPop(u, sk)));
  }
}

function press(el, onTap, onHold) {
  let timer = 0, held = false, sx = 0, sy = 0;
  el.addEventListener("pointerdown", ev => { held = false; sx = ev.clientX; sy = ev.clientY; clearTimeout(timer); timer = setTimeout(() => { held = true; onHold && onHold(ev); }, 430); });
  el.addEventListener("pointermove", ev => { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 12) clearTimeout(timer); });
  el.addEventListener("pointerup", ev => { clearTimeout(timer); if (!held) onTap(ev); });
  el.addEventListener("pointercancel", () => clearTimeout(timer));
  el.addEventListener("contextmenu", ev => ev.preventDefault());
}
function unitAt(x, y) {
  let best = null, bd = 1e9;
  for (const vu of BT.vus.values()) {
    if (!vu.scr || vu.dead || vu.gone) continue;
    const s = vu.scr.s, top = vu.scr.y + ((vu.out && (vu.out.top || vu.out.head) ? (vu.out.top || vu.out.head)[1] : -100)) * s;
    const half = Math.max(26, (vu.sprite ? 124 * vu.asp * .4 : 30)) * s;
    if (x > vu.scr.x - half - 6 && x < vu.scr.x + half + 6 && y > top - 10 && y < vu.scr.y + 10) {
      const d = Math.abs(x - vu.scr.x) + Math.abs(y - (top + vu.scr.y) / 2) * .5;
      if (d < bd) { bd = d; best = vu; }
    }
  }
  return best;
}

function addVU(u, hidden) {
  const slot = SLOTS[u.slot % SLOTS.length], dir = u.team === "A" ? 1 : -1;
  const vu = { uid: u.uid, u, team: u.team, dir, face: dir, home: { x: -dir * slot[0], z: slot[1] }, pos: { x: -dir * slot[0], z: slot[1] }, y: 0,
    bs: u.boss ? 1.22 : 1, pose: { name: "idle", t0: 0, dur: 0 }, ph: R() * 6, hp: u.hp, lag: u.hp, sh: u.shield, tm: u.atb, tmT: u.atb,
    effs: [], stealth: false, dead: false, gone: false, trail: [], spawnT: hidden ? 1e15 : null, out: null,
    sprite: u.isOp, img: u.isOp ? opImg(u.def) : null, asp: u.isOp ? u.def.asp : 1 };
  BT.vus.set(u.uid, vu);
  return vu;
}
function sizeCanvas() {
  const cv = BT.cv; if (!cv) return;
  const r = cv.parentElement.getBoundingClientRect();
  BT.dpr = Math.min(2, window.devicePixelRatio || 1);
  BT.W = Math.max(200, r.width); BT.H = Math.max(200, r.height);
  cv.width = Math.round(BT.W * BT.dpr); cv.height = Math.round(BT.H * BT.dpr);
  cv.style.width = BT.W + "px"; cv.style.height = BT.H + "px";
  const old = BT.home;
  BT.home = fitHome();
  if (!old) { BT.cam = { ...BT.home }; BT.camT = { ...BT.home }; }
  else if (!BT.act) Object.assign(BT.camT, BT.home);
}

// ---------- dialogue ----------
// Layered silhouette backdrop per environment (skyline, ruins, peaks), seeded so a scene always looks the same.
function sceneSVG(env) {
  const th = mapTheme(env), rng = seeded(hash(env + "scene")), snow = env === "snow";
  const sky = { ruins: ["#1a0806", "#6a2412", "#e0703a"], city: ["#03050d", "#141a44", "#4a3478"], slums: ["#140e14", "#4a3040", "#d8965a"], snow: ["#3a5070", "#8aa8c8", "#e8f2ff"] }[env] || ["#03050d", "#141a44", "#4a3478"];
  const layer = (base, h0, h1, col, jag, lit) => {
    let x = -10, out = "";
    while (x < 410) {
      const w = 16 + rng() * 42, h = h0 + rng() * (h1 - h0);
      if (snow) { const pk = x + w * (.3 + rng() * .4); out += `<polygon points="${x - 30},${base} ${pk},${base - h * 1.3} ${x + w + 30},${base}" fill="${col}"/>`; }
      else if (jag) out += `<polygon points="${x},${base + 300} ${x},${base - h} ${x + w * .3},${base - h + 8 + rng() * 22} ${x + w * .55},${base - h - 6} ${x + w * .8},${base - h + 14 + rng() * 26} ${x + w},${base - h + rng() * 30} ${x + w},${base + 300}" fill="${col}"/>`;
      else out += `<rect x="${x}" y="${base - h}" width="${w}" height="${h + 300}" fill="${col}"/>`;
      if (lit) for (let k = 0; k < 6; k++) if (rng() < .5) out += `<rect x="${x + 3 + rng() * (w - 8)}" y="${base - h + 6 + rng() * (h - 12)}" width="2.5" height="3.5" fill="${lit}" opacity="${.35 + rng() * .5}"/>`;
      x += w + (snow ? 10 : rng() * 6);
    }
    return out;
  };
  let fx = "";
  for (let k = 0; k < 40; k++) fx += snow ? `<circle cx="${rng() * 400}" cy="${rng() * 800}" r="${.8 + rng() * 2.2}" fill="#fff" opacity="${.3 + rng() * .5}"/>`
    : env === "city" ? (k < 30 ? `<circle cx="${rng() * 400}" cy="${rng() * 380}" r="${rng() * 1.2 + .3}" fill="#fff" opacity="${.2 + rng() * .6}"/>` : "")
    : `<circle cx="${rng() * 400}" cy="${200 + rng() * 520}" r="${.8 + rng() * 1.8}" fill="${th.c}" opacity="${.25 + rng() * .5}"/>`;
  const jag = env === "ruins" || env === "slums";
  return `<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" style="position:absolute;inset:0;width:100%;height:100%">
    <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset=".55" stop-color="${sky[1]}"/><stop offset=".78" stop-color="${sky[2]}"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".7" r=".5"><stop offset="0" stop-color="${th.c}" stop-opacity=".35"/><stop offset="1" stop-color="${th.c}" stop-opacity="0"/></radialGradient></defs>
    <rect width="400" height="800" fill="url(#sk)"/><rect width="400" height="800" fill="url(#gl)"/>
    ${env === "city" ? `<circle cx="300" cy="170" r="26" fill="#e8f0ff" opacity=".85"/>` : env === "ruins" ? `<circle cx="110" cy="420" r="34" fill="#ffb08a" opacity=".5"/>` : ""}
    <g opacity=".55">${layer(560, 120, 320, snow ? "#7f98b8" : th.b, jag, env === "city" ? "#ffd76b" : null)}</g>
    <g>${layer(610, 60, 200, snow ? "#5a7090" : "#05070c", jag, env === "city" || env === "slums" ? (env === "city" ? "#5fd4ff" : "#ffb050") : null)}</g>
    <rect y="600" width="400" height="200" fill="${snow ? "#d8e4f0" : "#05070c"}"/>${fx}
    <rect width="400" height="800" fill="url(#gl)" opacity=".5"/></svg>`;
}
function playScene(lines, title, env) {
  return new Promise(resolve => {
    const root = $("#dlg"), th = mapTheme(env);
    root.innerHTML = `<div class="dwrap">
      <div class="dbg" style="background:${th.b}">${sceneSVG(env)}</div>
      <img class="dchar left" id="dL" alt="" hidden><img class="dchar right" id="dR" alt="" hidden>
      <div class="dtop"><span class="ttl">${esc(title || "")}</span><div class="row"><button class="tog" id="dAuto">AUTO</button><button class="tog" id="dSkip">SKIP</button></div></div>
      <div class="dbox" id="dBox"><div class="dname" id="dName" hidden></div><div class="dtext" id="dText"></div><div class="dnext" id="dNext" hidden></div></div>
    </div>`;
    root.hidden = false;
    let i = -1, typing = 0, full = "", auto = false, timer = 0, autoT = 0;
    const L = $("#dL"), Rr = $("#dR"), side = {};
    const done = () => { clearInterval(timer); clearTimeout(autoT); root.hidden = true; root.innerHTML = ""; resolve(); };
    const showLine = () => {
      i++; if (i >= lines.length) return done();
      const ln = lines[i], sp = SPK[ln.s] || { n: ln.s };
      const nm = $("#dName"); nm.hidden = !sp.n; nm.textContent = sp.n || "";
      $("#dBox").classList.toggle("dnarr", ln.s === "narr");
      const art = sp.op ? spriteURL(OPS[sp.op]) : sp.en ? enemyArt(sp.en).full : null;
      if (art) {
        const isRight = !!sp.en, img = isRight ? Rr : L;
        if (side[isRight ? "R" : "L"] !== ln.s) { img.classList.add("enter"); img.src = art; img.hidden = false; side[isRight ? "R" : "L"] = ln.s; requestAnimationFrame(() => requestAnimationFrame(() => img.classList.remove("enter"))); }
        if (isRight) img.style.transform = "scaleX(-1)";
        L.classList.toggle("dim", isRight); Rr.classList.toggle("dim", !isRight);
      } else { L.classList.add("dim"); Rr.classList.add("dim"); }
      full = ln.t; let n = 0; const tx = $("#dText"); tx.textContent = ""; $("#dNext").hidden = true;
      clearInterval(timer);
      typing = 1;
      timer = setInterval(() => { n += 2; tx.textContent = full.slice(0, n); if (n >= full.length) { clearInterval(timer); typing = 0; $("#dNext").hidden = false; if (auto) autoT = setTimeout(showLine, 1100 + full.length * 18); } }, 22);
    };
    root.onclick = ev => {
      if (ev.target.closest("#dSkip")) return done();
      if (ev.target.closest("#dAuto")) { auto = !auto; $("#dAuto").classList.toggle("on", auto); if (auto && !typing) showLine(); return; }
      clearTimeout(autoT);
      if (typing) { clearInterval(timer); typing = 0; $("#dText").textContent = full; $("#dNext").hidden = false; if (auto) autoT = setTimeout(showLine, 1200); }
      else showLine();
    };
    showLine();
  });
}

function gachaReveal(results) {
  return new Promise(resolve => {
    const top = Math.max(...results.map(r => OPS[r.key].rar));
    const root = $("#gacha");
    root.innerHTML = `<div class="gwrap"><canvas class="gcv" id="gcv"></canvas><div class="gtitle" id="gT"><div class="eyebrow">Headhunting</div><h1>Signal detected</h1><p class="small dim">Tap to reveal</p></div><div class="ggrid" id="gG" hidden></div><button class="btn" id="gDone" hidden>Done</button></div>`;
    root.hidden = false;
    const cv = $("#gcv"), g = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
    const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; g.scale(dpr, dpr);
    const col = RC[top], stars = [];
    for (let k = 0; k < 90; k++) stars.push({ x: R() * W, y: R() * H, v: 2 + R() * 9, l: 20 + R() * 80 });
    let run = true;
    const loop = () => {
      if (!run || !cv.isConnected) return; requestAnimationFrame(loop);
      g.fillStyle = "rgba(2,4,10,.35)"; g.fillRect(0, 0, W, H);
      g.strokeStyle = col; g.lineWidth = 2; g.globalCompositeOperation = "lighter";
      for (const s of stars) { s.y += s.v; s.x -= s.v * .35; if (s.y > H + 40) { s.y = -40; s.x = R() * W * 1.3; } g.globalAlpha = .5; g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x + s.l * .35, s.y - s.l); g.stroke(); }
      g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    };
    loop(); sfx("special");
    let stage = 0;
    const show = () => {
      stage = 1; $("#gT").hidden = true; const G = $("#gG"); G.hidden = false;
      if (results.length === 1) { G.style.gridTemplateColumns = "1fr"; G.style.maxWidth = "260px"; }
      G.innerHTML = results.map((r, i) => { const op = OPS[r.key]; return `<div class="gcard" style="--rc:${RC[op.rar]};animation-delay:${i * .12}s">${r.isNew ? '<span class="gnew">NEW</span>' : ""}<img src="${spriteURL(op)}" alt="${esc(op.n)}"><span class="gst">${"★".repeat(op.rar)}<br>${esc(op.n)}</span></div>`; }).join("");
      if (top >= 6) sfx("win"); else sfx("heal");
      setTimeout(() => { $("#gDone").hidden = false; stage = 2; }, results.length * 120 + 500);
    };
    root.onclick = ev => {
      if (ev.target.id === "gDone") { run = false; root.hidden = true; root.innerHTML = ""; resolve(); return; }
      if (stage === 0) show();
    };
    setTimeout(() => { if (stage === 0) show(); }, 1600);
  });
}

const convWave = (w, lv) => w.map(s => s.op ? { op: s.op, LV: lv } : { en: s.e, LV: lv + (ENEMY[s.e].boss ? 3 : 0) });
const allySpecs = ids => ids.filter(owned).map(k => ({ op: k, prog: S.ops[k] }));
const recFor = lv => lv < 20 ? "rec1" : lv < 40 ? "rec2" : lv < 60 ? "rec3" : "rec4";
function squadOrToast(mode) {
  const ids = S.team[mode].filter(owned);
  if (!ids.length) { toast("Pick at least one operator."); return null; }
  return ids;
}
function opsXp(ids, xp) { for (const k of ids) opXp(k, xp); return { k: "xp", n: xp }; }
function rollRune(rars, sets) {
  let r = R(), rar = 1;
  for (let i = 0; i < rars.length; i++) { if (r < rars[i]) { rar = i + 1; break; } r -= rars[i]; rar = i + 1; }
  const rune = makeRune(pick(sets), rar); S.runes.push(rune);
  return { k: "rune", n: 1, rune };
}
function teamScreen(mode, title, cost, foes, back, launch) {
  closeModal();
  UI.team = null;
  route("team", { mode, title, cost, foes, from: mode === "story" ? "story" : "battle", back, launch });
}
function needSanity(n) {
  tickTimers();
  if (S.sanity >= n) return true;
  toast("Not enough Sanity."); sanityModal(); return false;
}
// a cleared chapter pays out once; returns the reward list when it just happened
function chapterPayout(ch) {
  if (S.chRw[ch.id] || !chapterCleared(ch)) return null;
  S.chRw[ch.id] = 1;
  return give(ch.reward);
}
function chapterModal(ch, list) {
  const i = STORY[0].chapters.indexOf(ch), nx = STORY[0].chapters[i + 1];
  openModal(`<div class="stack" style="align-items:center;text-align:center">
    <div class="eyebrow">Chapter ${i + 1} complete</div><h2>${esc(ch.title)}</h2>
    ${ch.reward.op ? `<img src="${spriteURL(OPS[ch.reward.op])}" alt="" style="height:200px;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 18px #000)"><p class="small"><b class="gold">${esc(OPS[ch.reward.op].n)}</b> has joined Rhodes Island.</p>` : ""}
    <div class="rewards">${rewardsHTML(list)}</div>
    ${nx ? `<p class="small dim">Chapter ${i + 2}, ${esc(nx.title)}, is now open.</p><button class="btn wide" data-act="chapter" data-c="${nx.id}">Continue</button>` : `<p class="small dim">You have finished Episode 1.</p><button class="btn wide" data-act="closeModal">Close</button>`}
  </div>`);
  sfx("win");
}

// ---------- story ----------
async function readStory(nd) {
  closeModal();
  if (UI.view !== "chapter") route("chapter", nd.ch.id);
  await playScene(nd.pre || [], `${nd.id} ${nd.name}`, nd.ch.env);
  if (nodeStars(nd.id)) return;
  S.story[nd.id] = 1;
  const list = give({ orundum: 30, lmd: 600 });
  rerender();
  const ch = chapterPayout(nd.ch);
  if (ch) chapterModal(nd.ch, ch); else rewardModal("Story complete", list, `${nd.id} ${nd.name}`);
}
async function openChest(nd) {
  closeModal();
  if (nodeStars(nd.id)) return;
  if (UI.view !== "chapter") route("chapter", nd.ch.id);
  if (nd.pre) await playScene(nd.pre, `${nd.id} ${nd.name}`, nd.ch.env);
  S.story[nd.id] = 1;
  const list = give(nd.reward);
  sfx("heal"); rerender();
  const ch = chapterPayout(nd.ch);
  if (ch) chapterModal(nd.ch, ch); else rewardModal("Supplies recovered", list, `${nd.id} ${nd.name}`);
}
function nodeFoes(nd) { return nd.waves.flat().map(s => s.op ? { op: s.op, LV: nd.lv } : { en: s.e, LV: nd.lv }); }
function nodeDrops(nd, first) {
  const lv = nd.lv;
  return first ? { orundum: nd.type === "boss" ? 150 : nd.type === "side" ? 100 : 60, lmd: 80 + lv * 15, [recFor(lv)]: 3 }
    : { lmd: 80 + lv * 15, [recFor(lv)]: 2, summ: 1 };
}
async function launchNode(id) {
  const nd = NODES[id], cost = nodeCost(nd), ids = squadOrToast("story");
  if (!ids || !needSanity(cost)) return;
  const first = !nodeStars(id);
  route("chapter", nd.ch.id);
  if (first && nd.pre && nd.pre.length) await playScene(nd.pre, `${nd.id} ${nd.name}`, nd.ch.env);
  spendSanity(cost); S.stats.battles++; save();
  let chList = null;
  startBattle({
    allies: allySpecs(ids), waves: nd.waves.map(w => convWave(w, nd.lv)), env: nd.ch.env,
    title: nd.name, sub: `${nd.id} · ${nd.ch.title}`,
    onWin(res) {
      const goal = nodeTurnGoal(nd);
      const missions = [{ n: "Win the battle", ok: true }, { n: "No operator falls", ok: !res.lost }, { n: `Win within ${goal} of your turns`, ok: res.turns <= goal }];
      const stars = missions.filter(m => m.ok).length;
      S.story[id] = Math.max(nodeStars(id), stars);
      S.stats.wins++; S.daily.clear++;
      const list = give(nodeDrops(nd, first));
      list.push(opsXp(ids, 50 + nd.lv * 18));
      chList = chapterPayout(nd.ch);
      return { rewards: list, missions };
    },
    onLose() { S.sanity += Math.max(0, cost - 1); return { rewards: [] }; },
    onQuit() { S.sanity += Math.max(0, cost - 1); save(); },
    async onClose(res) {
      if (!res.win) return;
      if (first && nd.post && nd.post.length) await playScene(nd.post, `${nd.id} ${nd.name}`, nd.ch.env);
      rerender();
      if (chList) chapterModal(nd.ch, chList);
    },
    retry: () => launchNode(id),
  });
}
function sweepNode(id, x) {
  const nd = NODES[id], cost = nodeCost(nd) * x, ids = S.team.story.filter(owned);
  if (nodeStars(id) < 3) return;
  if (!needSanity(cost)) return;
  spendSanity(cost);
  let list = [];
  for (let k = 0; k < x; k++) list = list.concat(give(nodeDrops(nd, false)));
  list.push(opsXp(ids, (50 + nd.lv * 18) * x));
  S.daily.clear += x; S.stats.battles += x; S.stats.wins += x;
  closeModal(); rerender();
  rewardModal(`Swept ${x}×`, list, `${nd.id} ${nd.name}`);
}

// ---------- hunts ----------
function huntWaves(h, l) { const lv = HUNT_LV[l - 1]; return h.waves(lv).map(w => convWave(w, lv)); }
function huntDrops(h, l) {
  const list = [];
  for (let k = ri(2, 3); k > 0; k--) list.push(rollRune(HUNT_RAR[l - 1], h.sets));
  return list.concat(give({ lmd: 800 + l * 700, [recFor(HUNT_LV[l - 1])]: 2 }));
}
function launchHunt(id, l) {
  const h = HUNTS.find(x => x.id === id), cost = HUNT_COST[l - 1], ids = squadOrToast("hunt");
  if (!ids || !needSanity(cost)) return;
  route("hunt", id);
  spendSanity(cost); S.stats.battles++; save();
  startBattle({
    allies: allySpecs(ids), waves: huntWaves(h, l), env: h.env, title: h.n, sub: `Hunt · Level ${l}`,
    onWin() {
      S.hunt[id] = Math.max(S.hunt[id] || 0, l); S.stats.wins++; S.daily.clear++;
      const list = huntDrops(h, l); list.push(opsXp(ids, 60 + HUNT_LV[l - 1] * 12));
      return { rewards: list };
    },
    onLose() { S.sanity += Math.max(0, cost - 1); return { rewards: [] }; },
    onQuit() { S.sanity += Math.max(0, cost - 1); save(); },
    retry: () => launchHunt(id, l),
  });
}
function sweepHunt(id, l) {
  const h = HUNTS.find(x => x.id === id), cost = HUNT_COST[l - 1] * 3;
  if ((S.hunt[id] || 0) < l || !needSanity(cost)) return;
  spendSanity(cost);
  let list = [];
  for (let k = 0; k < 3; k++) list = list.concat(huntDrops(h, l));
  list.push(opsXp(S.team.hunt.filter(owned), (60 + HUNT_LV[l - 1] * 12) * 3));
  S.daily.clear += 3; S.stats.battles += 3; S.stats.wins += 3;
  rerender(); rewardModal("Swept 3×", list, `${h.n} · Level ${l}`);
}

// ---------- tower ----------
function launchTower(f) {
  const T = towerFloor(f), ids = squadOrToast("tower");
  if (!ids || f !== S.tower + 1) return;
  route("tower");
  S.stats.battles++;
  startBattle({
    allies: allySpecs(ids), waves: T.waves.map(w => convWave(w, T.lv)), env: T.env, title: `Floor ${f}`, sub: "Tower of Trials",
    onWin() {
      S.tower = Math.max(S.tower, f); S.stats.wins++; S.daily.clear++;
      const list = give(T.reward); list.push(opsXp(ids, 50 + T.lv * 10));
      return { rewards: list };
    },
    retry: () => launchTower(f),
  });
}

// ---------- arena ----------
function launchArena(k) {
  tickTimers();
  const A = S.arena, o = A.opps && A.opps[k], ids = squadOrToast("arena");
  if (!o || !ids) return;
  if (A.attempts <= 0) { toast("No attempts left. One refills every 10 minutes."); return; }
  route("arena");
  if (A.attempts >= 5) A.aTime = Date.now();
  A.attempts--; S.stats.battles++; save();
  startBattle({
    allies: allySpecs(ids), waves: [o.team.map(u => ({ op: u.op, LV: u.LV }))], env: "arena", title: o.name, sub: `Arena · Rank #${o.rank}`,
    onWin() {
      const before = A.rank;
      A.rank = o.rank < A.rank ? o.rank : Math.max(1, A.rank - ri(1, 4));
      S.stats.wins++; S.daily.arena++;
      const list = give({ tokens: 25 }); if (A.rank < before) list.unshift({ k: "rank", n: A.rank });
      genOpps();
      return { rewards: list };
    },
    onLose() { return { rewards: give({ tokens: 5 }) }; },
  });
}

// =====================================================================
//  ACTIONS (event delegation on data-act)
// =====================================================================
function quip() {
  const st = $(".stage"); if (!st) return;
  const key = S.assistant, lines = QUIPS[key] || QUIPS._;
  st.querySelector(".quip") && st.querySelector(".quip").remove();
  const q = document.createElement("div"); q.className = "quip";
  q.innerHTML = `<b>${esc(OPS[key] ? OPS[key].n : "")}</b>${esc(pick(lines))}`;
  st.appendChild(q); sfx("tap");
  const img = st.querySelector(".assist");
  if (img) img.animate([{ transform: "translateX(-50%) translateY(0)" }, { transform: "translateX(-50%) translateY(-10px)" }, { transform: "translateX(-50%) translateY(0)" }], { duration: 360, easing: "ease-out" });
  clearTimeout(quip.t); quip.t = setTimeout(() => q.remove(), 3600);
}
function introModal() {
  openModal(`<div class="stack" style="align-items:center;text-align:center">
    <img src="${spriteURL(OPS.amiya)}" alt="Amiya" style="height:220px;max-width:100%;object-fit:contain;filter:drop-shadow(0 12px 20px #000)">
    <div class="eyebrow">Rhodes Island · Chernobog</div>
    <h1>Arknights<span style="display:block;color:var(--gold);font-size:20px;letter-spacing:.3em">Tactics</span></h1>
    <p class="small dim" style="max-width:36ch">Lead squads of four through the story, fill turn gauges, chain skills, and exploit the element wheel: Fire beats Wind, Wind beats Water, Water beats Fire, and Light and Dark counter each other.</p>
    <button class="btn wide" data-act="introGo">Begin Episode 1</button>
    <p class="tiny dim">Unofficial, non-commercial fan game. Arknights characters and art belong to Hypergryph and Yostar.</p>
  </div>`);
}
const ACT = {
  go: d => { if (d.v === "op" && d.a !== UI.arg) UI.opTab = "info"; closeModal(); route(d.v, d.a || null); },
  poke: () => quip(),
  missions: () => missionsModal(),
  settings: () => settingsModal(false),
  sanity: () => sanityModal(),
  closeModal: () => closeModal(),
  introGo: () => { S.seenIntro = true; closeModal(); route("chapter", "c1"); nodeSheet(NODES["1-1"]); },

  // story
  chapter: d => { closeModal(); route("chapter", d.c); },
  openNode: d => {
    const nd = NODES[d.id];
    if (!nodeOpen(nd)) { toast(nd.type === "side" ? "Clear the node before this side story first." : "Clear the previous node first."); return; }
    if (UI.view !== "chapter" || UI.arg !== nd.ch.id) route("chapter", nd.ch.id);
    nodeSheet(nd);
  },
  startNode: d => {
    const nd = NODES[d.id];
    if (nd.type === "story") return readStory(nd);
    if (nd.type === "chest") return openChest(nd);
    teamScreen("story", `${nd.id} ${nd.name}`, nodeCost(nd), nodeFoes(nd), ["chapter", nd.ch.id], { kind: "node", id: nd.id });
  },
  sweep: d => sweepNode(d.id, +d.x),

  // team select
  teamBack: () => { const b = UI.arg && UI.arg.back; UI.team = null; route(b ? b[0] : "home", b ? b[1] : null); },
  slot: d => {
    const ids = UI.team.ids, k = +d.k;
    if (k === 0) { toast("Tap a selected operator in the list below to remove them."); return; }
    ids.unshift(ids.splice(k, 1)[0]); sfx("tap"); rerender();
  },
  pickTeam: d => {
    const ids = UI.team.ids, i = ids.indexOf(d.k);
    if (i >= 0) ids.splice(i, 1);
    else if (ids.length >= 4) { toast("Your squad is full. Remove someone first."); return; }
    else ids.push(d.k);
    sfx("tap"); rerender();
  },
  deploy: () => {
    const a = UI.arg, L2 = a.launch;
    S.team[a.mode] = UI.team.ids.slice(); save();
    if (L2.kind === "node") launchNode(L2.id);
    else if (L2.kind === "hunt") launchHunt(L2.id, L2.l);
    else if (L2.kind === "tower") launchTower(L2.f);
    else if (L2.kind === "arena") launchArena(L2.k);
  },
  elf: d => { UI.el = d.e; rerender(); },

  // battle hub
  huntLv: d => { UI.huntLv[d.h] = +d.l; rerender(); },
  huntGo: d => {
    const h = HUNTS.find(x => x.id === d.h), l = +d.l;
    teamScreen("hunt", `${h.n} · Level ${l}`, HUNT_COST[l - 1], huntWaves(h, l).flat(), ["hunt", h.id], { kind: "hunt", id: h.id, l });
  },
  huntSweep: d => sweepHunt(d.h, +d.l),
  towerGo: d => { const T = towerFloor(+d.f); teamScreen("tower", `Tower · Floor ${T.f}`, 0, T.waves.map(w => convWave(w, T.lv)).flat(), ["tower", null], { kind: "tower", f: T.f }); },
  arenaGo: d => {
    const o = S.arena.opps[+d.k];
    if (S.arena.attempts <= 0) { toast("No attempts left."); return; }
    teamScreen("arena", `Arena · ${o.name}`, 0, o.team, ["arena", null], { kind: "arena", k: +d.k });
  },
  newOpps: () => { genOpps(); sfx("tap"); rerender(); },
  payout: () => {
    tickTimers();
    if (Date.now() - S.arena.payTime < PAYOUT_MS) return;
    const list = give(payout(S.arena.rank)); S.arena.payTime = Date.now();
    rerender(); rewardModal("Arena payout", list, `Rank #${S.arena.rank}`);
  },

  // operators
  toggleAll: () => { UI.all = !UI.all; rerender(); },
  clsf: d => { UI.cls = d.c; rerender(); },
  sortf: d => { UI.sort = d.s; rerender(); },
  opTab: d => { UI.opTab = d.t; rerender(); },
  skUp: d => { if (skillUp(d.k, +d.i)) { sfx("heal"); toast(`Skill ${+d.i + 1} raised to rank ${S.ops[d.k].sk[+d.i]}.`); } rerender(); },
  rec: d => { const lv = S.ops[d.k].lvl; if (useRecord(d.k, d.it)) { sfx("tap"); if (S.ops[d.k].lvl > lv) { S.daily.upgrade++; toast(`${OPS[d.k].n} reached level ${S.ops[d.k].lvl}.`); } } rerender(); },
  autoLv: d => { const lv = S.ops[d.k].lvl, n = autoLevel(d.k); if (n) { sfx("heal"); if (S.ops[d.k].lvl > lv) S.daily.upgrade++; toast(`Used ${n} records. Level ${lv} → ${S.ops[d.k].lvl}.`); } rerender(); },
  promote: d => { if (promote(d.k)) { sfx("win"); toast(`${OPS[d.k].n} promoted to Elite ${S.ops[d.k].elite}!`, "gold"); } rerender(); },
  assistant: d => { S.assistant = d.k; toast(`${OPS[d.k].n} is now your assistant.`); rerender(); },

  // runes
  runeSheet: d => { const r = runeById(+d.id); if (r) runeSheet(r); },
  equip: d => { equipRune(d.k, +d.s, +d.id); sfx("tap"); rerender(); },
  enhance: d => { const r = runeById(+d.id); if (r && enhanceRune(r)) { sfx("zap"); rerender(); runeSheet(r); } },
  enhanceMax: d => { const r = runeById(+d.id); let n = 0; while (r && enhanceRune(r)) n++; if (n) { sfx("special"); toast(`${r.set} rune enhanced to +${r.lvl}.`); } rerender(); runeSheet(r); },
  unequip: d => { const r = runeById(+d.id); if (r && r.eq) unequipRune(r.eq.k, r.eq.s); rerender(); runeSheet(r); },
  sell: d => { const r = runeById(+d.id); if (!r) return; const v = sellValue(r); sellRune(r); closeModal(); toast(`Sold for ${fmtFull(v)} LMD.`); rerender(); },
  sellJunk: () => { const junk = S.runes.filter(r => !r.eq && r.rar <= 2); let v = 0; for (const r of junk) { v += sellValue(r); sellRune(r); } toast(`Sold ${junk.length} runes for ${fmtFull(v)} LMD.`); rerender(); },
  runeSetF: d => { UI.runeSet = d.s; rerender(); },
  depotTab: d => { UI.depotTab = d.t; rerender(); },

  // headhunt
  hhTab: d => { UI.hhStd = d.std === "1"; rerender(); },
  pull: async d => {
    const n = +d.n;
    if (S.permit >= n) S.permit -= n;
    else if (S.orundum >= 600 * n) S.orundum -= 600 * n;
    else { toast("Not enough Orundum or permits."); return; }
    const res = headhunt(n, !UI.hhStd); save(); renderTop();
    await gachaReveal(res);
    rerender();
  },

  // missions
  claimDaily: d => {
    const m = DAILIES.find(x => x.id === d.id);
    if (!m || S.daily.claimed[m.id] || (S.daily[m.id] || 0) < m.goal) return;
    S.daily.claimed[m.id] = 1; give(m.reward); sfx("heal"); renderTop(); missionsModal();
  },
  claimAllDaily: () => { if (S.daily.claimed.all) return; S.daily.claimed.all = 1; give(DAILY_ALL); sfx("win"); renderTop(); missionsModal(); },
  claimAch: d => {
    const a = ACHIEVEMENTS.find(x => x.id === d.id);
    if (!a || S.ach[a.id] || !a.test()) return;
    S.ach[a.id] = 1; give(a.reward); sfx("heal"); renderTop(); missionsModal();
  },

  // shop
  shopTab: d => { UI.shopTab = d.t; rerender(); },
  buy: d => {
    const it = SHOP[d.t].find(x => x.id === d.id), cur = d.t;
    if (!it || S[cur] < it.cost) { toast("Not enough currency."); return; }
    S[cur] -= it.cost;
    const list = give(it.give); sfx("heal");
    if (UI.view === "shop") rerender(); else renderTop();
    rewardModal("Purchased", list, it.n);
  },

  // settings
  toggleSound: () => { S.settings.sound = !S.settings.sound; save(); settingsModal(false); },
  cycleAi: () => { const o = ["balanced", "aggressive", "safe"]; S.settings.ai = o[(o.indexOf(S.settings.ai) + 1) % 3]; save(); settingsModal(false); },
  askReset: () => settingsModal(true),
  doReset: () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* storage unavailable */ } S = migrate(newSave()); closeModal(); route("home"); introModal(); },
  saveName: () => { const v = ($("#pname") || {}).value; S.name = (v || "").trim().slice(0, 16) || "Doctor"; closeModal(); rerender(); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});

// =====================================================================
//  BOOT
// =====================================================================
function migrate(s) {
  s.hunt = s.hunt || {}; s.chRw = s.chRw || {};
  for (const k in s.team) s.team[k] = s.team[k].filter(x => OPS[x]);
  for (const k in s.ops) if (!OPS[k]) delete s.ops[k];
  if (!s.ops[s.assistant]) s.assistant = Object.keys(s.ops)[0] || "amiya";
  return s;
}
function start(data) {
  S = migrate((data && data.save) || load() || newSave());
  UI.huntLv = {};
  tickTimers();
  route("home");
  if (!S.seenIntro) introModal();
  setInterval(() => {
    if (BT.on) { tickTimers(); return; }
    const sig = () => [S.sanity, S.arena.attempts, Date.now() - S.arena.payTime >= PAYOUT_MS].join("|");
    const before = sig();
    tickTimers();
    const now = Date.now(), A = S.arena;
    if (before !== sig()) { save(); if (UI.view === "arena" && !$("#modal").innerHTML) rerender(); else renderTop(); }
    for (const el of $$("[data-cd]")) {
      const left = { att: ARENA_MS - (now - A.aTime), pay: PAYOUT_MS - (now - A.payTime) }[el.dataset.cd];
      el.textContent = dur(Math.max(0, left));
    }
  }, 1000);
  window.addEventListener("pagehide", () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } } });
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: S }));
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot && window.claude.hot.data || {});
</script>
